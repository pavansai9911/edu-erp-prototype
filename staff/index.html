      <div class="field"><label class="field-label">${editing?'Reset login password':'Set login password'}${editing?'':' <span class="req">*</span>'}</label>
        <div class="input-affix"><span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('lock')}</span>
        <input class="input" style="padding-left:42px" id="st-pass" type="text" placeholder="${editing?'Leave blank to keep current':'Temporary password'}" value="${editing?'':d.password||''}" oninput="App._staffField('password',this.value)"></div>
        <div class="field-hint">They'll be asked to change it on first login.</div></div>

      <div class="sec-head"><div class="sec-title">Employment</div><span class="t-caption">Mirrors StaffCreate schema</span></div>
      <div class="field"><label class="field-label">Designation <span class="req">*</span></label>
        <input class="input" id="st-desig" placeholder="e.g. Class Teacher, Librarian, Accountant" value="${d.designation||''}" oninput="App._staffField('designation',this.value)"></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Employee code <span class="req">*</span></label>
          <input class="input t-code" id="st-empcode" placeholder="e.g. EMP-001" value="${d.employee_code||''}" oninput="App._staffField('employee_code',this.value.toUpperCase())" style="text-transform:uppercase">
          <div class="field-hint">Unique ID for reports.</div></div>
        <div class="field"><label class="field-label">Date of joining <span class="req">*</span></label>
          <input class="input" id="st-doj" type="date" value="${d.date_of_joining||new Date().toISOString().split('T')[0]}" oninput="App._staffField('date_of_joining',this.value)"></div>
      </div>
      <div class="field"><label class="field-label">Employment type</label>
        <select class="select" id="st-emptype" onchange="App._staffField('employment_type',this.value)">
          ${[['full_time','Full-time'],['part_time','Part-time'],['contract','Contract'],['visiting','Visiting']].map(([v,l])=>`<option value="${v}" ${(d.employment_type||'full_time')===v?'selected':''}>${l}</option>`).join('')}
        </select></div>
      <div class="field"><label class="field-label">Department</label>
        <select class="select" id="st-dept" onchange="App._staffField('department',this.value)">
          <option value="">Select department</option>
          ${depts.map(x=>`<option ${d.department===x?'selected':''}>${x}</option>`).join('')}
        </select></div>
      ${branches.length>0?`<div class="field"><label class="field-label">Branch</label>
        <select class="select" id="st-branch" onchange="App._staffField('branch_public_id',this.value)">
          ${branches.map(b=>`<option value="${b.public_id||b.id}" ${(d.branch_public_id||'BR-01')===(b.public_id||b.id)?'selected':''}>${b.branch_name||b.name}</option>`).join('')}
        </select></div>`:''}
      <div class="field"><label class="field-label">Reports to</label>
        <select class="select" id="st-mgr" onchange="App._staffField('reportsToId',this.value)">
          <option value="">— None (top level) —</option>
          ${managers.map(u=>`<option value="${u.id}" ${d.reportsToId===u.id?'selected':''}>${u.name} · ${u.designation}</option>`).join('')}
        </select></div>

      <div class="sec-head"><div class="sec-title">Role &amp; permissions</div></div>
      <p class="t-caption mb-3">Pick a role to pre-fill its permissions, then fine-tune below if this person needs something different.</p>
      <div class="field"><label class="field-label">Role <span class="req">*</span></label>
        <select class="select" id="st-role" onchange="App.pickStaffRole(this.value)">
          ${roles.map(r=>`<option value="${r.id}" ${d.roleId===r.id?'selected':''}>${r.name}${r.system?'':' (custom)'}</option>`).join('')}
        </select>
        <div class="field-hint" id="role-hint">${this._roleHint()}</div></div>
      <div id="perm-picker">${this._permPickerMarkup()}</div>

      <div id="st-err"></div>
      <div class="wiz-footer"><button class="btn btn-primary btn-full btn-lg" onclick="App.saveStaff(${editing})">${icon('check')} ${editing?'Save changes':'Create staff & login'}</button></div>`;
  },
  _roleHint(){ const r=this.S.roleById(this._staffDraft.roleId); return r?`${r.name}: ${r.desc}`:''; },
  _staffField(k,v){ this._staffDraft[k]=v; },
  pickStaffRole(roleId){
    this._staffDraft.roleId=roleId;
    const r=this.S.roleById(roleId);
    this._permDraft = new Set(r?r.perms:[]);
    this._permCustomised=false;
    document.getElementById('role-hint').textContent=this._roleHint();
    document.getElementById('perm-picker').innerHTML=this._permPickerMarkup();
  },
  _permPickerMarkup(){
    const total=this.S.allPerms().length; const on=this._permDraft.size;
    this._permOpenModules=this._permOpenModules||new Set();
    return `
      <div class="card mb-2 flex between items-center" style="background:var(--brand-subtle);border-color:transparent">
        <div><div class="t-label" style="font-weight:700;color:var(--brand)">${on} of ${total} permissions</div>
          <div class="t-caption">${this._permCustomised?'Customised for this person':'Matches the '+(this.S.roleById(this._staffDraft.roleId)||{}).name+' role'}</div></div>
        ${this._permCustomised?`<button class="btn btn-secondary btn-sm" onclick="App.resetPerms()">Reset to role</button>`:''}
      </div>
      ${this.S.CATALOG.map(m=>{
        const open=this._permOpenModules.has(m.module_code||m.module);
        const modOn=m.perms.filter(p=>this._permDraft.has(p.code)).length;
        return `<div class="card card-pad-0 mb-2">
          <div class="row" onclick="App.togglePermModule('${m.module_code||m.module}')" style="cursor:pointer">
            <div class="avatar avatar-sq" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon(m.icon)}</div>
            <div class="row-main"><div class="row-title" style="font-weight:600">${m.label||m.module_name}</div><div class="row-sub">${modOn} of ${m.perms.length} selected</div></div>
            <span style="transform:rotate(${open?180:0}deg);transition:transform .2s;color:var(--text-tertiary)">${icon('chevronD')}</span>
          </div>
          ${open?`<div style="padding:4px 12px 12px">${m.perms.map(p=>{
            const checked=this._permDraft.has(p.code);
            return `<div class="perm-check ${checked?'on':''}" onclick="App.togglePerm('${p.code}')">
              <div class="perm-box">${checked?icon('check'):''}</div>
              <div class="flex-1"><div class="t-label" style="font-weight:500">${p.action}</div><div class="t-code" style="font-size:11px;color:var(--text-tertiary)">${p.code}</div></div>
            </div>`; }).join('')}</div>`:''}
        </div>`; }).join('')}`;
  },
  togglePermModule(mod){ if(this._permOpenModules.has(mod))this._permOpenModules.delete(mod); else this._permOpenModules.add(mod); document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  togglePerm(code){ if(this._permDraft.has(code))this._permDraft.delete(code); else this._permDraft.add(code); this._permCustomised=true; document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  resetPerms(){ const r=this.S.roleById(this._staffDraft.roleId); this._permDraft=new Set(r?(r.permission_codes||r.perms):[]); this._permCustomised=false; document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  saveStaff(editing){
    const d=this._staffDraft; const err=document.getElementById('st-err');
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
    if(!d.name.trim()||!d.email.trim()||!d.designation.trim()){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name, login email and designation are required.</div>`; return; }
    if(!emailOk){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Enter a valid login email.</div>`; return; }
    if(!editing && !d.password.trim()){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Set a login password for the new staff member.</div>`; return; }
    // If permissions were customised away from the template role, persist as a per-user custom role
    let roleId=d.roleId;
    if(this._permCustomised){
      const base=this.S.roleById(d.roleId);
      const custom=this.S.addRole({name:d.name.split(' ')[0]+' — custom',desc:'Custom access based on '+(base?base.name:'a role'),perms:[...this._permDraft]});
      roleId=custom.id;
    }
    if(editing){
      const patch={name:d.name,email:d.email,designation:d.designation,department:d.department,
        employment_type:d.employment_type||'full_time',
        reporting_to_user_public_id:d.reportsToId||null,
        reportsToId:d.reportsToId||null,roleId};
      if(d.password && d.password!=='••••••••'){ patch.password=d.password; patch.passwordSet=true; }
      this.S.updateStaff(this.ctx.id,patch);
      UI.toast('Staff updated');
      this.go('staffDetail',{sub:true,id:this.ctx.id,title:'Staff'});
    }else{
      const u=this.S.addStaff({
        name:d.name, email:d.email, phone_number:d.phone_number||null,
        password:d.password, designation:d.designation, department:d.department,
        reportsToId:d.reportsToId||null, roleId, section:d.section||null,
        employee_code:d.employee_code||null,
        date_of_joining:d.date_of_joining||new Date().toISOString().split('T')[0],
        employment_type:d.employment_type||'full_time',
        branch_public_id:d.branch_public_id||'BR-01',
      });
      this._staffCreatedToast(u);
      this.go('staffList');
    }
  },
  _staffCreatedToast(u){ UI.toast(`${u.name} added — login created for ${u.email}`); },

  /* ---- ROLES & PERMISSIONS ---- */
  Roles(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Roles & permissions';
    this.ctx.subtitle=this.S.roles().length+' roles';
    this.ctx.action=this.S.can(this.S.PERMS.ROLE_UPDATE)
      ?`<button class="appbar-btn" onclick="App.newRoleSheet()" aria-label="New role">${icon('plus')}</button>`:'' ;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const roles=this.S.roles();
    el.innerHTML=`
      <p class="t-caption mb-3">Roles are editable permission bundles. Every staff member holds a role; a custom role can be created from scratch or cloned from a system role.</p>
      <div class="card card-pad-0 mb-4"><div class="list">
        ${roles.map(r=>{
          const count=this.S.staffUsers().filter(u=>u.roleId===(r.public_id||r.id)).length;
          const perms=(r.permission_codes||r.perms||[]).length;
          return `<div class="row" onclick="App.openRole('${r.public_id||r.id}')">
            <div class="avatar avatar-sq" style="background:${r.is_system_role||r.system?'var(--info-subtle)':'var(--brand-subtle)'};color:${r.is_system_role||r.system?'var(--info)':'var(--brand)'}">${icon('shield')}</div>
            <div class="row-main">
              <div class="row-title">${r.role_name||r.name}
                ${!(r.is_system_role||r.system)?'<span class="chip chip-neutral" style="margin-left:4px;font-size:10px">custom</span>':''}
                ${r.hierarchy_level!==null&&r.hierarchy_level!==undefined?`<span class="t-caption" style="color:var(--text-tertiary)"> L${r.hierarchy_level}</span>`:''}
              </div>
              <div class="row-sub">${perms} permissions · ${count} staff</div>
            </div>
            <span class="row-chev">${icon('chevronR')}</span></div>`;
        }).join('')}
      </div></div>
      <div class="dashed-card">${icon('shield')} <span class="t-caption">System roles (blue) are templates — editable but not deleteable. Custom roles are fully manageable.</span></div>`;
  },
  openRole(id){ if(!id)return; this.go('roleDetail',{sub:true,id,title:'Role'}); },
  RoleDetail(el){
    const r=this.S.roleById(this.ctx.id); if(!r){ el.innerHTML='<div class="state"><div class="state-title">Not found</div></div>'; return; }
    this._backTo='roles';
    const isSystem=r.is_system_role||r.system;
    const canEdit=this.S.can(this.S.PERMS.ROLE_UPDATE);
    this.ctx.title=r.role_name||r.name;
    this.ctx.subtitle=isSystem?'System role':'Custom role';
    this.ctx.action=canEdit?`<button class="appbar-btn" onclick="App.editRoleSheet('${r.public_id||r.id}')" aria-label="Edit">${icon('edit')}</button>`:'';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const staffCount=this.S.staffUsers().filter(u=>u.roleId===(r.public_id||r.id)).length;
    const perms=r.permission_codes||r.perms||[];
    el.innerHTML=`
      <div class="card card-raised mb-4">
        <div class="flex between items-center mb-3">
          <div>
            <div class="t-h3">${r.role_name||r.name}</div>
            <div class="row-sub t-code">${r.role_code||r.code}</div>
          </div>
          <div class="flex gap-2">
            ${isSystem?'<span class="chip chip-info">System</span>':'<span class="chip chip-neutral">Custom</span>'}
            <span class="chip ${r.is_active!==false?'chip-success':'chip-neutral'}">${r.is_active!==false?'Active':'Inactive'}</span>
          </div>
        </div>
        <div class="dl">
          <div class="dl-row"><span class="dl-key">Description</span><span class="dl-val">${r.description||r.desc||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Hierarchy level</span><span class="dl-val">${r.hierarchy_level!==null&&r.hierarchy_level!==undefined?`L${r.hierarchy_level}`:'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Permissions</span><span class="dl-val t-data">${perms.length}</span></div>
          <div class="dl-row"><span class="dl-key">Assigned to</span><span class="dl-val">${staffCount} staff member${staffCount!==1?'s':''}</span></div>
        </div>
      </div>

      <div class="sec-head">
        <div class="sec-title">Permissions by module</div>
        ${canEdit?`<button class="sec-link" onclick="App.editPermissionsSheet('${r.public_id||r.id}')">Edit permissions</button>`:''}
      </div>
      ${this.S.CATALOG.map(m=>{ const granted=m.perms.filter(p=>(r.permission_codes||r.perms||[]).includes(p.code)); if(granted.length===0)return '';
        return `<div class="card card-pad-0 mb-2"><div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon(m.icon)}</div>
          <div class="row-main"><div class="row-title" style="font-weight:600">${m.label||m.module_name}</div><div class="row-sub">${granted.map(p=>p.action).join(' · ')}</div></div>
          <span class="chip chip-brand">${granted.length}</span></div></div>`; }).join('')}

      ${canEdit&&!isSystem?`<div class="flex gap-2 mt-4">
        <button class="btn btn-secondary btn-full" onclick="App.editRoleSheet('${r.public_id||r.id}')">${icon('edit')} Edit details</button>
        <button class="btn btn-danger-soft btn-full" onclick="App._deleteRole('${r.public_id||r.id}')">${icon('trash')} Delete</button>
      </div>`:''}
      ${isSystem?`<div class="dashed-card mt-3">${icon('shield')} <span class="t-caption">System roles cannot be deleted. You can edit their permissions and description, but the role code is immutable.</span></div>`:''}
    `;
  },

  /* === NEW ROLE (RoleCreate) === */
  newRoleSheet(){
    const {close}=UI.sheet(`
      <div class="sheet-title">New role</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors POST /roles (RoleCreate)</p>
      <div class="field"><label class="field-label">Role name <span class="req">*</span></label>
        <input class="input" id="rl-name" placeholder="e.g. Library Manager, Lab Assistant"></div>
      <div class="field"><label class="field-label">Role code <span class="req">*</span></label>
        <input class="input t-code" id="rl-code" placeholder="e.g. LIB_MGR" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
        <div class="field-hint">Immutable after creation — used in API calls and audit logs.</div></div>
      <div class="field"><label class="field-label">Description</label>
        <textarea class="textarea" id="rl-desc" placeholder="What does this role do?" rows="2"></textarea></div>
      <div class="field"><label class="field-label">Hierarchy level</label>
        <input class="input" id="rl-hlevel" type="number" min="1" max="10" placeholder="e.g. 3 (1=highest)">
        <div class="field-hint">Optional — defines approval chain depth.</div></div>
      <div class="field"><label class="field-label">Start from a system role</label>
        <select class="select" id="rl-base">
          <option value="">— Start from scratch —</option>
          ${this.S.roles().filter(r=>r.is_system_role||r.system).map(r=>`<option value="${r.public_id||r.id}">${r.role_name||r.name}</option>`).join('')}
        </select>
        <div class="field-hint">Pre-fills permissions; you can fine-tune after saving.</div></div>
      <div id="rl-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveNewRole()">Create role</button>
    `);
    this._roleClose=close;
  },
  _saveNewRole(){
    const name=document.getElementById('rl-name').value.trim();
    const code=document.getElementById('rl-code').value.trim();
    const desc=document.getElementById('rl-desc').value.trim();
    const level=parseInt(document.getElementById('rl-hlevel').value)||null;
    const baseId=document.getElementById('rl-base').value;
    const err=document.getElementById('rl-err');
    if(!name||!code){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name and code are required.</div>`; return; }
    const baseRole=baseId?this.S.roleById(baseId):null;
    const perms=baseRole?(baseRole.permission_codes||baseRole.perms||[]):[];
    const result=this.S.addRole({role_name:name,role_code:code,description:desc,hierarchy_level:level,perms});
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._roleClose&&this._roleClose();
    this.Roles(document.getElementById('screen'));
    UI.toast(`"${name}" created`);
  },

  /* === EDIT ROLE (RoleUpdate) === */
  editRoleSheet(id){
    const r=this.S.roleById(id); if(!r) return;
    const {close}=UI.sheet(`
      <div class="sheet-title">Edit role</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors PATCH /roles/{id} (RoleUpdate) — role_code is immutable</p>
      <div class="field"><label class="field-label">Role name</label>
        <input class="input" id="rl-name" value="${r.role_name||r.name}"></div>
      <div class="field"><label class="field-label">Role code (read-only)</label>
        <input class="input t-code" value="${r.role_code||r.code}" disabled style="opacity:0.5"></div>
      <div class="field"><label class="field-label">Description</label>
        <textarea class="textarea" id="rl-desc" rows="2">${r.description||r.desc||''}</textarea></div>
      <div class="field"><label class="field-label">Hierarchy level</label>
        <input class="input" id="rl-hlevel" type="number" min="1" max="10" value="${r.hierarchy_level??''}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="rl-active" ${r.is_active!==false?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="rl-active" class="field-label" style="margin:0">Role is active</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveRoleEdit('${id}')">Save changes</button>
    `);
    this._roleEditClose=close;
  },
  _saveRoleEdit(id){
    const name=document.getElementById('rl-name').value.trim();
    const desc=document.getElementById('rl-desc').value.trim();
    const level=parseInt(document.getElementById('rl-hlevel').value)||null;
    const active=document.getElementById('rl-active').checked;
    if(!name){ UI.toast('Role name cannot be empty','error'); return; }
    this.S.updateRole(id,{role_name:name,description:desc,hierarchy_level:level,is_active:active});
    this._roleEditClose&&this._roleEditClose();
    this.RoleDetail(document.getElementById('screen'));
    UI.toast('Role updated');
  },
  _deleteRole(id){
    const r=this.S.roleById(id); if(!r) return;
    UI.confirm({title:`Delete "${r.role_name||r.name}"?`,
      message:'Staff assigned this role will lose all permissions immediately. This cannot be undone.',
      confirmText:'Delete',danger:true
    }).then(ok=>{
      if(!ok) return;
      const result=this.S.deleteRole(id);
      if(result&&result.error){ UI.toast(result.error,'error'); return; }
      this.go('roles');
      UI.toast(`"${r.role_name||r.name}" deleted`);
    });
  },

  /* === EDIT PERMISSIONS (RolePermissionsUpdate) === */
  editPermissionsSheet(id){
    /* Mirrors PUT /roles/{id}/permissions (RolePermissionsUpdate{permission_codes:[]}) */
    const r=this.S.roleById(id); if(!r) return;
    const currentPerms=new Set(r.permission_codes||r.perms||[]);
    const {close}=UI.sheet(`
      <div class="sheet-title">Edit permissions</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors PUT /roles/{id}/permissions (RolePermissionsUpdate) — full replace</p>
      <div class="card card-pad-0 mb-3"><div class="list">
        ${this.S.CATALOG.map(m=>`
          <div>
            <div class="row" style="cursor:pointer;background:var(--surface-sunken)" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
              <div class="avatar avatar-sq" style="background:transparent;color:var(--text-secondary)">${icon(m.icon)}</div>
              <div class="row-main"><div class="row-title" style="font-weight:600">${m.label||m.module_name}</div>
                <div class="row-sub">${m.perms.filter(p=>currentPerms.has(p.code)).length}/${m.perms.length} granted</div></div>
              <span style="color:var(--text-tertiary)">${icon('chevronD')}</span>
            </div>
            <div style="padding:4px 12px 8px">
              ${m.perms.map(p=>`
                <label style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--border-subtle)">
                  <input type="checkbox" class="rp-perm" data-code="${p.code}" ${currentPerms.has(p.code)?'checked':''}
                    style="margin-top:2px;width:16px;height:16px;accent-color:var(--brand);flex-shrink:0">
                  <div><div class="t-label" style="font-weight:500">${p.action}</div>
                    <div class="t-caption" style="color:var(--text-tertiary)">${p.description||p.code}</div></div>
                </label>`).join('')}
            </div>
          </div>`).join('')}
      </div></div>
      <div class="flex gap-2 mb-2">
        <button class="btn btn-secondary btn-sm" onclick="document.querySelectorAll('.rp-perm').forEach(c=>c.checked=true)">Select all</button>
        <button class="btn btn-secondary btn-sm" onclick="document.querySelectorAll('.rp-perm').forEach(c=>c.checked=false)">Clear all</button>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-2" onclick="App._savePermissions('${id}')">Save permissions</button>
    `);
    this._permEditClose=close;
  },
  _savePermissions(id){
    const codes=[...document.querySelectorAll('.rp-perm:checked')].map(el=>el.dataset.code);
    this.S.updateRolePermissions(id,codes);
    this._permEditClose&&this._permEditClose();
    this.RoleDetail(document.getElementById('screen'));
    UI.toast(`${codes.length} permissions saved (PUT /roles/{id}/permissions)`);
  },

  /* ========================================================================
     PHASE D STUBS — flesh out in Phase D. Kept minimal so rows don't dead-end.
     ======================================================================== */
  /* ========================================================================
     PHASE D — SELF CHECK-IN, STAFF ATTENDANCE OVERVIEW, ACADEMIC STRUCTURE
     ======================================================================== */

  /* ---- SELF CHECK-IN/OUT — every staff member, permission-gated by STAFF.ATTENDANCE.CREATE ---- */
  SelfCheckIn(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Self check-in'; this.ctx.subtitle='';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    if(!this.S.can(this.S.PERMS.STAFF_ATT_CREATE)) return this.noPermission(el);
    el.innerHTML=this._checkInMarkup();
  },
  _checkInMarkup(){
    const rec=this.S.myStaffAttendance();
    const today=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    const history=this.S.myRecentAttendance(6).slice(1); // exclude today, show last 5 days
    let status,action;
    if(!rec||!rec.checkIn){
      status=`<div class="card card-raised mb-4" style="text-align:center;padding:32px 20px">
        <div class="mb-2" style="color:var(--text-tertiary)">${icon('clock')}</div>
        <div class="t-h3 mb-1">Not checked in yet</div><div class="row-sub">${today}</div></div>`;
      action=`<button class="btn btn-primary btn-full btn-lg" onclick="App.doCheckIn()">${icon('check')} Check in</button>`;
    }else if(rec.checkIn && !rec.checkOut){
      status=`<div class="card card-raised mb-4" style="text-align:center;padding:32px 20px;background:var(--success-subtle);border-color:transparent">
        <div class="mb-2" style="color:var(--success)">${icon('checkCircle')}</div>
        <div class="t-h3 mb-1" style="color:var(--success)">Checked in</div><div class="row-sub">${fmt.date(rec.checkIn)} · ${new Date(rec.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
      action=`<button class="btn btn-secondary btn-full btn-lg" onclick="App.doCheckOut()">${icon('check')} Check out</button>`;
    }else{
      const dur=Math.round((new Date(rec.checkOut)-new Date(rec.checkIn))/60000);
      status=`<div class="card card-raised mb-4" style="text-align:center;padding:32px 20px">
        <div class="mb-2" style="color:var(--brand)">${icon('checkCircle')}</div>
        <div class="t-h3 mb-1">Done for today</div>
        <div class="row-sub">In ${new Date(rec.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · Out ${new Date(rec.checkOut).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ${Math.floor(dur/60)}h ${dur%60}m</div></div>`;
      action=`<button class="btn btn-secondary btn-full btn-lg" onclick="App.doCheckOut()">${icon('clock')} Update check-out time</button>`;
    }
    return `${status}${action}
      <div class="sec-head mt-4"><div class="sec-title">This week</div></div>
      <div class="card card-pad-0 mb-4"><div class="list">${history.map(h=>{
        const d=new Date(h.date); const label=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
        const present=!!h.checkIn;
        return `<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:${present?'var(--success-subtle)':'var(--surface-sunken)'};color:${present?'var(--success)':'var(--text-tertiary)'}">${icon(present?'check':'clock')}</div>
        <div class="row-main"><div class="row-title" style="font-weight:500">${label}</div><div class="row-sub">${present?(new Date(h.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+(h.checkOut?' – '+new Date(h.checkOut).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):' · still open')):'Not checked in'}</div></div></div>`; }).join('')}</div></div>`;
  },
  doCheckIn(){ this.S.staffCheckIn(); UI.toast('Checked in · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})); document.getElementById('screen').innerHTML=this._checkInMarkup(); },
  doCheckOut(){ this.S.staffCheckOut(); UI.toast('Checked out · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})); document.getElementById('screen').innerHTML=this._checkInMarkup(); },

  /* ---- STAFF ATTENDANCE OVERVIEW (Principal) — who's in today, at a glance ---- */
  StaffAttendance(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Staff attendance'; this.ctx.subtitle=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    if(!(this.S.can(this.S.PERMS.STAFF_ATT_VIEW)&&this.S.can(this.S.PERMS.STAFF_VIEW))) return this.noPermission(el);
    const roster=this.S.staffAttendanceRoster();
    // not-checked-in first, so a Principal notices gaps immediately
    const sorted=[...roster].sort((a,b)=>(a.checkIn?1:0)-(b.checkIn?1:0));
    const inCount=roster.filter(r=>r.checkIn).length;
    el.innerHTML=`
      <div class="grid-2 mb-4">
        ${this.dashKpi('checkCircle','Checked in',inCount,'var(--viz-positive)','of '+roster.length+' staff')}
        ${this.dashKpi('clock','Not yet',roster.length-inCount,(roster.length-inCount)?'var(--viz-warning)':'var(--viz-positive)')}
      </div>
      <div class="card card-pad-0 mb-4"><div class="list">${sorted.map(r=>{
        const state = !r.checkIn ? ['warning','Not checked in','clock'] : !r.checkOut ? ['success','Checked in','checkCircle'] : ['neutral','Checked out','check'];
        const time = r.checkIn ? new Date(r.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) + (r.checkOut?' – '+new Date(r.checkOut).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'') : '—';
        return `<div class="row" style="cursor:default"><div class="avatar" style="background:${avatarColor(r.name)}">${initials(r.name)}</div>
          <div class="row-main"><div class="row-title">${r.name}</div><div class="row-sub">${r.designation} · ${time}</div></div>
          <span class="chip chip-${state[0]}">${state[1]}</span></div>`; }).join('')}</div></div>`;
  },

  /* ---- ACADEMIC STRUCTURE (Principal) — class levels, sections, subjects CRUD ---- */
  AcademicStructure(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Academic structure'; this.ctx.subtitle='Full CRUD — 5 entity types';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    if(!this.S.can(this.S.PERMS.ACADEMIC_MANAGE)) return this.noPermission(el);
    this._acadTab=this._acadTab||'classLevels';
    el.innerHTML=this._academicMarkup();
  },
  _academicMarkup(){
    const a=this.S.academic(); const tab=this._acadTab;
    const tabs=[
      ['sessions','Sessions',(a.academicSessions||[]).length],
      ['programs','Programs',(a.programs||[]).length],
      ['classLevels','Classes',(a.classLevels||[]).length],
      ['sections','Sections',(a.sections||[]).length],
      ['subjects','Subjects',(a.subjects||[]).length],
    ];
    return `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin:0 -16px;padding:0 16px 4px">
      <div class="filter-row" style="flex-nowrap:nowrap;flex-wrap:nowrap;min-width:max-content;gap:6px;margin-bottom:16px">
        ${tabs.map(([k,l,n])=>`<button class="filter-chip ${tab===k?'active':''}" style="white-space:nowrap" onclick="App.setAcadTab('${k}')">${l} (${n})</button>`).join('')}
      </div></div>
      <div id="acad-content">${this._acadContent()}</div>`;
  },
  setAcadTab(k){ this._acadTab=k; document.getElementById('screen').innerHTML=this._academicMarkup(); },
  _acadContent(){
    const S=this.S; const a=S.academic(); const tab=this._acadTab;

    if(tab==='sessions'){
      /* AcademicSessionOut: public_id, session_label, start_date, end_date, is_current, status */
      const items=a.academicSessions||[];
      return `${items.length===0?`<div class="dashed-card mb-3">No sessions yet. Add the current academic year first.</div>`
        :`<div class="card card-pad-0 mb-4"><div class="list">${items.map(s=>`<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:${s.is_current?'var(--brand-subtle)':'var(--surface-sunken)'};color:${s.is_current?'var(--brand)':'var(--text-tertiary)'}">${icon('calendar')}</div>
          <div class="row-main"><div class="row-title">${s.session_label}${s.is_current?' <span class="chip chip-brand" style="font-size:10px">Current</span>':''}</div>
            <div class="row-sub">${s.start_date} → ${s.end_date} · ${s.status}</div></div>
          <div class="flex gap-1">
            <button class="appbar-btn" onclick="App._editSession('${s.public_id||s.id}')" aria-label="Edit">${icon('edit')}</button>
          </div></div>`).join('')}</div></div>`}
      <button class="btn btn-primary btn-full" onclick="App._addSession()">${icon('plus')} Add academic session</button>`;

    } else if(tab==='programs'){
      /* ProgramOut: public_id, program_name, program_code, program_level, is_active */
      const items=a.programs||[];
      const levelLabel={pre_primary:'Pre-Primary',primary:'Primary',secondary:'Secondary',higher_secondary:'Higher Secondary',diploma:'Diploma',undergraduate:'UG',postgraduate:'PG',doctoral:'Doctoral',certificate:'Certificate',custom:'Custom'};
      return `${items.length===0?`<div class="dashed-card mb-3">No programs yet.</div>`
        :`<div class="card card-pad-0 mb-4"><div class="list">${items.map(p=>`<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:${p.is_active?'var(--info-subtle)':'var(--surface-sunken)'};color:${p.is_active?'var(--info)':'var(--text-tertiary)'}">${icon('building2')}</div>
          <div class="row-main"><div class="row-title">${p.program_name} <span class="t-code" style="font-size:11px">${p.program_code}</span></div>
            <div class="row-sub">${levelLabel[p.program_level]||p.program_level}${p.duration_unit_count?` · ${p.duration_unit_count} ${p.duration_unit_type||'years'}`:''}</div></div>
          <div class="flex gap-1">
            <button class="appbar-btn" onclick="App._editProgram('${p.public_id||p.id}')" aria-label="Edit">${icon('edit')}</button>
            <button class="appbar-btn" style="color:var(--danger)" onclick="App._deleteProgram('${p.public_id||p.id}')" aria-label="Delete">${icon('trash')}</button>
          </div></div>`).join('')}</div></div>`}
      <button class="btn btn-primary btn-full" onclick="App._addProgram()">${icon('plus')} Add program</button>`;

    } else if(tab==='classLevels'){
      /* ClassLevelOut: public_id, class_name, sequence_order, program_public_id, is_active */
      const items=[...(a.classLevels||[])].sort((a,b)=>a.sequence_order-b.sequence_order);
      const progMap=Object.fromEntries((a.programs||[]).map(p=>[p.public_id||p.id,p.program_name]));
      return `${items.length===0?`<div class="dashed-card mb-3">No class levels yet.</div>`
        :`<div class="card card-pad-0 mb-4"><div class="list">${items.map(c=>{
          const subjectCount=((a.classSubjectMappings||{})[c.public_id||c.id]||[]).length;
          return `<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:${c.is_active?'var(--brand-subtle)':'var(--surface-sunken)'};color:${c.is_active?'var(--brand)':'var(--text-tertiary)'}">${icon('building2')}</div>
          <div class="row-main"><div class="row-title">${c.class_name||c.name} <span class="t-caption" style="color:var(--text-tertiary)">·${c.sequence_order}</span></div>
            <div class="row-sub">${progMap[c.program_public_id]||'—'} · ${subjectCount} subjects mapped</div></div>
          <div class="flex gap-1">
            <button class="appbar-btn" onclick="App._editClassLevel('${c.public_id||c.id}')" aria-label="Edit">${icon('edit')}</button>
            <button class="appbar-btn" onclick="App._mapSubjects('${c.public_id||c.id}')" aria-label="Subjects" title="Map subjects">${icon('check')}</button>
            <button class="appbar-btn" style="color:var(--danger)" onclick="App._deleteClassLevel('${c.public_id||c.id}')" aria-label="Delete">${icon('trash')}</button>
          </div></div>`;
        }).join('')}</div></div>`}
      <button class="btn btn-primary btn-full" onclick="App._addClassLevel()">${icon('plus')} Add class level</button>`;

    } else if(tab==='sections'){
      /* SectionOut: section_name, class_level_public_id, class_teacher_user_public_id, max_capacity */
      const items=a.sections||[];
      const teachers=S.staffUsers();
      const teacherMap=Object.fromEntries(teachers.map(t=>[t.id,t.name]));
      const clMap=Object.fromEntries((a.classLevels||[]).map(c=>[c.public_id||c.id,c.class_name||c.name]));
      return `${items.length===0?`<div class="dashed-card mb-3">No sections yet.</div>`
        :`<div class="card card-pad-0 mb-4"><div class="list">${items.map(s=>`<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:${s.is_active?'var(--success-subtle)':'var(--surface-sunken)'};color:${s.is_active?'var(--success)':'var(--text-tertiary)'}">${icon('users')}</div>
          <div class="row-main"><div class="row-title">${s.section_name||s.name}</div>
            <div class="row-sub">${clMap[s.class_level_public_id]||s.classLevel||'—'} · ${s.class_teacher_user_public_id?teacherMap[s.class_teacher_user_public_id]||'Teacher':'No class teacher'}${s.max_capacity?` · max ${s.max_capacity}`:''}</div></div>
          <div class="flex gap-1">
            <button class="appbar-btn" onclick="App._editSection('${s.public_id||s.id}')" aria-label="Edit">${icon('edit')}</button>
            <button class="appbar-btn" style="color:var(--danger)" onclick="App._deleteSection('${s.public_id||s.id}')" aria-label="Delete">${icon('trash')}</button>
          </div></div>`).join('')}</div></div>`}
      <button class="btn btn-primary btn-full" onclick="App._addSection()">${icon('plus')} Add section</button>`;

    } else { // subjects
      /* SubjectOut: subject_name, subject_code, is_elective, is_active */
      const items=a.subjects||[];
      return `${items.length===0?`<div class="dashed-card mb-3">No subjects yet.</div>`
        :`<div class="card card-pad-0 mb-4"><div class="list">${items.map(s=>`<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:${s.is_active?'var(--info-subtle)':'var(--surface-sunken)'};color:${s.is_active?'var(--info)':'var(--text-tertiary)'}">${icon('building2')}</div>
          <div class="row-main"><div class="row-title">${s.subject_name||s.name} <span class="t-code" style="font-size:11px">${s.subject_code||s.code}</span></div>
            <div class="row-sub">${s.is_elective?'Elective':'Core'}${!s.is_active?' · Inactive':''}</div></div>
          <div class="flex gap-1">
            <button class="appbar-btn" onclick="App._editSubject('${s.public_id||s.id}')" aria-label="Edit">${icon('edit')}</button>
            <button class="appbar-btn" style="color:var(--danger)" onclick="App._deleteSubject('${s.public_id||s.id}')" aria-label="Delete">${icon('trash')}</button>
          </div></div>`).join('')}</div></div>`}
      <button class="btn btn-primary btn-full" onclick="App._addSubject()">${icon('plus')} Add subject</button>`;
    }
  },

  /* === SESSION CRUD === */
  _addSession(){
    const {close}=UI.sheet(`<div class="sheet-title">Add academic session</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors POST /academic-sessions (AcademicSessionCreate)</p>
      <div class="field"><label class="field-label">Session label <span class="req">*</span></label>
        <input class="input" id="ac-slabel" placeholder="e.g. 2027-28"></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">Start date <span class="req">*</span></label>
          <input class="input" id="ac-sstart" type="date"></div>
        <div class="field"><label class="field-label">End date <span class="req">*</span></label>
          <input class="input" id="ac-send" type="date"></div>
      </div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-scurrent" style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-scurrent" class="field-label" style="margin:0">Set as current session</label>
      </div>
      <div id="ac-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveSession()">Add session</button>`);
    this._acadClose=close;
  },
  _saveSession(){
    const label=document.getElementById('ac-slabel').value.trim();
    const start=document.getElementById('ac-sstart').value;
    const end=document.getElementById('ac-send').value;
    const err=document.getElementById('ac-err');
    if(!label||!start||!end){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Label, start and end date are required.</div>`; return; }
    this.S.addAcademicSession({session_label:label,start_date:start,end_date:end,is_current:document.getElementById('ac-scurrent').checked});
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast('Session added');
  },
  _editSession(id){
    const s=this.S.academicSessions().find(x=>x.public_id===id||x.id===id); if(!s) return;
    const {close}=UI.sheet(`<div class="sheet-title">Edit session</div>
      <div class="field"><label class="field-label">Session label</label>
        <input class="input" id="ac-slabel" value="${s.session_label}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-scurrent" ${s.is_current?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-scurrent" class="field-label" style="margin:0">Set as current session</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveSessionEdit('${id}')">Save</button>`);
    this._acadClose=close;
  },
  _saveSessionEdit(id){
    const label=document.getElementById('ac-slabel').value.trim();
    const isCurrent=document.getElementById('ac-scurrent').checked;
    if(!label){ UI.toast('Label cannot be empty','error'); return; }
    this.S.updateAcademicSession(id,{session_label:label,is_current:isCurrent});
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast('Session updated');
  },

  /* === PROGRAM CRUD === */
  _addProgram(){
    const levels=['pre_primary','primary','secondary','higher_secondary','diploma','undergraduate','postgraduate','doctoral','certificate','custom'];
    const {close}=UI.sheet(`<div class="sheet-title">Add program</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors POST /programs (ProgramCreate)</p>
      <div class="field"><label class="field-label">Program name <span class="req">*</span></label>
        <input class="input" id="ac-pname" placeholder="e.g. Secondary School"></div>
      <div class="field"><label class="field-label">Code <span class="req">*</span></label>
        <input class="input t-code" id="ac-pcode" placeholder="e.g. SEC" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="field"><label class="field-label">Program level <span class="req">*</span></label>
        <select class="select" id="ac-plevel">${levels.map(l=>`<option value="${l}">${l.replace('_',' ')}</option>`).join('')}</select></div>
      <div id="ac-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveProgram()">Add program</button>`);
    this._acadClose=close;
  },
  _saveProgram(){
    const name=document.getElementById('ac-pname').value.trim();
    const code=document.getElementById('ac-pcode').value.trim();
    const level=document.getElementById('ac-plevel').value;
    const err=document.getElementById('ac-err');
    if(!name||!code){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name and code are required.</div>`; return; }
    const result=this.S.addProgram({program_name:name,program_code:code,program_level:level});
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast(`"${name}" added`);
  },
  _editProgram(id){ const p=this.S.programs().find(x=>x.public_id===id||x.id===id); if(!p) return;
    const {close}=UI.sheet(`<div class="sheet-title">Edit program</div>
      <div class="field"><label class="field-label">Program name</label><input class="input" id="ac-pname" value="${p.program_name}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-pactive" ${p.is_active?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-pactive" class="field-label" style="margin:0">Active</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveProgramEdit('${id}')">Save</button>`);
    this._acadClose=close; },
  _saveProgramEdit(id){ this.S.updateProgram(id,{program_name:document.getElementById('ac-pname').value.trim()||undefined,is_active:document.getElementById('ac-pactive').checked}); this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast('Program updated'); },
  _deleteProgram(id){ UI.confirm({title:'Delete program?',message:'All class levels in this program must be removed first.',confirmText:'Delete',danger:true}).then(ok=>{if(!ok)return;const r=this.S.deleteProgram(id);if(r&&r.error){UI.toast(r.error,'error');return;}this._refreshAcad();UI.toast('Deleted');}); },

  /* === CLASS LEVEL CRUD + SUBJECT MAPPING === */
  _addClassLevel(){
    const progs=this.S.programs().filter(p=>p.is_active);
    const {close}=UI.sheet(`<div class="sheet-title">Add class level</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors POST /class-levels (ClassLevelCreate)</p>
      <div class="field"><label class="field-label">Class name <span class="req">*</span></label>
        <input class="input" id="ac-clname" placeholder="e.g. Class 6"></div>
      <div class="field"><label class="field-label">Program <span class="req">*</span></label>
        <select class="select" id="ac-clprog">${progs.map(p=>`<option value="${p.public_id||p.id}">${p.program_name}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Sequence order</label>
        <input class="input" id="ac-clseq" type="number" min="1" placeholder="e.g. 9"></div>
      <div id="ac-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveClassLevel()">Add</button>`);
    this._acadClose=close;
  },
  _saveClassLevel(){
    const name=document.getElementById('ac-clname').value.trim(); const err=document.getElementById('ac-err');
    if(!name){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Class name is required.</div>`; return; }
    this.S.addClassLevel({class_name:name,program_public_id:document.getElementById('ac-clprog').value,sequence_order:parseInt(document.getElementById('ac-clseq').value)||undefined});
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast(`"${name}" added`);
  },
  _editClassLevel(id){ const c=this.S.classLevelById(id); if(!c) return;
    const {close}=UI.sheet(`<div class="sheet-title">Edit class level</div>
      <div class="field"><label class="field-label">Class name</label><input class="input" id="ac-clname" value="${c.class_name||c.name}"></div>
      <div class="field"><label class="field-label">Sequence order</label><input class="input" id="ac-clseq" type="number" value="${c.sequence_order}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-clactive" ${c.is_active?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-clactive" class="field-label" style="margin:0">Active</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveClassLevelEdit('${id}')">Save</button>`);
    this._acadClose=close; },
  _saveClassLevelEdit(id){
    this.S.updateClassLevel(id,{class_name:document.getElementById('ac-clname').value.trim()||undefined,sequence_order:parseInt(document.getElementById('ac-clseq').value)||undefined,is_active:document.getElementById('ac-clactive').checked});
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast('Class level updated');
  },
  _deleteClassLevel(id){ UI.confirm({title:'Delete class level?',message:'Remove all sections in this class first.',confirmText:'Delete',danger:true}).then(ok=>{if(!ok)return;const r=this.S.deleteClassLevel(id);if(r&&r.error){UI.toast(r.error,'error');return;}this._refreshAcad();UI.toast('Deleted');}); },
  _mapSubjects(classLevelId){
    /* PUT /class-levels/{id}/subjects — ClassSubjectMappingReplace{subjects:[{subject_public_id,credit_hours,is_mandatory}]} */
    const c=this.S.classLevelById(classLevelId); if(!c) return;
    const allSubs=this.S.subjects().filter(s=>s.is_active);
    const current=this.S.classSubjectsForLevel(classLevelId);
    const currentMap=Object.fromEntries(current.map(m=>[m.subject_public_id,m]));
    const {close}=UI.sheet(`
      <div class="sheet-title">Subjects — ${c.class_name||c.name}</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors PUT /class-levels/{id}/subjects (ClassSubjectMappingReplace)</p>
      <div id="ac-submap" class="card card-pad-0 mb-3"><div class="list">${allSubs.map(s=>{
        const mapped=currentMap[s.public_id||s.id];
        const hrs=mapped?mapped.credit_hours:'0';
        const mand=mapped?mapped.is_mandatory:false;
        return `<div class="row" style="cursor:default;flex-wrap:wrap">
          <div class="row-main"><div class="row-title">${s.subject_name||s.name}</div><div class="row-sub t-code">${s.subject_code||s.code}</div></div>
          <div style="display:flex;align-items:center;gap:8px">
            <input type="number" class="input sub-hrs" data-sid="${s.public_id||s.id}" style="width:64px;text-align:center;padding:6px" value="${hrs}" min="0" max="12" placeholder="hrs">
            <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
              <input type="checkbox" class="sub-mand" data-sid="${s.public_id||s.id}" ${mand?'checked':''} style="accent-color:var(--brand)"> Core
            </label>
          </div>
        </div>`;
      }).join('')}</div></div>
      <div class="field-hint mb-3">Enter credit hours (0 = not mapped). Check "Core" for mandatory subjects.</div>
      <button class="btn btn-primary btn-full btn-lg" onclick="App._saveSubjectMapping('${classLevelId}')">Save subject mapping</button>`);
    this._acadClose=close;
  },
  _saveSubjectMapping(classLevelId){
    const entries=[];
    document.querySelectorAll('.sub-hrs').forEach(inp=>{
      const hrs=parseFloat(inp.value)||0;
      if(hrs>0){
        const sid=inp.dataset.sid;
        const mandEl=document.querySelector(`.sub-mand[data-sid="${sid}"]`);
        entries.push({subject_public_id:sid,credit_hours:String(hrs),is_mandatory:mandEl?mandEl.checked:false});
      }
    });
    this.S.replaceClassSubjects(classLevelId,entries);
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast(`${entries.length} subject(s) mapped`);
  },

  /* === SECTION CRUD === */
  _addSection(){
    const classes=this.S.classLevels().filter(c=>c.is_active);
    const sessions=this.S.academicSessions();
    const teachers=this.S.staffUsers();
    if(classes.length===0){ UI.toast('Add at least one class level first','error'); return; }
    const {close}=UI.sheet(`<div class="sheet-title">Add section</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors POST /sections (SectionCreate)</p>
      <div class="field"><label class="field-label">Section name <span class="req">*</span></label>
        <input class="input" id="ac-sname" placeholder="e.g. 3-A, 3-B"></div>
      <div class="field"><label class="field-label">Class level <span class="req">*</span></label>
        <select class="select" id="ac-sclass">${classes.map(c=>`<option value="${c.public_id||c.id}">${c.class_name||c.name}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Academic session <span class="req">*</span></label>
        <select class="select" id="ac-ssess">${sessions.map(s=>`<option value="${s.public_id||s.id}" ${s.is_current?'selected':''}>${s.session_label}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Class teacher</label>
        <select class="select" id="ac-steacher"><option value="">— Unassigned —</option>${teachers.map(t=>`<option value="${t.id}">${t.name} · ${t.designation}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Max capacity</label>
        <input class="input" id="ac-scap" type="number" min="1" placeholder="e.g. 40"></div>
      <div id="ac-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveSection()">Add section</button>`);
    this._acadClose=close;
  },
  _saveSection(){
    const name=document.getElementById('ac-sname').value.trim(); const err=document.getElementById('ac-err');
    if(!name){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Section name is required.</div>`; return; }
    this.S.addSection({section_name:name,class_level_public_id:document.getElementById('ac-sclass').value,academic_session_public_id:document.getElementById('ac-ssess').value,class_teacher_user_public_id:document.getElementById('ac-steacher').value||null,max_capacity:parseInt(document.getElementById('ac-scap').value)||null});
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast(`"${name}" added`);
  },
  _editSection(id){ const s=this.S.sections().find(x=>x.public_id===id||x.id===id); if(!s) return;
    const teachers=this.S.staffUsers();
    const {close}=UI.sheet(`<div class="sheet-title">Edit section</div>
      <div class="field"><label class="field-label">Section name</label><input class="input" id="ac-sname" value="${s.section_name||s.name}"></div>
      <div class="field"><label class="field-label">Class teacher</label>
        <select class="select" id="ac-steacher"><option value="">— Unassigned —</option>${teachers.map(t=>`<option value="${t.id}" ${s.class_teacher_user_public_id===t.id?'selected':''}>${t.name} · ${t.designation}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Max capacity</label><input class="input" id="ac-scap" type="number" value="${s.max_capacity||''}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-sactive" ${s.is_active?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-sactive" class="field-label" style="margin:0">Active</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveSectionEdit('${id}')">Save</button>`);
    this._acadClose=close; },
  _saveSectionEdit(id){ this.S.updateSection(id,{section_name:document.getElementById('ac-sname').value.trim()||undefined,class_teacher_user_public_id:document.getElementById('ac-steacher').value||null,max_capacity:parseInt(document.getElementById('ac-scap').value)||null,is_active:document.getElementById('ac-sactive').checked}); this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast('Section updated'); },
  _deleteSection(id){ UI.confirm({title:'Delete section?',message:'This removes the section from the current academic structure.',confirmText:'Delete',danger:true}).then(ok=>{if(!ok)return;this.S.deleteSection(id);this._refreshAcad();UI.toast('Deleted');}); },

  /* === SUBJECT CRUD === */
  _addSubject(){
    const {close}=UI.sheet(`<div class="sheet-title">Add subject</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Mirrors POST /subjects (SubjectCreate)</p>
      <div class="field"><label class="field-label">Subject name <span class="req">*</span></label>
        <input class="input" id="ac-subname" placeholder="e.g. Computer Science"></div>
      <div class="field"><label class="field-label">Subject code <span class="req">*</span></label>
        <input class="input t-code" id="ac-subcode" placeholder="e.g. CS" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-subelec" style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-subelec" class="field-label" style="margin:0">Elective (optional subject)</label>
      </div>
      <div id="ac-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveSubject()">Add subject</button>`);
    this._acadClose=close;
  },
  _saveSubject(){
    const name=document.getElementById('ac-subname').value.trim();
    const code=document.getElementById('ac-subcode').value.trim();
    const err=document.getElementById('ac-err');
    if(!name||!code){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name and code are required.</div>`; return; }
    const result=this.S.addSubject({subject_name:name,subject_code:code,is_elective:document.getElementById('ac-subelec').checked});
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast(`"${name}" added`);
  },
  _editSubject(id){ const s=this.S.subjects().find(x=>x.public_id===id||x.id===id); if(!s) return;
    const {close}=UI.sheet(`<div class="sheet-title">Edit subject</div>
      <div class="field"><label class="field-label">Subject name</label><input class="input" id="ac-subname" value="${s.subject_name||s.name}"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-subelec" ${s.is_elective?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-subelec" class="field-label" style="margin:0">Elective</label>
      </div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="ac-subactive" ${s.is_active?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="ac-subactive" class="field-label" style="margin:0">Active</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveSubjectEdit('${id}')">Save</button>`);
    this._acadClose=close; },
  _saveSubjectEdit(id){ this.S.updateSubject(id,{subject_name:document.getElementById('ac-subname').value.trim()||undefined,is_elective:document.getElementById('ac-subelec').checked,is_active:document.getElementById('ac-subactive').checked}); this._acadClose&&this._acadClose(); this._refreshAcad(); UI.toast('Subject updated'); },
  _deleteSubject(id){ UI.confirm({title:'Delete subject?',message:'This removes the subject from the catalogue.',confirmText:'Delete',danger:true}).then(ok=>{if(!ok)return;this.S.deleteSubject(id);this._refreshAcad();UI.toast('Deleted');}); },

  _refreshAcad(){ document.getElementById('screen').innerHTML=this._academicMarkup(); },
  addAcadItem(){ /* compat stub */ },
  saveAcadItem(){ /* compat stub */ },
  removeAcadItem(id){ /* compat stub — use typed delete methods */ },

  /* ---- prototype user switcher (review affordance, NOT a product feature) ----
     Switches the "logged-in" staff member. Each person carries their assigned
     role's LIVE permission set — the app recomputes navigation & screens from
     can(code), never from a role name. This is the frontend mirror of the
     backend's dynamic RBAC. */
  roleSwitcher(){
    const users=this.S.staffUsers(); const activeId=this.S.activeUser().id;
    const {close}=UI.sheet(`<div class="sheet-title">Switch staff member</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Review affordance only — see how the app recomputes navigation & screens from each person's live permissions. Not a real product feature (in production, each person logs in).</p>
      ${users.map(u=>{ const r=this.S.roleById(u.roleId); return `<div class="row" style="border:none;padding:12px 4px" onclick="App.pickUser('${u.id}')">
        <div class="avatar" style="background:${avatarColor(u.name)}">${u.avatar}</div>
        <div class="row-main"><div class="row-title">${u.name}</div><div class="row-sub">${u.designation} · ${r?r.name:'-'} · ${r?r.perms.length:0} permissions</div></div>
        ${activeId===u.id?`<span style="color:var(--brand)">${icon('check')}</span>`:''}</div>`; }).join('')}
      <button class="btn btn-secondary btn-full mt-4" onclick="App._roleClose()">Done</button>`);
    this._roleClose=close;
  },
  pickUser(id){ this.S.setActiveUser(id); this._roleClose&&this._roleClose(); this.route='dashboard'; this.ctx={}; this.render(); UI.toast('Now viewing as '+this.S.activeUser().name); },
  pickRole(r){ this.pickUser(r); }, // back-compat alias

  /* ---- theme (shared) ---- */
  themes:[['violet','Violet','#7C5CFF','Default'],['indigo','Indigo','#4F46E5',''],['emerald','Emerald','#059669',''],['slate','Slate','#475569',''],['amber','Warm Amber','#D97706',''],['contrast','High Contrast','#1D4ED8','Accessibility']],
  themeName(k){ return (this.themes.find(t=>t[0]===k)||[])[1]||k; },
  openThemeSheet(){
    const st=this.F.settings();
    const {el,close}=UI.sheet(`<div class="sheet-title">Appearance</div>
      <div class="segmented mb-4" id="modeSeg">${[['light','Light'],['dark','Dark'],['system','Auto']].map(([k,l])=>`<button class="${st.mode===k?'active':''}" onclick="App.setMode('${k}')">${l}</button>`).join('')}</div>
      <div class="field-label mb-2">Theme</div><div id="themeList"></div>
      <button class="btn btn-secondary btn-full mt-4" onclick="App._themeClose()">Done</button>`);
    this._themeSheetEl=el; this._themeClose=close; this._renderThemeList();
  },
  _renderThemeList(){
    const st=this.F.settings();
    this._themeSheetEl.querySelector('#themeList').innerHTML=this.themes.map(([k,name,col,tag])=>`
      <div class="row" style="border:none;padding:10px 4px" onclick="App.setTheme('${k}')">
        <div style="width:36px;height:36px;border-radius:50%;background:${col};border:2px solid var(--border-subtle);flex-shrink:0"></div>
        <div class="row-main"><div class="row-title" style="font-weight:600">${name}</div>${tag?`<div class="row-sub">${tag}</div>`:''}</div>
        ${st.theme===k?`<span style="color:var(--brand)">${icon('check')}</span>`:''}</div>`).join('');
  },
  setTheme(k){ this.F.updateSettings({theme:k}); this.applyTheme(k,this.F.settings().mode); this._renderThemeList(); },
  setMode(k){ this.F.updateSettings({mode:k}); this.applyTheme(this.F.settings().theme,k); this._themeSheetEl.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().startsWith(k==='system'?'auto':k))); },

  /* ---- helpers ---- */
  noPermission(el){ el.innerHTML=`<div class="state"><div class="state-ill">${icon('shield')}</div><div class="state-title">Not available</div><div class="state-msg">Your role doesn't include this. Navigation only ever shows what you're permitted to use.</div></div>`; },
  notImplemented(w){ UI.toast((w||'This')+' — demonstrated in a later stage','error'); },
  resetPrompt(){ UI.confirm({title:'Reset demo data?',message:'Leads, leaves, attendance and payments will be regenerated.',confirmText:'Reset',danger:true}).then(ok=>{ if(ok){ this.S.reset(); this.F.reset(); this.route='dashboard'; this.ctx={}; this.render(); UI.toast('Demo data reset'); } }); },
};
App.init();
</script>
</body>
