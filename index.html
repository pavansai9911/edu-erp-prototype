<!DOCTYPE html>
<html lang="en" data-theme="violet" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NextGen EduERP · Prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="shared/styles.css">
</head>
<body>
<div class="viewport">
  <div class="proto-banner">◆ NextGen EduERP · Prototype Suite</div>
  <div class="content" style="display:flex;flex-direction:column;justify-content:center">
    <div class="login-brand" style="margin:0 auto var(--sp-5)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="width:32px;height:32px;color:#fff"><path d="M12 3 2 8l10 5 10-5-10-5zM2 8v8l10 5 10-5V8"/></svg>
    </div>
    <h1 class="t-display text-center mb-2">NextGen EduERP</h1>
    <p class="text-secondary text-center mb-6">Choose an app to preview. Each is a full mobile prototype.</p>

    <a href="admin/index.html" class="card card-interactive card-raised mb-3 flex gap-3 items-center" style="text-decoration:none;color:inherit">
      <div class="avatar avatar-sq" style="width:48px;height:48px;background:var(--brand)">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" style="width:24px;height:24px"><path d="M12 2 4 5v6c0 5 3.5 8.5 8 11 4.5-2.5 8-6 8-11V5z"/></svg>
      </div>
      <div class="flex-1"><div class="row-title">ERP Admin</div><div class="row-sub">Platform operator console</div></div>
      <span class="chip chip-success"><span class="chip-dot"></span>Ready</span>
    </a>

    <a href="founder/index.html" class="card card-interactive card-raised mb-3 flex gap-3 items-center" style="text-decoration:none;color:inherit">
      <div class="avatar avatar-sq" style="width:48px;height:48px;background:var(--brand)">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" style="width:24px;height:24px"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01"/></svg>
      </div>
      <div class="flex-1"><div class="row-title">Founder</div><div class="row-sub">School owner app</div></div>
      <span class="chip chip-success"><span class="chip-dot"></span>Ready</span>
    </a>

    <div class="card flex gap-3 items-center" style="opacity:.6">
      <div class="avatar avatar-sq" style="width:48px;height:48px;background:var(--surface-sunken);color:var(--text-tertiary)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="width:24px;height:24px"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c0-3.5 3-5 7-5s7 1.5 7 5"/></svg>
      </div>
      <div class="flex-1"><div class="row-title">Staff</div><div class="row-sub">Principal · Teacher · Accountant · Reception</div></div>
      <span class="chip chip-neutral">Later</span>
    </div>

    <p class="t-caption text-center mt-6">Mobile-first · session-based · hosted on GitHub Pages</p>
  </div>
</div>
</body>
</html>
