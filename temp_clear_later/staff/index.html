<!DOCTYPE html>
<html lang="en" data-theme="violet" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EduERP · Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="viewport">
  <div class="proto-banner" onclick="App.roleSwitcher()">◆ STAFF PROTOTYPE · tap to switch role (review)</div>
  <div id="app"></div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/auth-screens.js"></script>
<script src="../shared/founder-data.js"></script>
<script src="../shared/staff-data.js"></script>
<script>
/* ============================================================================
   STAFF APP — one app, four roles, navigation COMPUTED FROM PERMISSIONS.
   The RENEWAL surface: speed, minimal friction. No "if role" — only "if can(perm)".
   ============================================================================ */
const App = {
  route:'dashboard', ctx:{},
  systemDark:window.matchMedia('(prefers-color-scheme:dark)').matches,
  loadingMs:500,
  S:StaffDB, F:FounderDB,

  init(){
    const set=this.F.settings();
    this.applyTheme(set.theme||'violet', set.mode||'system');
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{
      this.systemDark=e.matches;
      const st=this.F.settings();
      if((st.mode||'system')==='system') this.applyTheme(st.theme,'system');
    });
    if(!Auth.isLoggedIn()){ this.renderLogin(); } else { this.render(); }
  },
  renderLogin(){
    AuthScreens.Login(document.getElementById('app'),{
      app:'staff',
      title:'Staff Portal',
      subtitle:'Sign in with the credentials your school provided.',
      badge:'Staff Access',
      badgeIcon:'shield',
      orgCodeVisible:false,
      demoIdentifier:'principal@sunrise.edu',
      demoPassword:'Welcome@123',
      onSuccess:(user)=>{
        // set the active StaffDB user based on who logged in
        const matched=this.S.staffUsers().find(u=>u.email.toLowerCase()===user.email.toLowerCase());
        if(matched) this.S.setActiveUser(matched.id);
        this.render();
        UI.toast('Welcome back, '+user.name.split(' ')[0]);
      }
    });
  },
  confirmLogout(){
    UI.confirm({title:'Sign out?',message:'You will need to sign in again.',confirmText:'Sign out',danger:true})
      .then(ok=>{ if(ok){ Auth.logout(); this.renderLogin(); } });
  },
  applyTheme(t,m){ document.documentElement.dataset.theme=t; document.documentElement.dataset.mode= m==='system'?(this.systemDark?'dark':'light'):m; },

  /* ---- PERMISSION-COMPUTED NAVIGATION (the defining architecture) ---- */
  computeTabs(){
    const S=this.S, P=S.PERMS;
    // every possible destination, each gated by a permission. Dashboard + More always present.
    const all=[
      {k:'dashboard',ic:'home',label:'Home',perm:null},
      {k:'attendance',ic:'check',label:'Attendance',perm:P.ATTENDANCE_CREATE},
      {k:'payments',ic:'wallet',label:'Payments',perm:P.FEE_PAYMENT_CREATE},
      {k:'admissions',ic:'trend',label:'Admissions',perm:P.LEAD_VIEW},
      {k:'approvals',ic:'inbox',label:'Approvals',perm:P.LEAVE_APPROVE},
      {k:'students',ic:'users',label:'Students',perm:P.STUDENT_VIEW},
      {k:'reports',ic:'chart',label:'Reports',perm:P.REPORTS_VIEW},
    ];
    let visible=all.filter(t=>!t.perm||S.can(t.perm));
    // cap at 5 (incl. More). If more than 4 feature tabs + dashboard, overflow into More.
    const maxPrimary=4; // + More = 5
    let primary=visible.slice(0,maxPrimary);
    let overflow=visible.slice(maxPrimary);
    primary.push({k:'more',ic:'settings',label:'More',perm:null});
    this._overflowTabs=overflow;
    return primary;
  },

  render(){ document.getElementById('app').innerHTML=this.Shell(); this.mountScreen(); },
  Shell(){
    const tabs=this.computeTabs();
    // if current route not in visible set (e.g. after role switch), redirect to dashboard
    const routable=[...tabs,...(this._overflowTabs||[])].map(t=>t.k).concat(['more','student','lead','markAttendance','settings','staffList','staffDetail','addStaff','editStaff','roles','roleDetail','selfCheckIn','staffAttendance','academic']);
    if(!routable.includes(this.route)) this.route='dashboard';
    const isSub=this.ctx.sub;
    return `${this.AppBar()}
      <div class="content fade-in" id="screen"></div>
      ${isSub?'':`<div class="tabbar">${tabs.map(t=>this.tabBtn(t)).join('')}</div>`}`;
  },
  tabBtn(t){
    let badge='';
    if(t.k==='approvals'){ const n=this.S.pendingLeaves().length+this.S.pendingApplications().length; if(n)badge=`<span class="tab-badge">${n}</span>`; }
    if(t.k==='admissions'){ const n=this.S.followUpsDue().length; if(n)badge=`<span class="tab-badge">${n}</span>`; }
    return `<button class="tab ${this.route===t.k?'active':''}" onclick="App.go('${t.k}')">${icon(t.ic)}${badge}<span>${t.label}</span></button>`;
  },
  AppBar(){
    if(this.ctx.sub){
      return `<div class="appbar sub">
        <button class="appbar-btn" onclick="App.back()" aria-label="Back">${icon('chevronL')}</button>
        <div class="appbar-id"><div class="appbar-title">${this.ctx.title||''}</div>${this.ctx.subtitle?`<div class="appbar-sub">${this.ctx.subtitle}</div>`:''}</div>
        ${this.ctx.action||''}
      </div>`;
    }
    const p=this.S.profile(); const role=this.S.role();
    const titles={dashboard:this.greeting(),attendance:'Attendance',payments:'Payments',admissions:'Admissions',approvals:'Approvals',students:'Students',reports:'Reports',more:'More'};
    const sub={dashboard:role+' · '+this.F.settings().schoolName,attendance:'Mark & save',payments:'Record fees',admissions:'Leads & enquiries',approvals:'Needs your decision',students:'Student directory',reports:'Your reports',more:'Profile & settings'}[this.route];
    return `<div class="appbar">
      <div class="appbar-logo">${icon('building')}</div>
      <div class="appbar-id"><div class="appbar-title">${titles[this.route]||''}</div><div class="appbar-sub">${icon('shield')} ${sub||role}</div></div>
      <button class="appbar-btn" onclick="App.notImplemented('Notifications')" aria-label="Alerts">${icon('bell')}<span class="appbar-dot"></span></button>
      <div class="appbar-avatar" style="background:${avatarColor(p.name)}" onclick="App.go('more')">${p.avatar}</div>
    </div>`;
  },
  greeting(){ const h=new Date().getHours(); const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening'; return g+', '+this.S.profile().name.split(' ')[0]; },

  go(route,ctx={}){ this.route=route; this.ctx=ctx; this.render(); },
  back(){ this.ctx={}; this.route=this._backTo||'dashboard'; this.render(); },
  mountScreen(){
    const el=document.getElementById('screen');
    switch(this.route){
      case 'dashboard': return this.Dashboard(el);
      case 'attendance': return this.Attendance(el);
      case 'markAttendance': return this.MarkAttendance(el);
      case 'payments': return this.Payments(el);
      case 'admissions': return this.Admissions(el);
      case 'lead': return this.LeadDetail(el);
      case 'approvals': return this.Approvals(el);
      case 'students': return this.Students(el);
      case 'student': return this.StudentDetail(el);
      case 'reports': return this.Reports(el);
      case 'more': return this.More(el);
      case 'settings': return this.Settings(el);
      case 'staffList': return this.StaffList(el);
      case 'staffDetail': return this.StaffDetail(el);
      case 'addStaff': return this.AddStaff(el);
      case 'editStaff': return this.AddStaff(el);
      case 'roles': return this.Roles(el);
      case 'roleDetail': return this.RoleDetail(el);
      case 'selfCheckIn': return this.SelfCheckIn(el);
      case 'staffAttendance': return this.StaffAttendance(el);
      case 'academic': return this.AcademicStructure(el);
    }
  },
  withLoading(el,sk,build){ el.innerHTML=sk; setTimeout(()=>{ el.innerHTML=build(); if(this._after){this._after();this._after=null;} },this.loadingMs); },

  /* ========================================================================
     DASHBOARD — role-adaptive, permission-driven widgets. "What do I do now?"
     ======================================================================== */
  Dashboard(el){
    this._backTo='dashboard';
    const sk=`<div class="grid-2 mb-3">${'<div class="kpi"><div class="sk sk-line" style="width:60%"></div><div class="sk" style="height:22px;width:40%;margin-top:8px"></div></div>'.repeat(4)}</div><div class="card"><div class="sk" style="height:120px"></div></div>`;
    this.withLoading(el,sk,()=>{
      const S=this.S, P=S.PERMS;
      // Exactly one descriptor per §6.5 — chosen by CAPABILITY, not role name, so a
      // custom role automatically gets the right home screen from what it can actually do.
      if(S.can(P.LEAVE_APPROVE) && S.can(P.STAFF_CREATE)) return this.DashPrincipal();
      if(S.can(P.FEE_PAYMENT_CREATE)) return this.DashAccountant();
      if(S.can(P.ATTENDANCE_CREATE)) return this.DashTeacher();
      if(S.can(P.LEAD_VIEW)) return this.DashReceptionist();
      return this.DashEmpty();
    });
  },
  dashKpi(ic,label,value,color,sub){
    return `<div class="kpi"><div class="flex items-center gap-2 mb-1"><span style="color:${color};display:grid">${icon(ic)}</span><span class="kpi-label" style="margin:0">${label}</span></div><div class="kpi-value" style="font-size:22px">${value}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
  },
  quickActions(actions){ // actions: [[icon,label,onclick]]
    return `<div class="sec-head"><div class="sec-title">Quick actions</div></div>
      <div class="flex gap-2 mb-4" style="flex-wrap:wrap">${actions.map(([ic,label,fn])=>
        `<button class="btn btn-secondary" style="flex:1;min-width:120px" onclick="${fn}">${icon(ic)} ${label}</button>`).join('')}</div>`;
  },
  aiInsightsSlot(){ // reserved slot — never fill with real-looking data (hard rule)
    return `<div class="dashed-card">${icon('sparkle')} <span class="t-caption">Insights arrive with Enterprise</span></div>`;
  },

  /* ---- PRINCIPAL — Attendance today · Pending approvals · Total students · Active staff
     No primary chart (list-first, per approved prototype). Secondary: activity feed. ---- */
  DashPrincipal(){
    const S=this.S;
    const sections=S.academic().sections;
    const marked=sections.filter(s=>S.getAttendance(s.name));
    let attValue='—', attSub='No sections marked yet';
    if(marked.length){
      let present=0,total=0;
      marked.forEach(s=>{ const rec=S.getAttendance(s.name); const marks=Object.values(rec.marks);
        present+=marks.filter(m=>m==='P').length; total+=marks.length; });
      attValue=(total?Math.round(present/total*100):0)+'%';
      attSub=`${marked.length} of ${sections.length} sections marked`;
    }
    const pendingApprovals=S.pendingLeaves().length+S.pendingApplications().length;
    const totalStudents=this.F.students().length;
    const activeStaff=S.staffUsers().length;
    return `
      <div class="grid-2 mb-3">
        ${this.dashKpi('check','Attendance today',attValue,marked.length?'var(--viz-positive)':'var(--text-tertiary)',attSub)}
        ${this.dashKpi('inbox','Pending approvals',pendingApprovals,pendingApprovals?'var(--viz-warning)':'var(--viz-positive)')}
      </div>
      <div class="grid-2 mb-4">
        ${this.dashKpi('users','Total students',totalStudents,'var(--info)')}
        ${this.dashKpi('briefcase','Active staff',activeStaff,'var(--brand)','across the school')}
      </div>
      ${this.quickActions([['inbox','Approvals',"App.go('approvals')"],['users','Students',"App.go('students')"],['settings','Setup',"App.go('more')"]])}
      <div class="sec-head"><div class="sec-title">Activity feed</div></div>
      ${this._activityFeed(this._principalActivity())}
      ${this.aiInsightsSlot()}`;
  },

  /* ---- TEACHER — My section · Attendance marked · My students · Leave balance
     No chart. Secondary: activity feed (own section). ---- */
  DashTeacher(){
    const S=this.S; const u=S.activeUser();
    const secs=S.mySections();
    const mySection=u.section||secs[0]||'—';
    const markedCount=secs.filter(s=>S.getAttendance(s)).length;
    const myStudents=mySection!=='—'?S.sectionRoster(mySection).length:0;
    const quota=12; const usedThisYear=S.myLeaves().filter(l=>l.status==='Approved').reduce((sum,l)=>sum+l.days,0);
    const balance=Math.max(0,quota-usedThisYear);
    return `
      <div class="grid-2 mb-3">
        ${this.dashKpi('building2','My section',mySection,'var(--brand)')}
        ${this.dashKpi('check','Attendance marked',`${markedCount}/${secs.length}`,markedCount===secs.length&&secs.length?'var(--viz-positive)':'var(--viz-warning)')}
      </div>
      <div class="grid-2 mb-4">
        ${this.dashKpi('users','My students',myStudents,'var(--info)')}
        ${this.dashKpi('calendar','Leave balance',balance+' days','var(--brand)','of '+quota+'/yr')}
      </div>
      ${this.quickActions([['check','Mark attendance',"App.go('attendance')"]])}
      <div class="sec-head"><div class="sec-title">Activity feed</div><span class="t-caption">${mySection}</span></div>
      ${this._activityFeed(this._teacherActivity(mySection))}
      ${this.aiInsightsSlot()}`;
  },

  /* ---- ACCOUNTANT — Collected today · Receipts · Pending invoices · Partial invoices
     No chart. Secondary: recent payments. ---- */
  DashAccountant(){
    const S=this.S; const today=S.todayCollection();
    const receiptsToday=this.F.paymentsInPeriod('today').length;
    const fs=this.F.feeSummary();
    return `
      <div class="grid-2 mb-3">
        ${this.dashKpi('wallet','Collected today',fmt.moneyShort(today),'var(--viz-positive)')}
        ${this.dashKpi('mail','Receipts',receiptsToday,'var(--brand)','today')}
      </div>
      <div class="grid-2 mb-4">
        ${this.dashKpi('alert','Pending invoices',fs.unpaid,fs.unpaid?'var(--viz-negative)':'var(--viz-positive)')}
        ${this.dashKpi('clock','Partial invoices',fs.partial,fs.partial?'var(--viz-warning)':'var(--viz-positive)')}
      </div>
      ${this.quickActions([['wallet','Record payment',"App.go('payments')"]])}
      <div class="sec-head"><div class="sec-title">Recent payments</div></div>
      <div class="card card-pad-0 mb-4"><div class="list">${this.F.recentPayments(5).map(p=>this.paymentRowStaff(p)).join('')||`<div class="row" style="cursor:default"><div class="row-main"><div class="row-title" style="font-weight:400;color:var(--text-tertiary)">No payments recorded yet</div></div></div>`}</div></div>
      ${this.aiInsightsSlot()}`;
  },
  paymentRowStaff(p){
    return `<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:var(--success-subtle);color:var(--success)">${icon('wallet')}</div>
      <div class="row-main"><div class="row-title">${p.studentName}</div><div class="row-sub">${p.mode} · ${fmt.ago(p.at)}</div></div>
      <div class="t-data" style="font-weight:700;color:var(--viz-positive)">${fmt.money(p.amount)}</div></div>`;
  },

  /* ---- RECEPTIONIST — New leads · In progress · Applications · Admitted
     No chart. Secondary: funnel snapshot. ---- */
  DashReceptionist(){
    const S=this.S; const f=S.funnel();
    const byStage=Object.fromEntries(f.map(x=>[x.stage,x.count]));
    const inProgress=(byStage.Contacted||0)+(byStage.Visited||0);
    return `
      <div class="grid-2 mb-3">
        ${this.dashKpi('trend','New leads',byStage.Enquiry||0,'var(--brand)')}
        ${this.dashKpi('clock','In progress',inProgress,'var(--info)')}
      </div>
      <div class="grid-2 mb-4">
        ${this.dashKpi('inbox','Applications',byStage.Applied||0,'var(--viz-warning)')}
        ${this.dashKpi('check','Admitted',byStage.Admitted||0,'var(--viz-positive)')}
      </div>
      ${this.quickActions([['plus','New enquiry',"App.newLead()"]])}
      <div class="sec-head"><div class="sec-title">Funnel snapshot</div></div>
      <div class="card mb-4">${f.map(x=>{ const max=Math.max(...f.map(y=>y.count),1);
        return `<div class="mb-2"><div class="flex between mb-1"><span class="t-label">${x.stage}</span><span class="t-data" style="font-weight:700">${x.count}</span></div>
        <div style="height:8px;background:var(--surface-sunken);border-radius:99px;overflow:hidden"><div style="width:${(x.count/max)*100}%;height:100%;background:var(--brand);border-radius:99px"></div></div></div>`; }).join('')}</div>
      ${this.aiInsightsSlot()}`;
  },

  DashEmpty(){
    return `<div class="state"><div class="state-ill">${icon('shield')}</div><div class="state-title">No home-screen widgets yet</div>
      <div class="state-msg">Your assigned permissions don't match a configured dashboard layout. Ask your Principal to review your role.</div></div>`;
  },

  /* ---- activity feed builders (real events only, chronological) ---- */
  _activityFeed(events){
    if(!events.length) return `<div class="card mb-4" style="text-align:center;color:var(--text-tertiary)">${icon('inbox')}<div class="t-caption mt-2">No activity yet today</div></div>`;
    return `<div class="card card-pad-0 mb-4"><div class="list">${events.slice(0,6).map(e=>`
      <div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:${e.bg};color:${e.color}">${icon(e.icon)}</div>
      <div class="row-main"><div class="row-title" style="font-weight:500">${e.title}</div><div class="row-sub">${e.sub}</div></div>
      <span class="t-caption">${fmt.ago(e.at)}</span></div>`).join('')}</div></div>`;
  },
  _principalActivity(){
    const S=this.S; const events=[];
    S.leaves().slice(0,5).forEach(l=>events.push({icon:l.status==='Pending'?'inbox':l.status==='Approved'?'check':'alert',
      bg:l.status==='Pending'?'var(--warning-subtle)':l.status==='Approved'?'var(--success-subtle)':'var(--danger-subtle)',
      color:l.status==='Pending'?'var(--warning)':l.status==='Approved'?'var(--success)':'var(--danger)',
      title:`${l.staffName} — ${l.type} leave`,sub:`${l.status} · ${l.days} day(s)`,at:l.createdAt}));
    S.applications().slice(0,4).forEach(a=>events.push({icon:'trend',bg:'var(--info-subtle)',color:'var(--info)',
      title:`${a.childName} applied — ${a.classApplied}`,sub:a.status,at:a.createdAt}));
    return events.sort((a,b)=>new Date(b.at)-new Date(a.at));
  },
  _teacherActivity(section){
    const S=this.S; const events=[]; const rec=S.getAttendance(section);
    if(rec){ const marks=Object.values(rec.marks); const present=marks.filter(m=>m==='P').length;
      events.push({icon:'check',bg:'var(--success-subtle)',color:'var(--success)',title:'Attendance saved — '+section,sub:`${present}/${marks.length} present`,at:rec.savedAt}); }
    S.myLeaves().slice(0,4).forEach(l=>events.push({icon:'calendar',bg:'var(--info-subtle)',color:'var(--info)',
      title:`Your ${l.type} leave — ${l.status}`,sub:`${fmt.date(l.from)} – ${fmt.date(l.to)}`,at:l.createdAt}));
    return events.sort((a,b)=>new Date(b.at)-new Date(a.at));
  },

  /* ========================================================================
     ATTENDANCE (Teacher) — the most-optimized screen. Default-present.
     ======================================================================== */
  Attendance(el){
    this._backTo='dashboard';
    if(!this.S.can(this.S.PERMS.ATTENDANCE_CREATE)) return this.noPermission(el);
    const secs=this.S.mySections();
    if(secs.length===0){ el.innerHTML=`<div class="state"><div class="state-ill">${icon('users')}</div><div class="state-title">No section assigned</div><div class="state-msg">You don't have a section assigned yet. Ask your Principal to assign one.</div></div>`; return; }
    if(secs.length===1){ this.openMarkAttendance(secs[0]); return; }
    el.innerHTML=`<p class="text-secondary mb-3">Choose a section to mark attendance.</p>
      <div class="card card-pad-0"><div class="list">${secs.map(sec=>{ const done=!!this.S.getAttendance(sec); return `<div class="row" onclick="App.openMarkAttendance('${sec}')">
        <div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon('users')}</div>
        <div class="row-main"><div class="row-title">Section ${sec}</div><div class="row-sub">${this.S.sectionRoster(sec).length} students</div></div>
        <span class="chip ${done?'chip-success':'chip-warning'}">${done?'Marked':'Pending'}</span>
        <span class="row-chev">${icon('chevronR')}</span></div>`; }).join('')}</div></div>`;
  },
  openMarkAttendance(section){ this.go('markAttendance',{sub:true,section,title:'Section '+section,subtitle:'Tap a student to mark absent'}); },
  MarkAttendance(el){
    this._backTo='attendance';
    const section=this.ctx.section;
    const roster=this.S.sectionRoster(section);
    const existing=this.S.getAttendance(section);
    this._attExisting=!!existing;
    // default: all present (existing marks if already saved)
    this._marks={}; roster.forEach(s=>{ this._marks[s.id]= existing? (existing.marks[s.id]||'P') : 'P'; });
    this.ctx.title='Section '+section;
    this.ctx.subtitle=existing?'Editing today\u2019s attendance':'Everyone starts Present — tap a state to change it';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    this._renderRoster(el,section,roster,existing);
  },
  _renderRoster(el,section,roster,existing){
    const counts=this._attCounts();
    const savedTime = existing ? fmt.ago(existing.savedAt) : '';
    el.innerHTML=`
      ${existing?`<div class="card mb-3" style="background:var(--info-subtle);border-color:transparent;display:flex;align-items:center;gap:10px">
        <span style="color:var(--info);display:grid">${icon('checkCircle')}</span>
        <div class="flex-1"><div class="t-label" style="font-weight:600;color:var(--info)">Already marked ${savedTime}</div><div class="t-caption">You're editing today's attendance. Changes overwrite the earlier save.</div></div>
      </div>`:''}
      <div class="card card-raised mb-3" style="position:sticky;top:0;z-index:5">
        <div class="flex between items-center mb-1"><span class="t-caption">Section ${section}</span><span class="t-caption">${roster.length} total</span></div>
        <div class="att-counts" id="att-counts">${this._countsMarkup(counts)}</div>
      </div>
      <p class="t-caption mb-3">Everyone's marked <b>Present</b> by default. Tap P / A / L / H / E to change a student.</p>
      <div class="card card-pad-0 mb-4"><div class="list" id="roster">
        ${roster.map(s=>this._attRow(s)).join('')}
      </div></div>
      <div class="wiz-footer"><button class="btn btn-primary btn-full btn-lg" onclick="App.saveAttendance('${section}')">${icon('check')} ${existing?'Update attendance':'Save attendance'}</button></div>`;
  },
  _countsMarkup(counts){
    return this.S.ATT_STATES.map(([code,label,cls])=>{
      const color = code==='P'?'var(--viz-positive)':code==='A'?'var(--viz-negative)':code==='L'?'var(--viz-warning)':code==='H'?'var(--info)':'var(--text-secondary)';
      return `<div><div class="t-data-lg" style="color:${color}">${counts[code]}</div><div class="t-caption">${label}</div></div>`;

      `:`

  },
  openPaymentSheet(id){
    const s=this.F.studentById(id); const inv=this.F.invoiceForStudent(id); const due=inv.total-inv.paid;
    this._payAmount=due; this._payMode='Cash';
    const {close}=UI.sheet(`
      <div class="sheet-title">Record payment</div>
      <div class="flex gap-2 items-center mb-4"><div class="avatar" style="background:${avatarColor(s.name)}">${initials(s.name)}</div><div><div class="row-title">${s.name}</div><div class="row-sub">${fmt.money(due)} outstanding</div></div></div>
      <div class="field"><label class="field-label">Amount</label>
        <div class="input-affix"><span class="prefix">₹</span><input class="input" id="pay-amt" type="number" value="${due}" inputmode="numeric"></div>
        <div class="field-hint">Defaults to full due. Edit for a partial payment.</div>
      </div>
      <div class="field"><label class="field-label">Payment mode</label>
        <div class="segmented" id="pay-mode">${['Cash','UPI','Cheque'].map(m=>`<button class="${m==='Cash'?'active':''}" onclick="App.setPayMode('${m}')">${m}</button>`).join('')}</div>
      </div>
      <div id="pay-warn"></div>
      <button class="btn btn-primary btn-full btn-lg mt-2" onclick="App.confirmPayment('${id}',${due})">${icon('check')} Confirm & generate receipt</button>
    `);
    this._payClose=close;
  },
  setPayMode(m){ this._payMode=m; document.querySelectorAll('#pay-mode button').forEach(b=>b.classList.toggle('active',b.textContent===m)); },
  confirmPayment(id,due){
    const amt=Number(document.getElementById('pay-amt').value);
    const warn=document.getElementById('pay-warn');
    if(!amt||amt<=0){ warn.innerHTML=`<div class="field-error mb-2">${icon('alert')} Enter a valid amount.</div>`; return; }
    if(amt>due){ // overpay guardrail — never silent
      warn.innerHTML=`<div class="field-error mb-2">${icon('alert')} ₹${amt} exceeds the ₹${due} due. Reduce the amount.</div>`; return;
    }
    // wrong-student guardrail — confirm WHO and HOW MUCH before money moves (busy desk reality)
    const s=this.F.studentById(id);
    UI.confirm({
      title:'Confirm this payment',
      message:`Record ${fmt.money(amt)} by ${this._payMode} for ${s.name} (${s.section}, Roll ${s.roll})? This generates a receipt.`,
      confirmText:'Yes, record it'
    }).then(ok=>{ if(ok) this._applyPayment(id,amt); });
  },
  _applyPayment(id,amt){
    const inv=this.F.invoiceForStudent(id);
    const invs=this.F._allInvoices(); const target=invs.find(i=>i.id===inv.id);
    target.paid+=amt; target.status= target.paid>=target.total?'Paid':target.paid>0?'Partial':'Unpaid';
    this.F._set(this.F.COLS.INVOICES,invs);
    const pays=this.F._allPayments();
    const rcp={id:'RCP-'+String(Date.now()).slice(-5),invoiceId:inv.id,studentId:id,studentName:this.F.studentById(id).name,branchId:this.F.studentById(id).branchId,amount:amt,mode:this._payMode,at:new Date().toISOString(),items:inv.items.map(x=>x.type)};
    pays.push(rcp); this.F._set(this.F.COLS.PAYMENTS,pays);
    this._payClose&&this._payClose();
    this.showReceipt(rcp);
  },
  showReceipt(rcp){
    const s=this.F.studentById(rcp.studentId); const inv=this.F.invoiceForStudent(rcp.studentId); const due=inv.total-inv.paid;
    const {close}=UI.sheet(`
      <div style="text-align:center;margin-bottom:16px"><div class="modal-icon success" style="margin:0 auto 12px">${icon('checkCircle')}</div>
      <div class="t-h2">Payment recorded</div><div class="row-sub">${fmt.money(rcp.amount)} · ${rcp.mode}</div></div>
      <div class="card mb-4" style="border-style:dashed">
        <div class="text-center mb-3"><div class="t-h3">${this.F.settings().schoolName}</div><div class="t-caption">Fee Receipt · ${rcp.id}</div></div>
        <div class="dl">
          <div class="dl-row"><span class="dl-key">Student</span><span class="dl-val">${s.name}</span></div>
          <div class="dl-row"><span class="dl-key">Section</span><span class="dl-val">${s.section}</span></div>
          <div class="dl-row"><span class="dl-key">Amount paid</span><span class="dl-val t-data">${fmt.money(rcp.amount)}</span></div>
          <div class="dl-row"><span class="dl-key">Mode</span><span class="dl-val">${rcp.mode}</span></div>
          <div class="dl-row"><span class="dl-key">Date</span><span class="dl-val">${fmt.date(rcp.at)}</span></div>
          <div class="dl-row"><span class="dl-key">Balance due</span><span class="dl-val t-data" style="color:${due>0?'var(--viz-negative)':'var(--viz-positive)'}">${fmt.money(due)}</span></div>
        </div>
      </div>
      <div class="flex gap-3"><button class="btn btn-secondary btn-full" onclick="App.notImplemented('Share receipt')">${icon('mail')} Share</button>
      <button class="btn btn-primary btn-full" onclick="App._receiptDone()">Done</button></div>
    `);
    this._receiptClose=close;

  _receiptDone(){ this._receiptClose&&this._receiptClose(); this.go('payments'); UI.toast('Receipt saved'); },

  /* ========================================================================
     ADMISSIONS (Receptionist) — funnel + leads + capture
     ======================================================================== */
  Admissions(el){
    this._backTo='dashboard';
    if(!this.S.can(this.S.PERMS.LEAD_VIEW)) return this.noPermission(el);
    this._leadFilter=this._leadFilter||'all';
    const sk=`<div class="sk" style="height:90px;border-radius:14px;margin-bottom:16px"></div>${'<div class="sk-row"><div class="sk sk-circle"></div><div style="flex:1"><div class="sk sk-line" style="width:55%"></div><div class="sk sk-line" style="width:35%"></div></div></div>'.repeat(5)}`;
    this.withLoading(el,sk,()=>this.admissionsMarkup());
  },
  admissionsMarkup(){
    const leads=this.S.leads();
    if(leads.length===0) return `<div class="state"><div class="state-ill">${icon('trend')}</div><div class="state-title">No leads yet</div><div class="state-msg">Capture your first enquiry — it takes about 20 seconds.</div><button class="btn btn-primary btn-lg mt-2" onclick="App.newLead()">${icon('plus')} New enquiry</button></div>`;
    const funnel=this.S.funnel(); const max=Math.max(...funnel.map(f=>f.count),1);
    const stages=['all','Enquiry','Contacted','Visited','Applied','Admitted'];
    const f=this._leadFilter;
    let list = f==='all'?leads:leads.filter(l=>l.stage===f);
    return `
      <div class="card card-raised mb-4"><div class="sec-title mb-3">Admissions funnel</div>
        ${funnel.map(x=>`<div class="mb-2"><div class="flex between mb-1"><span class="t-label">${x.stage}</span><span class="t-data" style="font-weight:700">${x.count}</span></div>
        <div style="height:8px;background:var(--surface-sunken);border-radius:99px;overflow:hidden"><div style="width:${(x.count/max)*100}%;height:100%;background:var(--brand);border-radius:99px"></div></div></div>`).join('')}
      </div>
      <div class="filter-row">${stages.map(s=>`<button class="filter-chip ${f===s?'active':''}" onclick="App.filterLeads('${s}')">${s==='all'?'All':s}</button>`).join('')}</div>
      ${list.length===0?`<div class="dashed-card">No leads in this stage</div>`:`<div class="card card-pad-0"><div class="list">${list.map(l=>this.leadRow(l)).join('')}</div></div>`}
      <button class="fab" onclick="App.newLead()" aria-label="New enquiry">${icon('plus')}</button>`;
  },
  leadRow(l){
    const due=l.followUp && l.followUp<=new Date().toISOString().split('T')[0];
    const stageChip={Enquiry:'chip-neutral',Contacted:'chip-info',Visited:'chip-warning',Applied:'chip-brand',Admitted:'chip-success'}[l.stage];
    return `<div class="row" onclick="App.openLead('${l.id}')">
      <div class="avatar" style="background:${avatarColor(l.childName)}">${initials(l.childName)}</div>
      <div class="row-main"><div class="row-title">${l.childName}</div><div class="row-sub">${l.classInterested} · ${l.source}${due?' · <span style="color:var(--viz-warning)">follow up</span>':''}</div></div>
      <span class="chip ${stageChip}">${l.stage}</span>
      <span class="row-chev">${icon('chevronR')}</span></div>`;
  },
  filterLeads(s){ this._leadFilter=s; document.getElementById('screen').innerHTML=this.admissionsMarkup(); },
  newLead(){
    this._dupeAck=false;
    const {close}=UI.sheet(`
      <div class="sheet-title">New enquiry</div>
      <div class="field"><label class="field-label">Child's name <span class="req">*</span></label><input class="input" id="nl-child" placeholder="Full name"></div>
      <div class="field"><label class="field-label">Parent's name <span class="req">*</span></label><input class="input" id="nl-parent" placeholder="Parent / guardian"></div>
      <div class="field"><label class="field-label">Phone <span class="req">*</span></label><input class="input" id="nl-phone" type="tel" inputmode="tel" placeholder="+91 …"></div>
      <div class="field"><label class="field-label">Class interested</label>
        <select class="select" id="nl-class">${['Nursery','LKG','UKG','Class 1','Class 2','Class 3'].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Source</label>
        <select class="select" id="nl-source">${['Walk-in','Phone','Referral','Website','Social media'].map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div id="nl-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-2" onclick="App.saveLead()">${icon('check')} Capture lead</button>
    `);
    this._leadClose=close;
  },
  saveLead(){
    const g=id=>document.getElementById(id).value.trim();
    const child=g('nl-child'), parent=g('nl-parent'), phone=g('nl-phone');
    if(!child||!parent||!phone){ document.getElementById('nl-err').innerHTML=`<div class="field-error mb-2">${icon('alert')} Name, parent and phone are required.</div>`; return; }
    // soft duplicate check — same phone already in the pipeline (parent enquired twice)
    const digits=phone.replace(/\D/g,'').slice(-10);
    const dupe=this.S.leads().find(l=>l.phone.replace(/\D/g,'').slice(-10)===digits && digits.length>=10);
    if(dupe && !this._dupeAck){
      document.getElementById('nl-err').innerHTML=`<div class="field-error mb-2">${icon('alert')} A lead with this phone already exists: <b>${dupe.childName}</b> (${dupe.stage}). Tap Capture again to add anyway.</div>`;
      this._dupeAck=true; return;
    }
    this._dupeAck=false;
    this.S.addLead({childName:child,parentName:parent,phone,classInterested:g('nl-class'),source:g('nl-source')});
    this._leadClose&&this._leadClose();
    if(this.route!=='admissions') this.go('admissions'); else document.getElementById('screen').innerHTML=this.admissionsMarkup();
    UI.toast('Lead captured');
  },
  openLead(id){ this.go('lead',{sub:true,id,title:'Lead',_back:'admissions'}); },

      </div></div>
      <div class="sec-head"><div class="sec-title">Stage</div></div>
      <div class="card mb-4">
        <div class="flex gap-2" style="flex-wrap:wrap">${stages.map((st,i)=>`<span class="chip ${i<=idx?'chip-brand':'chip-neutral'}">${st}</span>`).join('')}</div>
        ${stageAction}
      </div>

        const funnel=this.S.funnel(); const fmax=Math.max(...funnel.map(f=>f.count),1);
        html+=`<div class="card mb-4"><div class="sec-title mb-4">Admissions funnel</div>

      </div></div>
      <div class="sec-head"><div class="sec-title">Role & access</div>${this.S.can(this.S.PERMS.ROLE_VIEW)?`<button class="sec-link" onclick="App.openRole('${r?r.id:''}')">View role</button>`:''}</div>
      <div class="card mb-4">
        <div class="flex between items-center mb-3"><div class="row-title">${r?r.name:'—'}</div><span class="chip chip-brand">${r?r.perms.length:0} permissions</span></div>
        <div class="flex gap-2" style="flex-wrap:wrap">${r?this._permChips(r.perms):''}</div>
      </div>
      ${canEdit?`<button class="btn btn-secondary btn-full" onclick="App.go('editStaff',{sub:true,id:'${u.id}',edit:true})">${icon('edit')} Edit staff</button>`:''}`;
  },
  _permChips(perms){
    // show module-grouped counts as chips (a full list would overwhelm)
    const byMod={}; perms.forEach(p=>{ const m=this.S.moduleOf(p); byMod[m]=(byMod[m]||0)+1; });
    return Object.entries(byMod).map(([m,n])=>`<span class="chip chip-neutral">${m} ${n}</span>`).join('');
  },

  /* ---- ADD / EDIT STAFF — the flagged screen ---- */
  AddStaff(el){
    const editing=!!this.ctx.edit; const existing=editing?this.S.staffUserById(this.ctx.id):null;
    this._backTo=editing?'staffDetail':'staffList';
    // working draft
    this._staffDraft = existing ? {
      name:existing.name,email:existing.email,password:existing.passwordSet?'••••••••':'',
      designation:existing.designation,department:existing.department||'',
      reportsToId:existing.reportsToId||'',roleId:existing.roleId,section:existing.section||''
    } : { name:'',email:'',password:'',designation:'',department:'',reportsToId:'',roleId:this.S.roleByCode('TEACHER').id,section:'' };
    // custom permission overrides start from the selected role's perms
    const role=this.S.roleById(this._staffDraft.roleId);
    this._permDraft = new Set(role?role.perms:[]);
    this._permCustomised=false;
    this.ctx.sub=true; this.ctx.title=editing?'Edit staff':'Add staff';
    this.ctx.subtitle=editing?'Update details & access':'Creates a real login — only you can do this';
    this.ctx.action='';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    el.innerHTML=this._addStaffMarkup(editing);
  },
  _addStaffMarkup(editing){
    const d=this._staffDraft;
    const depts=typeof FounderDB!=='undefined'&&FounderDB.departmentNames().length>0 ? FounderDB.departmentNames() : ['Academics','Administration','Finance','Science Lab','Sports'];
    const managers=this.S.staffUsers().filter(u=>!editing||u.id!==this.ctx.id);
    const roles=this.S.roles();
    return `
      <div class="field"><label class="field-label">Full name <span class="req">*</span></label>
        <input class="input" id="st-name" placeholder="e.g. Priya Sharma" value="${d.name}" oninput="App._staffField('name',this.value)"></div>
      <div class="field"><label class="field-label">Login email <span class="req">*</span></label>
        <div class="input-affix"><span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('mail')}</span>
        <input class="input" style="padding-left:42px" id="st-email" type="email" inputmode="email" placeholder="name@school.edu" value="${d.email}" oninput="App._staffField('email',this.value)"></div></div>
      <div class="field"><label class="field-label">${editing?'Reset login password':'Set login password'} ${editing?'':'<span class="req">*</span>'}</label>
        <div class="input-affix"><span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('lock')}</span>
        <input class="input" style="padding-left:42px" id="st-pass" type="text" placeholder="${editing?'Leave blank to keep current':'Temporary password'}" value="${editing?'':d.password}" oninput="App._staffField('password',this.value)"></div>
        <div class="field-hint">They'll be asked to change it on first login.</div></div>
      <div class="field"><label class="field-label">Designation <span class="req">*</span></label>
        <input class="input" id="st-desig" placeholder="e.g. Class Teacher, Librarian" value="${d.designation}" oninput="App._staffField('designation',this.value)"></div>
      <div class="field"><label class="field-label">Department</label>
        <select class="select" id="st-dept" onchange="App._staffField('department',this.value)">
          <option value="">Select department</option>
          ${depts.map(x=>`<option ${d.department===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Reports to</label>
        <select class="select" id="st-mgr" onchange="App._staffField('reportsToId',this.value)">
          <option value="">— None (top level) —</option>
          ${managers.map(u=>`<option value="${u.id}" ${d.reportsToId===u.id?'selected':''}>${u.name} · ${u.designation}</option>`).join('')}</select></div>

      <div class="sec-head"><div class="sec-title">Role &amp; permissions</div></div>
      <p class="t-caption mb-3">Pick a role to pre-fill its permissions, then fine-tune below if this person needs something different.</p>
      <div class="field"><label class="field-label">Role <span class="req">*</span></label>
        <select class="select" id="st-role" onchange="App.pickStaffRole(this.value)">
          ${roles.map(r=>`<option value="${r.id}" ${d.roleId===r.id?'selected':''}>${r.name}${r.system?'':' (custom)'}</option>`).join('')}</select>
        <div class="field-hint" id="role-hint">${this._roleHint()}</div></div>

      <div id="perm-picker">${this._permPickerMarkup()}</div>

      <div id="st-err"></div>
      <div class="wiz-footer"><button class="btn btn-primary btn-full btn-lg" onclick="App.saveStaff(${editing})">${icon('check')} ${editing?'Save changes':'Create staff & login'}</button></div>`;
  },
  _roleHint(){ const r=this.S.roleById(this._staffDraft.roleId); return r?`${r.name}: ${r.desc}`:''; },
  _staffField(k,v){ this._staffDraft[k]=v; },
  pickStaffRole(roleId){
    this._staffDraft.roleId=roleId;
    const r=this.S.roleById(roleId);
    this._permDraft = new Set(r?r.perms:[]);
    this._permCustomised=false;
    document.getElementById('role-hint').textContent=this._roleHint();
    document.getElementById('perm-picker').innerHTML=this._permPickerMarkup();
  },
  _permPickerMarkup(){
    const total=this.S.allPerms().length; const on=this._permDraft.size;
    this._permOpenModules=this._permOpenModules||new Set();
    return `
      <div class="card mb-2 flex between items-center" style="background:var(--brand-subtle);border-color:transparent">
        <div><div class="t-label" style="font-weight:700;color:var(--brand)">${on} of ${total} permissions</div>
          <div class="t-caption">${this._permCustomised?'Customised for this person':'Matches the '+(this.S.roleById(this._staffDraft.roleId)||{}).name+' role'}</div></div>
        ${this._permCustomised?`<button class="btn btn-secondary btn-sm" onclick="App.resetPerms()">Reset to role</button>`:''}
      </div>
      ${this.S.CATALOG.map(m=>{
        const open=this._permOpenModules.has(m.module);
        const modOn=m.perms.filter(p=>this._permDraft.has(p[0])).length;
        return `<div class="card card-pad-0 mb-2">
          <div class="row" onclick="App.togglePermModule('${m.module}')" style="cursor:pointer">
            <div class="avatar avatar-sq" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon(m.icon)}</div>
            <div class="row-main"><div class="row-title" style="font-weight:600">${m.label}</div><div class="row-sub">${modOn} of ${m.perms.length} selected</div></div>
            <span style="transform:rotate(${open?180:0}deg);transition:transform .2s;color:var(--text-tertiary)">${icon('chevronD')}</span>
          </div>
          ${open?`<div style="padding:4px 12px 12px">${m.perms.map(p=>{
            const checked=this._permDraft.has(p[0]);
            return `<div class="perm-check ${checked?'on':''}" onclick="App.togglePerm('${p[0]}')">
              <div class="perm-box">${checked?icon('check'):''}</div>
              <div class="flex-1"><div class="t-label" style="font-weight:500">${p[1]}</div><div class="t-code" style="font-size:11px;color:var(--text-tertiary)">${p[0]}</div></div>
            </div>`; }).join('')}</div>`:''}
        </div>`; }).join('')}`;
  },
  togglePermModule(mod){ if(this._permOpenModules.has(mod))this._permOpenModules.delete(mod); else this._permOpenModules.add(mod); document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  togglePerm(code){ if(this._permDraft.has(code))this._permDraft.delete(code); else this._permDraft.add(code); this._permCustomised=true; document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  resetPerms(){ const r=this.S.roleById(this._staffDraft.roleId); this._permDraft=new Set(r?r.perms:[]); this._permCustomised=false; document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  saveStaff(editing){
    const d=this._staffDraft; const err=document.getElementById('st-err');
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
    if(!d.name.trim()||!d.email.trim()||!d.designation.trim()){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name, login email and designation are required.</div>`; return; }
    if(!emailOk){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Enter a valid login email.</div>`; return; }
    if(!editing && !d.password.trim()){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Set a login password for the new staff member.</div>`; return; }
    // If permissions were customised away from the template role, persist as a per-user custom role
    let roleId=d.roleId;
    if(this._permCustomised){
      const base=this.S.roleById(d.roleId);
      const custom=this.S.addRole({name:d.name.split(' ')[0]+' — custom',desc:'Custom access based on '+(base?base.name:'a role'),perms:[...this._permDraft]});
      roleId=custom.id;
    }
    if(editing){
      const patch={name:d.name,email:d.email,designation:d.designation,department:d.department,reportsToId:d.reportsToId||null,roleId};
      if(d.password && d.password!=='••••••••'){ patch.password=d.password; patch.passwordSet=true; }
      this.S.updateStaff(this.ctx.id,patch);
      UI.toast('Staff updated');
      this.go('staffDetail',{sub:true,id:this.ctx.id,title:'Staff'});
    }else{
      const u=this.S.addStaff({name:d.name,email:d.email,password:d.password,designation:d.designation,department:d.department,reportsToId:d.reportsToId||null,roleId,section:d.section||null});
      this._staffCreatedToast(u);
      this.go('staffList');
    }
  },
  _staffCreatedToast(u){ UI.toast(`${u.name} added — login created for ${u.email}`); },

  /* ---- ROLES & PERMISSIONS ---- */
  Roles(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Roles & permissions';
    this.ctx.subtitle=this.S.roles().length+' roles';
    this.ctx.action='';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const roles=this.S.roles();
    el.innerHTML=`
      <p class="t-caption mb-3">Roles are editable bundles of permissions. Every staff member is assigned a role; a custom role can be created any time.</p>
      <div class="card card-pad-0 mb-4"><div class="list">
        ${roles.map(r=>{ const count=this.S.staffUsers().filter(u=>u.roleId===r.id).length; return `<div class="row" onclick="App.openRole('${r.id}')">
          <div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon('shield')}</div>
          <div class="row-main"><div class="row-title">${r.name} ${r.system?'':'<span class="chip chip-neutral" style="margin-left:4px">custom</span>'}</div><div class="row-sub">${r.perms.length} permissions · ${count} staff</div></div>
          <span class="row-chev">${icon('chevronR')}</span></div>`; }).join('')}
      </div></div>`;
  },
  openRole(id){ if(!id)return; this.go('roleDetail',{sub:true,id,title:'Role'}); },
  RoleDetail(el){
    const r=this.S.roleById(this.ctx.id); if(!r){ el.innerHTML='<div class="state"><div class="state-title">Not found</div></div>'; return; }
    this._backTo='roles';
    const canEdit=this.S.can(this.S.PERMS.ROLE_UPDATE) && !r.system; // system roles are read-only in-prototype
    this.ctx.title=r.name; this.ctx.subtitle=r.system?'System role (read-only)':'Custom role';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const staffCount=this.S.staffUsers().filter(u=>u.roleId===r.id).length;
    el.innerHTML=`
      <div class="card mb-4"><div class="dl">
        <div class="dl-row"><span class="dl-key">Description</span><span class="dl-val">${r.desc||'—'}</span></div>
        <div class="dl-row"><span class="dl-key">Permissions</span><span class="dl-val">${r.perms.length}</span></div>
        <div class="dl-row"><span class="dl-key">Assigned to</span><span class="dl-val">${staffCount} staff</span></div>
        <div class="dl-row"><span class="dl-key">Type</span><span class="dl-val">${r.system?'System (template)':'Custom'}</span></div>
      </div></div>
      <div class="sec-head"><div class="sec-title">Permissions by module</div></div>
      ${this.S.CATALOG.map(m=>{ const granted=m.perms.filter(p=>r.perms.includes(p[0])); if(granted.length===0)return '';
        return `<div class="card card-pad-0 mb-2"><div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon(m.icon)}</div>
          <div class="row-main"><div class="row-title" style="font-weight:600">${m.label}</div><div class="row-sub">${granted.map(p=>p[1]).join(' · ')}</div></div>
          <span class="chip chip-brand">${granted.length}</span></div></div>`; }).join('')}
      ${r.system?`<div class="dashed-card mt-3">${icon('shield')} <span class="t-caption">System template roles are read-only here. To customise access for one person, edit their staff record and fine-tune permissions.</span></div>`:''}`;
  },

  /* ========================================================================
     PHASE D STUBS — flesh out in Phase D. Kept minimal so rows don't dead-end.
     ======================================================================== */
  /* ========================================================================
     PHASE D — SELF CHECK-IN, STAFF ATTENDANCE OVERVIEW, ACADEMIC STRUCTURE
     ======================================================================== */

  /* ---- SELF CHECK-IN/OUT — every staff member, permission-gated by STAFF.ATTENDANCE.CREATE ---- */
  SelfCheckIn(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Self check-in'; this.ctx.subtitle='';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    if(!this.S.can(this.S.PERMS.STAFF_ATT_CREATE)) return this.noPermission(el);
    el.innerHTML=this._checkInMarkup();
  },
  _checkInMarkup(){
    const rec=this.S.myStaffAttendance();
    const today=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    const history=this.S.myRecentAttendance(6).slice(1); // exclude today, show last 5 days
    let status,action;
    if(!rec||!rec.checkIn){
      status=`<div class="card card-raised mb-4" style="text-align:center;padding:32px 20px">
        <div class="mb-2" style="color:var(--text-tertiary)">${icon('clock')}</div>
        <div class="t-h3 mb-1">Not checked in yet</div><div class="row-sub">${today}</div></div>`;
      action=`<button class="btn btn-primary btn-full btn-lg" onclick="App.doCheckIn()">${icon('check')} Check in</button>`;
    }else if(rec.checkIn && !rec.checkOut){
      status=`<div class="card card-raised mb-4" style="text-align:center;padding:32px 20px;background:var(--success-subtle);border-color:transparent">
        <div class="mb-2" style="color:var(--success)">${icon('checkCircle')}</div>
        <div class="t-h3 mb-1" style="color:var(--success)">Checked in</div><div class="row-sub">${fmt.date(rec.checkIn)} · ${new Date(rec.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div></div>`;
      action=`<button class="btn btn-secondary btn-full btn-lg" onclick="App.doCheckOut()">${icon('check')} Check out</button>`;
    }else{
      const dur=Math.round((new Date(rec.checkOut)-new Date(rec.checkIn))/60000);
      status=`<div class="card card-raised mb-4" style="text-align:center;padding:32px 20px">
        <div class="mb-2" style="color:var(--brand)">${icon('checkCircle')}</div>
        <div class="t-h3 mb-1">Done for today</div>
        <div class="row-sub">In ${new Date(rec.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · Out ${new Date(rec.checkOut).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})} · ${Math.floor(dur/60)}h ${dur%60}m</div></div>`;
      action=`<button class="btn btn-secondary btn-full btn-lg" onclick="App.doCheckOut()">${icon('clock')} Update check-out time</button>`;
    }
    return `${status}${action}
      <div class="sec-head mt-4"><div class="sec-title">This week</div></div>
      <div class="card card-pad-0 mb-4"><div class="list">${history.map(h=>{
        const d=new Date(h.date); const label=d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
        const present=!!h.checkIn;
        return `<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:${present?'var(--success-subtle)':'var(--surface-sunken)'};color:${present?'var(--success)':'var(--text-tertiary)'}">${icon(present?'check':'clock')}</div>
        <div class="row-main"><div class="row-title" style="font-weight:500">${label}</div><div class="row-sub">${present?(new Date(h.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+(h.checkOut?' – '+new Date(h.checkOut).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):' · still open')):'Not checked in'}</div></div></div>`; }).join('')}</div></div>`;
  },
  doCheckIn(){ this.S.staffCheckIn(); UI.toast('Checked in · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})); document.getElementById('screen').innerHTML=this._checkInMarkup(); },
  doCheckOut(){ this.S.staffCheckOut(); UI.toast('Checked out · '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})); document.getElementById('screen').innerHTML=this._checkInMarkup(); },

  /* ---- STAFF ATTENDANCE OVERVIEW (Principal) — who's in today, at a glance ---- */
  StaffAttendance(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Staff attendance'; this.ctx.subtitle=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    if(!(this.S.can(this.S.PERMS.STAFF_ATT_VIEW)&&this.S.can(this.S.PERMS.STAFF_VIEW))) return this.noPermission(el);
    const roster=this.S.staffAttendanceRoster();
    // not-checked-in first, so a Principal notices gaps immediately
    const sorted=[...roster].sort((a,b)=>(a.checkIn?1:0)-(b.checkIn?1:0));
    const inCount=roster.filter(r=>r.checkIn).length;
    el.innerHTML=`
      <div class="grid-2 mb-4">
        ${this.dashKpi('checkCircle','Checked in',inCount,'var(--viz-positive)','of '+roster.length+' staff')}
        ${this.dashKpi('clock','Not yet',roster.length-inCount,(roster.length-inCount)?'var(--viz-warning)':'var(--viz-positive)')}
      </div>
      <div class="card card-pad-0 mb-4"><div class="list">${sorted.map(r=>{
        const state = !r.checkIn ? ['warning','Not checked in','clock'] : !r.checkOut ? ['success','Checked in','checkCircle'] : ['neutral','Checked out','check'];
        const time = r.checkIn ? new Date(r.checkIn).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) + (r.checkOut?' – '+new Date(r.checkOut).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'') : '—';
        return `<div class="row" style="cursor:default"><div class="avatar" style="background:${avatarColor(r.name)}">${initials(r.name)}</div>
          <div class="row-main"><div class="row-title">${r.name}</div><div class="row-sub">${r.designation} · ${time}</div></div>
          <span class="chip chip-${state[0]}">${state[1]}</span></div>`; }).join('')}</div></div>`;
  },

  /* ---- ACADEMIC STRUCTURE (Principal) — class levels, sections, subjects CRUD ---- */
  AcademicStructure(el){
    this._backTo='more'; this.ctx.sub=true; this.ctx.title='Academic structure'; this.ctx.subtitle='Classes, sections & subjects';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    if(!this.S.can(this.S.PERMS.ACADEMIC_MANAGE)) return this.noPermission(el);
    this._acadTab=this._acadTab||'classLevels';
    el.innerHTML=this._academicMarkup();
  },
  _academicMarkup(){
    const a=this.S.academic(); const tab=this._acadTab;
    const tabs=[['classLevels','Class levels',a.classLevels.length],['sections','Sections',a.sections.length],['subjects','Subjects',a.subjects.length]];
    return `<div class="segmented mb-4">${tabs.map(([k,l,n])=>`<button class="${tab===k?'active':''}" onclick="App.setAcadTab('${k}')">${l} (${n})</button>`).join('')}</div>
      <div id="acad-list">${this._acadListMarkup()}</div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App.addAcadItem()">${icon('plus')} Add ${tab==='classLevels'?'class level':tab==='sections'?'section':'subject'}</button>`;
  },
  _acadListMarkup(){
    const a=this.S.academic(); const tab=this._acadTab; const items=a[tab];
    if(items.length===0) return `<div class="dashed-card">No ${tab==='classLevels'?'class levels':tab} yet — add the first one below.</div>`;
    return `<div class="card card-pad-0"><div class="list">${items.map(it=>{
      let sub='';
      if(tab==='sections') sub=`${it.classLevel} · Homeroom: ${it.teacher||'Unassigned'}`;
      else if(tab==='subjects') sub=it.code;
      return `<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon(tab==='sections'?'users':tab==='subjects'?'building2':'building2')}</div>
        <div class="row-main"><div class="row-title">${it.name}</div>${sub?`<div class="row-sub">${sub}</div>`:''}</div>
        <button class="appbar-btn" style="width:36px;height:36px" onclick="App.removeAcadItem('${it.id}')" aria-label="Remove">${icon('trash')}</button></div>`; }).join('')}</div></div>`;
  },
  setAcadTab(k){ this._acadTab=k; document.getElementById('screen').innerHTML=this._academicMarkup(); },
  addAcadItem(){
    const tab=this._acadTab; const S=this.S;
    if(tab==='classLevels'){
      const {close}=UI.sheet(`<div class="sheet-title">Add class level</div>
        <div class="field"><label class="field-label">Name <span class="req">*</span></label><input class="input" id="ac-name" placeholder="e.g. Class 6"></div>
        <div id="ac-err"></div>
        <button class="btn btn-primary btn-full" onclick="App.saveAcadItem()">Add</button>`);
      this._acadClose=close;
    }else if(tab==='subjects'){
      const {close}=UI.sheet(`<div class="sheet-title">Add subject</div>
        <div class="field"><label class="field-label">Name <span class="req">*</span></label><input class="input" id="ac-name" placeholder="e.g. Computer Science"></div>
        <div class="field"><label class="field-label">Code</label><input class="input" id="ac-code" placeholder="e.g. CS" style="text-transform:uppercase"></div>
        <div id="ac-err"></div>
        <button class="btn btn-primary btn-full" onclick="App.saveAcadItem()">Add</button>`);
      this._acadClose=close;
    }else{ // sections
      const a=S.academic(); const teachers=S.staffUsers();
      const {close}=UI.sheet(`<div class="sheet-title">Add section</div>
        <div class="field"><label class="field-label">Section name <span class="req">*</span></label><input class="input" id="ac-name" placeholder="e.g. 6-A"></div>
        <div class="field"><label class="field-label">Class level <span class="req">*</span></label>
          <select class="select" id="ac-class">${a.classLevels.map(c=>`<option>${c.name}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">Homeroom teacher</label>
          <select class="select" id="ac-teacher"><option value="">— Unassigned —</option>${teachers.map(t=>`<option>${t.name}</option>`).join('')}</select></div>
        <div id="ac-err"></div>
        <button class="btn btn-primary btn-full" onclick="App.saveAcadItem()">Add</button>`);
      this._acadClose=close;
    }
  },
  saveAcadItem(){
    const tab=this._acadTab; const name=document.getElementById('ac-name').value.trim();
    const err=document.getElementById('ac-err');
    if(!name){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name is required.</div>`; return; }
    if(tab==='classLevels') this.S.addAcademic('classLevels',{name});
    else if(tab==='subjects') this.S.addAcademic('subjects',{name,code:(document.getElementById('ac-code').value.trim()||name.slice(0,3).toUpperCase())});
    else this.S.addAcademic('sections',{name,classLevel:document.getElementById('ac-class').value,teacher:document.getElementById('ac-teacher').value||null});
    this._acadClose&&this._acadClose();
    document.getElementById('screen').innerHTML=this._academicMarkup();
    UI.toast('Added');
  },
  removeAcadItem(id){
    UI.confirm({title:'Remove this item?',message:'This cannot be undone in the prototype.',confirmText:'Remove',danger:true}).then(ok=>{
      if(ok){ this.S.removeAcademic(this._acadTab,id); document.getElementById('screen').innerHTML=this._academicMarkup(); UI.toast('Removed'); }
    });
  },

  /* ---- prototype user switcher (review affordance, NOT a product feature) ----
     Switches the "logged-in" staff member. Each person carries their assigned
     role's LIVE permission set — the app recomputes navigation & screens from
     can(code), never from a role name. This is the frontend mirror of the
     backend's dynamic RBAC. */
  roleSwitcher(){
    const users=this.S.staffUsers(); const activeId=this.S.activeUser().id;
    const {close}=UI.sheet(`<div class="sheet-title">Switch staff member</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Review affordance only — see how the app recomputes navigation & screens from each person's live permissions. Not a real product feature (in production, each person logs in).</p>
      ${users.map(u=>{ const r=this.S.roleById(u.roleId); return `<div class="row" style="border:none;padding:12px 4px" onclick="App.pickUser('${u.id}')">
        <div class="avatar" style="background:${avatarColor(u.name)}">${u.avatar}</div>
        <div class="row-main"><div class="row-title">${u.name}</div><div class="row-sub">${u.designation} · ${r?r.name:'-'} · ${r?r.perms.length:0} permissions</div></div>
        ${activeId===u.id?`<span style="color:var(--brand)">${icon('check')}</span>`:''}</div>`; }).join('')}
      <button class="btn btn-secondary btn-full mt-4" onclick="App._roleClose()">Done</button>`);
    this._roleClose=close;
  },
  pickUser(id){ this.S.setActiveUser(id); this._roleClose&&this._roleClose(); this.route='dashboard'; this.ctx={}; this.render(); UI.toast('Now viewing as '+this.S.activeUser().name); },
  pickRole(r){ this.pickUser(r); }, // back-compat alias

  /* ---- theme (shared) ---- */
  themes:[['violet','Violet','#7C5CFF','Default'],['indigo','Indigo','#4F46E5',''],['emerald','Emerald','#059669',''],['slate','Slate','#475569',''],['amber','Warm Amber','#D97706',''],['contrast','High Contrast','#1D4ED8','Accessibility']],
  themeName(k){ return (this.themes.find(t=>t[0]===k)||[])[1]||k; },
  openThemeSheet(){
    const st=this.F.settings();
    const {el,close}=UI.sheet(`<div class="sheet-title">Appearance</div>
      <div class="segmented mb-4" id="modeSeg">${[['light','Light'],['dark','Dark'],['system','Auto']].map(([k,l])=>`<button class="${st.mode===k?'active':''}" onclick="App.setMode('${k}')">${l}</button>`).join('')}</div>
      <div class="field-label mb-2">Theme</div><div id="themeList"></div>
      <button class="btn btn-secondary btn-full mt-4" onclick="App._themeClose()">Done</button>`);
    this._themeSheetEl=el; this._themeClose=close; this._renderThemeList();
  },
  _renderThemeList(){
    const st=this.F.settings();
    this._themeSheetEl.querySelector('#themeList').innerHTML=this.themes.map(([k,name,col,tag])=>`
      <div class="row" style="border:none;padding:10px 4px" onclick="App.setTheme('${k}')">
        <div style="width:36px;height:36px;border-radius:50%;background:${col};border:2px solid var(--border-subtle);flex-shrink:0"></div>
        <div class="row-main"><div class="row-title" style="font-weight:600">${name}</div>${tag?`<div class="row-sub">${tag}</div>`:''}</div>
        ${st.theme===k?`<span style="color:var(--brand)">${icon('check')}</span>`:''}</div>`).join('');
  },
  setTheme(k){ this.F.updateSettings({theme:k}); this.applyTheme(k,this.F.settings().mode); this._renderThemeList(); },
  setMode(k){ this.F.updateSettings({mode:k}); this.applyTheme(this.F.settings().theme,k); this._themeSheetEl.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().startsWith(k==='system'?'auto':k))); },

  /* ---- helpers ---- */
  noPermission(el){ el.innerHTML=`<div class="state"><div class="state-ill">${icon('shield')}</div><div class="state-title">Not available</div><div class="state-msg">Your role doesn't include this. Navigation only ever shows what you're permitted to use.</div></div>`; },
  notImplemented(w){ UI.toast((w||'This')+' — demonstrated in a later stage','error'); },
  resetPrompt(){ UI.confirm({title:'Reset demo data?',message:'Leads, leaves, attendance and payments will be regenerated.',confirmText:'Reset',danger:true}).then(ok=>{ if(ok){ this.S.reset(); this.F.reset(); this.route='dashboard'; this.ctx={}; this.render(); UI.toast('Demo data reset'); } }); },
};
App.init();
</script>
</body>
</html>
