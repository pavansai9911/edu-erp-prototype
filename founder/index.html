<!DOCTYPE html>
<html lang="en" data-theme="violet" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EduERP · Founder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="viewport">
  <div class="proto-banner" onclick="App.resetPrompt()">◆ FOUNDER PROTOTYPE · tap to reset demo data</div>
  <div id="app"></div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/auth-screens.js"></script>
<script src="../shared/founder-data.js"></script>
<script src="../shared/staff-data.js"></script>
<script>
/* FOUNDER APP — the BUY surface. "Show with reports, don't tell with text."
   Rich, visual, premium. Rajesh's 9pm health-check + the reports that sell. */
const App = {
  route:'dashboard', ctx:{},
  systemDark:window.matchMedia('(prefers-color-scheme:dark)').matches,
  loadingMs:600,
  F:FounderDB, S:StaffDB,

  init(){
    const s=this.F.settings();
    this.applyTheme(s.theme||'violet', s.mode||'system');
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{
      this.systemDark=e.matches;
      const st=this.F.settings();
      if((st.mode||'system')==='system') this.applyTheme(st.theme,'system');
    });
    if(!Auth.isLoggedIn()){ this.renderLogin(); } else { this.render(); }
  },
  renderLogin(){
    AuthScreens.Login(document.getElementById('app'),{
      app:'founder',
      title:'Founder Portal',
      subtitle:'Sign in to manage your school.',
      badge:'School Owner',
      badgeIcon:'building',
      orgCodeVisible:false,
      demoIdentifier:'rajesh@sunrise.edu',
      demoPassword:'Founder@123',
      onSuccess:(user)=>{ this.render(); UI.toast('Welcome back, '+user.name.split(' ')[0]); }
    });
  },
  confirmLogout(){
    UI.confirm({title:'Sign out?',message:'You will need to sign in again.',confirmText:'Sign out',danger:true})
      .then(ok=>{ if(ok){ Auth.logout(); this.renderLogin(); } });
  },
  applyTheme(theme,mode){ document.documentElement.dataset.theme=theme; document.documentElement.dataset.mode= mode==='system'?(this.systemDark?'dark':'light'):mode; },

  /* ---------- shell ---------- */
  render(){ document.getElementById('app').innerHTML=this.Shell(); this.mountScreen(); },
  Shell(){
    const tabs=[
      {k:'dashboard',ic:'home',label:'Home'},
      {k:'students',ic:'users',label:'Students'},
      {k:'fees',ic:'wallet',label:'Fees'},
      {k:'reports',ic:'chart',label:'Reports'},
      {k:'more',ic:'settings',label:'More'},
    ];
    const isSub=this.ctx.sub;
    return `${this.AppBar()}
      <div class="content fade-in" id="screen"></div>
      ${isSub?'':`<div class="tabbar">${tabs.map(t=>`<button class="tab ${this.route===t.k?'active':''}" onclick="App.go('${t.k}')">${icon(t.ic)}<span>${t.label}</span></button>`).join('')}</div>`}`;
  },
  AppBar(){
    if(this.ctx.sub){
      return `<div class="appbar sub">
        <button class="appbar-btn" onclick="App.back()" aria-label="Back">${icon('chevronL')}</button>
        <div class="appbar-id"><div class="appbar-title">${this.ctx.title||''}</div>${this.ctx.subtitle?`<div class="appbar-sub">${this.ctx.subtitle}</div>`:''}</div>
        ${this.ctx.action||''}
      </div>`;
    }
    const s=Auth.getSession(); const set=this.F.settings();
    const titles={dashboard:this.greeting(),students:'Students',fees:'Fees',reports:'Reports',more:'More'};
    const branchLabel=this.F.branchName(this.F.activeBranch());
    const multiBranch=this.F.branches().length>1;
    // On the dashboard, the school/branch identity IS the dropdown (variant A).
    const isDash=this.route==='dashboard';
    const idBlock = isDash
      ? `<button class="appbar-id appbar-id-btn" onclick="App.openBranchSwitcher()" ${multiBranch?'':'disabled'}>
           <div class="appbar-title">${set.schoolName}</div>
           <div class="appbar-sub">${icon('building2')} ${branchLabel}${multiBranch?icon('chevronD'):''}</div>
         </button>`
      : `<div class="appbar-id"><div class="appbar-title">${titles[this.route]||set.schoolName}</div>
           <div class="appbar-sub">${icon('mapPin')} ${branchLabel}</div></div>`;
    return `<div class="appbar">
      <div class="appbar-logo">${icon('building')}</div>
      ${idBlock}
      <button class="appbar-btn" onclick="App.notImplemented('Notifications')" aria-label="Alerts">${icon('bell')}<span class="appbar-dot"></span></button>
      <div class="appbar-avatar" style="background:${avatarColor(s.name)}" onclick="App.go('more')">${s.avatar||initials(s.name)}</div>
    </div>`;
  },
  openBranchSwitcher(){
    const branches=this.F.branches(); const active=this.F.activeBranch();
    const opts=[{id:'ALL',name:'All branches',sub:this.F.students().length+' students total'}]
      .concat(branches.map(b=>({id:b.id,name:b.name,sub:b.code})));
    const {close}=UI.sheet(`<div class="sheet-title">Switch branch</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">View one branch, or all branches combined.</p>
      ${opts.map(o=>`<div class="row" style="border:none;padding:12px 4px" onclick="App.selectBranch('${o.id}')">
        <div class="avatar avatar-sq" style="background:${o.id===active?'var(--brand)':'var(--brand-subtle)'};color:${o.id===active?'#fff':'var(--brand)'}">${icon('building2')}</div>
        <div class="row-main"><div class="row-title">${o.name}</div><div class="row-sub">${o.sub}</div></div>
        ${o.id===active?`<span style="color:var(--brand)">${icon('check')}</span>`:''}
      </div>`).join('')}
      <button class="btn btn-secondary btn-full mt-4" onclick="App._branchClose()">Done</button>`);
    this._branchClose=close;
  },
  selectBranch(id){ this.F.setActiveBranch(id); this._branchClose&&this._branchClose(); this.render(); UI.toast('Viewing: '+this.F.branchName(id)); },
  greeting(){ const h=new Date().getHours(); const g=h<12?'Good morning':h<17?'Good afternoon':'Good evening'; return g+', '+Auth.getSession().name.split(' ')[0]; },

  go(route,ctx={}){ this.route=route; this.ctx=ctx; this.render(); },
  back(){ this.ctx={}; this.route=this._backTo||'dashboard'; this.render(); },
  mountScreen(){
    const el=document.getElementById('screen');
    switch(this.route){
      case 'dashboard': return this.Dashboard(el);
      case 'students': return this.Students(el);
      case 'student': return this.StudentDetail(el);
      case 'fees': return this.Fees(el);
      case 'invoices': return this.Invoices(el);
      case 'invoice': return this.InvoiceDetail(el);
      case 'generateInvoices': return this.GenerateInvoices(el);
      case 'receipt': return this.ReceiptView(el);
      case 'reports': return this.Reports(el);
      case 'report': return this.ReportView(el);
      case 'more': return this.More(el);
      case 'staff': return this.Staff(el);
      case 'staffDetail': return this.StaffDetail(el);
      case 'addStaff': return this.AddStaff(el);
      case 'editStaff': return this.AddStaff(el);
      case 'roles': return this.Roles(el);
      case 'roleDetail': return this.RoleDetail(el);
      case 'setup': return this.Setup(el);
      case 'departments': return this.Departments(el);
      case 'branches': return this.Branches(el);
      case 'feeHeads': return this.FeeHeads(el);
      case 'feeStructures': return this.FeeStructures(el);
      case 'feeStructure': return this.FeeStructureDetail(el);
      case 'settings': return this.Settings(el);
      case 'orgProfile': return this.OrgProfile(el);
      case 'orgSettings': return this.OrgSettings(el);
      case 'notifications': return this.Notifications(el);
    }
  },
  withLoading(el,sk,build){ el.innerHTML=sk; setTimeout(()=>{ el.innerHTML=build(); if(this._after){this._after();this._after=null;} },this.loadingMs); },

  /* DASHBOARD — the 9pm health check. Visual-first. "Show, don't tell." */
  Dashboard(el){
    this._backTo='dashboard';
    this._feePeriod=this._feePeriod||'month';
    const sk=`<div class="sk" style="height:170px;border-radius:14px;margin-bottom:16px"></div>
      <div class="grid-2 mb-3">${'<div class="kpi"><div class="sk sk-line" style="width:50%"></div><div class="sk" style="height:24px;width:60%;margin-top:8px"></div></div>'.repeat(2)}</div>
      <div class="card"><div class="sk" style="height:120px"></div></div>`;
    this.withLoading(el,sk,()=>{
      const fs=this.F.feeSummary();
      if(fs.count===0){
        return `<div class="state"><div class="state-ill">${icon('sparkle')}</div><div class="state-title">Your school is set up</div><div class="state-msg">Add students and record fees to see your school's live health here.</div></div>`;
      }
      const ah=this.F.academicHealth();
      const pipe=this.F.admissionsPipeline();
      const enrol=this.F.enrolmentTrend(); const maxE=Math.max(1,...enrol.map(e=>e.count));
      const trend=this.F.collectionTrend(); const maxT=Math.max(1,...trend.map(t=>t.amount));
      const recent=this.F.recentPayments(4);
      const collectedPeriod=this.F.collectedInPeriod(this._feePeriod);
      const pct=Math.round(fs.collected/fs.billed*100);
      return `
        <!-- MONEY (period-filtered) — important, but one of several -->
        <div class="card card-raised mb-4" style="background:linear-gradient(135deg,var(--brand),var(--brand-hover));color:var(--text-on-brand);border:none">
          <div class="flex between items-center">
            <div style="font-size:var(--t-label);opacity:.9;font-weight:600">Fees collected</div>
            <div style="font-size:var(--t-caption);opacity:.85">${pct}% of term billed</div>
          </div>
          <div style="font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:-.02em;line-height:1;margin-top:4px">${fmt.money(collectedPeriod)}</div>
          <div class="period-seg">
            ${this.F.PERIODS.map(([k,l])=>`<button class="${this._feePeriod===k?'active':''}" onclick="App.setFeePeriod('${k}')">${l}</button>`).join('')}
          </div>
          <div style="font-size:var(--t-caption);opacity:.85;margin-top:10px">${fmt.money(fs.outstanding)} outstanding overall · tap Fees for the breakdown</div>
        </div>

        <!-- BALANCED HEALTH: academics · people · money-health -->
        <div class="sec-head"><div class="sec-title">School health</div><span class="t-caption">today</span></div>
        <div class="grid-2 mb-3">
          ${this.healthKpi('check','Attendance',ah.attendancePct+'%',ah.attendancePct>=90?'var(--viz-positive)':'var(--viz-warning)','present today')}
          ${this.healthKpi('trend','Pass rate',ah.passRate+'%','var(--viz-positive)','last exams')}
        </div>
        <div class="grid-2 mb-4">
          ${this.healthKpi('users','Students',this.F.students().length,'var(--info)',pipe.admitted+' admitted recently')}
          ${this.healthKpi('alert','Fee defaulters',(fs.partial+fs.unpaid),'var(--viz-negative)',fmt.moneyShort(fs.outstanding)+' due')}
        </div>

        <!-- ACADEMIC: attendance is health, shown visually -->
        <div class="card mb-4">
          <div class="flex between items-center mb-3"><div class="sec-title">Academic snapshot</div><span class="chip chip-success">Healthy</span></div>
          <div class="flex gap-3">
            ${this.miniStat('Avg. score',ah.avgScore+'%')}
            ${this.miniStat('Attendance',ah.attendancePct+'%')}
            ${this.miniStat('Top students',ah.topPerformers)}
          </div>
        </div>

        <!-- PEOPLE: admissions pipeline (growth) -->
        <div class="card mb-4">
          <div class="sec-title mb-4">Admissions pipeline</div>
          ${this.funnelRow('Enquiries',pipe.enquiries,pipe.enquiries)}
          ${this.funnelRow('Visited',pipe.visited,pipe.enquiries)}
          ${this.funnelRow('Applied',pipe.applied,pipe.enquiries)}
          ${this.funnelRow('Admitted',pipe.admitted,pipe.enquiries,true)}
        </div>

        <!-- collection trend (money over time) -->
        <div class="card card-raised mb-4">
          <div class="flex between items-center mb-4"><div class="sec-title">Collection trend</div><span class="t-caption">Last 6 months</span></div>
          <div class="chart-bars">${trend.map(t=>`<div class="bar-col"><div class="bar-val">${t.amount?fmt.moneyShort(t.amount).replace('₹',''):''}</div><div class="bar pos" style="height:${(t.amount/maxT)*100}%"></div><div class="bar-label">${t.label}</div></div>`).join('')}</div>
        </div>

        <!-- fee status donut -->
        ${this.feeStatusCard(fs)}

        <!-- activity feed -->
        <div class="sec-head"><div class="sec-title">Recent payments</div><button class="sec-link" onclick="App.go('fees')">View all</button></div>
        <div class="card card-pad-0 mb-4"><div class="list">${recent.map(p=>this.paymentRow(p)).join('')}</div></div>

        <div class="dashed-card">${icon('sparkle')} <span class="t-label" style="color:var(--text-tertiary)">AI insights arrive with Enterprise</span></div>
      `;
    });
  },
  setFeePeriod(p){ this._feePeriod=p; this.Dashboard(document.getElementById('screen')); },
  setFeePeriodFees(p){ this._feePeriod=p; this.Fees(document.getElementById('screen')); },
  healthKpi(ic,label,value,color,sub){
    return `<div class="kpi"><div class="flex items-center gap-2 mb-1"><span style="color:${color};display:grid">${icon(ic)}</span><span class="kpi-label" style="margin:0">${label}</span></div>
      <div class="kpi-value" style="font-size:22px">${value}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;
  },
  miniStat(label,value){ return `<div class="flex-1 text-center" style="padding:12px 6px;background:var(--surface-sunken);border-radius:var(--r-md)"><div class="t-data" style="font-weight:700;font-size:18px">${value}</div><div class="t-caption">${label}</div></div>`; },
  funnelRow(label,val,max,highlight){
    return `<div class="mb-2"><div class="flex between mb-1"><span class="t-label">${label}</span><span class="t-data" style="font-weight:700${highlight?';color:var(--viz-positive)':''}">${val}</span></div>
      <div style="height:8px;background:var(--surface-sunken);border-radius:99px;overflow:hidden"><div style="width:${(val/max)*100}%;height:100%;background:${highlight?'var(--viz-positive)':'var(--brand)'};border-radius:99px"></div></div></div>`;
  },
  miniKpi(ic,label,value,color,danger){
    return `<div class="kpi"><div class="flex items-center gap-2 mb-1"><span style="color:${color};display:grid">${icon(ic)}</span><span class="kpi-label" style="margin:0">${label}</span></div>
      <div class="kpi-value" style="font-size:22px;${danger?'color:var(--viz-negative)':''}">${value}</div></div>`;
  },
  feeStatusCard(fs){
    const seg=[['Paid',fs.paid,'var(--viz-positive)'],['Partial',fs.partial,'var(--viz-warning)'],['Unpaid',fs.unpaid,'var(--viz-negative)']].filter(x=>x[1]>0);
    let acc=0; const stops=seg.map(([l,v,c])=>{ const a=acc/fs.count*360; acc+=v; return `${c} ${a}deg ${acc/fs.count*360}deg`; }).join(',');
    return `<div class="card mb-4">
      <div class="sec-title mb-4">Fee status</div>
      <div class="flex gap-4 items-center">
        <div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><div><div class="t-data-lg">${fs.count}</div><div class="t-caption">invoices</div></div></div></div>
        <div class="donut-legend">${seg.map(([l,v,c])=>`<div class="legend-item"><span class="legend-dot" style="background:${c}"></span><span class="flex-1">${l}</span><span class="t-data" style="font-weight:700">${v}</span></div>`).join('')}</div>
      </div></div>`;
  },
  paymentRow(p){
    return `<div class="row" style="cursor:default">
      <div class="avatar" style="background:${avatarColor(p.studentName)}">${initials(p.studentName)}</div>
      <div class="row-main"><div class="row-title">${p.studentName}</div><div class="row-sub">${p.mode} · ${fmt.ago(p.at)}</div></div>
      <div class="row-trail"><span class="t-data" style="font-weight:700;color:var(--viz-positive)">+${fmt.money(p.amount)}</span></div>
    </div>`;
  },

  /* STUDENTS — SIS list + detail (4 lazy tabs) */
  Students(el){
    this._backTo='dashboard'; this._stuSearch=this._stuSearch||''; this._stuFilter=this._stuFilter||'all';
    const sk=`<div class="sk" style="height:48px;margin-bottom:16px"></div>${'<div class="sk-row"><div class="sk sk-circle"></div><div style="flex:1"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:40%"></div></div></div>'.repeat(6)}`;
    this.withLoading(el,sk,()=>this.studentsMarkup());
  },
  studentsMarkup(){
    const all=this.F.students();
    if(all.length===0) return `<div class="state"><div class="state-ill">${icon('users')}</div><div class="state-title">No students yet</div><div class="state-msg">Students appear here once admitted. Add them from Setup or the Staff app.</div></div>`;
    const q=(this._stuSearch||'').toLowerCase(); const f=this._stuFilter||'all';
    const sections=[...new Set(all.map(s=>s.section))];
    let list=all.filter(s=>{
      const mq=!q||s.name.toLowerCase().includes(q)||s.section.toLowerCase().includes(q)||s.admissionNo.toLowerCase().includes(q);
      const mf=f==='all'||s.section===f;
      return mq&&mf;
    });
    return `
      <div class="input-affix mb-3"><span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('search')}</span>
        <input class="input" style="padding-left:42px" placeholder="Search name, section, admission no…" value="${this._stuSearch||''}" oninput="App.searchStu(this.value)"></div>
      <div class="filter-row">
        <button class="filter-chip ${f==='all'?'active':''}" onclick="App.filterStu('all')">All ${all.length}</button>
        ${sections.map(sec=>`<button class="filter-chip ${f===sec?'active':''}" onclick="App.filterStu('${sec}')">${sec}</button>`).join('')}
      </div>
      ${list.length===0?`<div class="state" style="min-height:36vh"><div class="state-ill">${icon('search')}</div><div class="state-title">No matches</div><div class="state-msg">Try a different search or section.</div></div>`
        :`<div class="card card-pad-0"><div class="list">${list.map(s=>this.studentRow(s)).join('')}</div></div><p class="t-caption text-center mt-3">${list.length} of ${all.length} students</p>`}
    `;
  },
  studentRow(s){
    const inv=this.F.invoiceForStudent(s.id);
    const chip=inv.status==='Paid'?'chip-success':inv.status==='Partial'?'chip-warning':'chip-danger';
    return `<div class="row" onclick="App.openStudent('${s.id}')">
      <div class="avatar" style="background:${avatarColor(s.name)}">${initials(s.name)}</div>
      <div class="row-main"><div class="row-title">${s.name}</div><div class="row-sub">${s.section} · Roll ${s.roll}</div></div>
      <div class="row-trail"><span class="chip ${chip}">${inv.status}</span></div>
      <span class="row-chev">${icon('chevronR')}</span>
    </div>`;
  },
  searchStu(v){ this._stuSearch=v; const el=document.getElementById('screen'); const sc=el.scrollTop; el.innerHTML=this.studentsMarkup(); el.scrollTop=sc; const i=el.querySelector('input'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} },
  filterStu(f){ this._stuFilter=f; document.getElementById('screen').innerHTML=this.studentsMarkup(); },

  openStudent(id){ this.go('student',{sub:true,id,tab:'profile',title:'',_back:'students'}); },
  StudentDetail(el){
    const s=this.F.studentById(this.ctx.id);
    if(!s){ el.innerHTML='<div class="state"><div class="state-title">Not found</div></div>'; return; }
    this._backTo='students';
    this.ctx.title=s.name||s.full_name; this.ctx.subtitle=`${s.section} · ${s.admissionNo}`;
    this.ctx.action=`<button class="appbar-btn" onclick="App.editStudent('${s.id}')" aria-label="Edit">${icon('edit')}</button>`;
    document.querySelector('.appbar')?.remove();
    document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const tab=this.ctx.tab||'profile';
    el.innerHTML=`
      <div class="card card-raised mb-4 flex gap-3 items-center">
        <div class="avatar" style="width:56px;height:56px;font-size:18px;background:${avatarColor(s.name)}">${initials(s.name)}</div>
        <div class="flex-1">
          <div class="t-h2" style="line-height:1.2">${s.name}</div>
          <div class="row-sub mt-1">${s.gender||'—'} · ${s.section} · Roll ${s.roll}</div>
          <div class="flex gap-2 mt-2">
            <span class="chip ${s.lifecycle_status==='active'?'chip-success':'chip-neutral'}"><span class="chip-dot"></span>${s.lifecycle_status||'active'}</span>
            ${s.blood_group?`<span class="chip chip-neutral">${s.blood_group}</span>`:''}
          </div>
        </div>
      </div>
      <div class="tabs mb-4">
        ${[['profile','Profile'],['guardians','Guardians'],['attendance','Attendance'],['history','History'],['fees','Fees']].map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="App.stuTab('${k}')">${l}</button>`).join('')}
      </div>
      <div id="stuTab"></div>`;
    this.renderStuTab(s,tab);
  },
  stuTab(t){ this.ctx.tab=t; document.querySelectorAll('#screen .tabs button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().startsWith(t.slice(0,3)))); this.renderStuTab(this.F.studentById(this.ctx.id),t); },
  renderStuTab(s,t){
    const box=document.getElementById('stuTab'); if(!box)return;
    box.innerHTML=`<div class="sk" style="height:120px"></div>`;
    setTimeout(()=>{
      if(!document.getElementById('stuTab')) return; // navigated away

      if(t==='profile'){
        /* Profile — mirrors StudentOut fields */
        box.innerHTML=`<div class="card mb-3"><div class="dl">
          <div class="dl-row"><span class="dl-key">Admission no.</span><span class="dl-val t-code">${s.admissionNo}</span></div>
          <div class="dl-row"><span class="dl-key">Section</span><span class="dl-val">${s.section}</span></div>
          <div class="dl-row"><span class="dl-key">Roll number</span><span class="dl-val">${s.roll}</span></div>
          <div class="dl-row"><span class="dl-key">Date of birth</span><span class="dl-val">${s.dob||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Gender</span><span class="dl-val">${s.gender||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Blood group</span><span class="dl-val">${s.blood_group||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Residency type</span><span class="dl-val">${(s.residency_type||'day_scholar').replace('_',' ')}</span></div>

        const att=this.F.studentAttendanceSummary(s.id);

          box.innerHTML=`<div class="state" style="min-height:30vh"><div class="state-ill">${icon('check')}</div><div class="state-title">No attendance marked yet</div><div class="state-msg">Attendance for this student will appear here after a teacher marks it in the Staff app.</div></div>`;
        } else {
          const bars=[
            ['Present','P',att.present_count,'var(--viz-positive)'],
            ['Absent','A',att.absent_count,'var(--viz-negative)'],
            ['Late','Lt',att.late_count,'var(--viz-warning)'],
            ['Half-day','H',att.half_day_count,'var(--info)'],
            ['Excused','E',att.excused_count,'var(--text-tertiary)'],
          ].filter(b=>b[2]>0);

            <div class="card card-raised mb-4 text-center">
              <div style="font-size:42px;font-weight:800;color:${att.percentage>=75?'var(--viz-positive)':att.percentage>=60?'var(--viz-warning)':'var(--viz-negative)'}">${att.percentage}%</div>
              <div class="t-caption">attendance · ${att.total_count} day(s) marked</div>

                  <span class="dl-val" style="min-width:20px;text-align:right">${count}</span>
                </div></div>`).join('')}
            </div></div>`;
        }

      } else if(t==='history'){
        /* Enrollment history — mirrors EnrollmentHistoryOut */
        const hist=this.F.enrollmentHistory(s.id);
        if(hist.length===0){
          box.innerHTML=`<div class="state" style="min-height:30vh"><div class="state-ill">${icon('clock')}</div><div class="state-title">No history yet</div><div class="state-msg">Enrollment history appears here after the first academic session closes.</div></div>`;
        } else {
          box.innerHTML=`<div class="card card-pad-0"><div class="list">${hist.map((h,i)=>`
            <div class="row" style="cursor:default">

              <div class="row-main">
                <div class="row-title">${h.session_label||h.academic_session_public_id}</div>
                <div class="row-sub">Section ${h.section_name||h.section_public_id} · Roll ${h.roll_number||'—'}</div>
              </div>
              <span class="chip ${h.enrollment_status==='active'?'chip-success':'chip-neutral'}">${h.enrollment_status}</span>
            </div>`).join('')}</div></div>`;
        }

      } else if(t==='fees'){
        const inv=this.F.invoiceForStudent(s.id); const pays=this.F.paymentsForStudent(s.id);
        box.innerHTML=`
          <div class="card mb-3">
            <div class="flex between items-center mb-3"><span class="t-h3">Invoice ${inv.id}</span><span class="chip ${inv.status==='Paid'?'chip-success':inv.status==='Partial'?'chip-warning':'chip-danger'}">${inv.status}</span></div>
            <div class="dl">${inv.items.map(it=>`<div class="dl-row"><span class="dl-key">${it.type}</span><span class="dl-val t-data">${fmt.money(it.amount)}</span></div>`).join('')}
              <div class="dl-row" style="border-top:2px solid var(--border-strong)"><span class="dl-key" style="font-weight:700;color:var(--text-primary)">Total billed</span><span class="dl-val t-data">${fmt.money(inv.total)}</span></div>
              <div class="dl-row"><span class="dl-key">Paid</span><span class="dl-val t-data" style="color:var(--viz-positive)">${fmt.money(inv.paid)}</span></div>
              ${inv.total-inv.paid>0?`<div class="dl-row"><span class="dl-key">Outstanding</span><span class="dl-val t-data" style="color:var(--viz-negative)">${fmt.money(inv.total-inv.paid)}</span></div>`:''}
            </div>
          </div>
          ${s.concession>0?`<div class="dashed-card mb-3" style="border-color:var(--viz-positive);color:var(--viz-positive)">${icon('check')} ${Math.round(s.concession*100)}% concession applied on tuition</div>`:''}
          ${pays.length?`<div class="sec-head"><div class="sec-title">Payments</div></div><div class="card card-pad-0"><div class="list">${pays.map(pay=>`<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:var(--success-subtle);color:var(--success)">${icon('wallet')}</div><div class="row-main"><div class="row-title">${fmt.money(pay.amount)}</div><div class="row-sub">${pay.mode} · ${fmt.date(pay.at)} · ${pay.id}</div></div></div>`).join('')}</div></div>`:'<div class="dashed-card">No payments recorded yet</div>'}
        `;
      }
    },300);
  },

  /* ---- Edit student (StudentUpdate fields) ---- */

    const {close}=UI.sheet(`
      <div class="sheet-title">Edit student</div>
      <div class="field"><label class="field-label">Full name</label>
        <input class="input" id="stu-name" value="${s.name||''}"></div>
      <div class="field"><label class="field-label">Gender</label>
        <select class="select" id="stu-gender">

          ${['Male','Female','Other'].map(g=>`<option ${(s.gender||'')==g?'selected':''}>${g}</option>`).join('')}

      <div class="field"><label class="field-label">Blood group</label>
        <select class="select" id="stu-blood">
          <option value="">— Select —</option>
          ${['A+','A-','B+','B-','O+','O-','AB+','AB-'].map(bg=>`<option ${(s.blood_group||'')==bg?'selected':''}>${bg}</option>`).join('')}
        </select></div>
      <div class="field"><label class="field-label">Lifecycle status</label>
        <select class="select" id="stu-status">
          ${['active','on_leave','transferred','withdrawn','graduated'].map(st=>`<option ${(s.lifecycle_status||'active')==st?'selected':''} value="${st}">${st.replace('_',' ')}</option>`).join('')}

  _saveStudentEdit(id){
    const patch={
      full_name:document.getElementById('stu-name').value.trim()||undefined,
      gender:document.getElementById('stu-gender').value||undefined,
      blood_group:document.getElementById('stu-blood').value||undefined,
      lifecycle_status:document.getElementById('stu-status').value||undefined,
    };
    this.F.updateStudent(id,patch);
    this._stuEditClose&&this._stuEditClose();
    this.StudentDetail(document.getElementById('screen'));
    UI.toast('Student updated');
  },

  /* ---- Add guardian (GuardianCreate fields) ---- */
  addGuardianSheet(studentId){
    const {close}=UI.sheet(`
      <div class="sheet-title">Add guardian</div>
      <div class="field"><label class="field-label">Full name <span class="req">*</span></label>
        <input class="input" id="grd-name" placeholder="e.g. Ramesh Kumar"></div>
      <div class="field"><label class="field-label">Relationship <span class="req">*</span></label>
        <select class="select" id="grd-rel">
          <option value="">— Select —</option>
          ${['father','mother','guardian','other'].map(r=>`<option value="${r}">${r[0].toUpperCase()+r.slice(1)}</option>`).join('')}
        </select></div>
      <div class="field"><label class="field-label">Phone number <span class="req">*</span></label>
        <input class="input" id="grd-phone" type="tel" placeholder="+91 98765 43210"></div>
      <div class="field"><label class="field-label">Email</label>
        <input class="input" id="grd-email" type="email" placeholder="optional"></div>
      <div class="field"><label class="field-label">Occupation</label>
        <input class="input" id="grd-occ" placeholder="e.g. Engineer"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center">
        <input type="checkbox" id="grd-primary" style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="grd-primary" class="field-label" style="margin:0">Set as primary contact</label>
      </div>
      <div id="grd-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveGuardian('${studentId}')">Add guardian</button>
    `);

  },
  _saveGuardian(studentId){
    const name=document.getElementById('grd-name').value.trim();
    const rel=document.getElementById('grd-rel').value;
    const phone=document.getElementById('grd-phone').value.trim();
    const err=document.getElementById('grd-err');
    if(!name||!rel||!phone){
      err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name, relationship, and phone are required.</div>`; return;
    }
    this.F.addGuardian(studentId,{
      full_name:name, relationship_type:rel, phone_number:phone,
      email:document.getElementById('grd-email').value.trim()||null,
      occupation:document.getElementById('grd-occ').value.trim()||null,
      is_primary_contact:document.getElementById('grd-primary').checked
    });
    this._grdClose&&this._grdClose();
    this.ctx.tab='guardians';
    this.StudentDetail(document.getElementById('screen'));
    UI.toast('Guardian added');
  },
  removeGuardian(studentId,guardianId){
    UI.confirm({title:'Remove guardian?',message:'This guardian will be removed from the student\'s record.',confirmText:'Remove',danger:true}).then(ok=>{
      if(!ok)return;
      this.F.removeGuardian(studentId,guardianId);
      this.ctx.tab='guardians';
      this.StudentDetail(document.getElementById('screen'));
      UI.toast('Guardian removed');
    });
  },

  /* INVOICES LIST  (mirrors GET /fees/invoices?status=&student=)
     InvoiceOut: invoice_number, total_amount, net_payable_amount, status, issued_date */
  Invoices(el){
    this._backTo='fees'; this.ctx.sub=true; this.ctx.title='Invoices'; this.ctx.subtitle='';
    this.ctx.action=`<button class="appbar-btn" onclick="App.go('generateInvoices')" aria-label="Generate">${icon('plus')}</button>`;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    this._invFilter=this._invFilter||'all'; this._invSearch=this._invSearch||'';
    el.innerHTML=this._invoicesMarkup();
  },
  _invoicesMarkup(){
    const all=this.F.invoices();
    const f=this._invFilter||'all'; const q=(this._invSearch||'').toLowerCase();
    let list=all.filter(inv=>{
      const ms=f==='all'||(inv.status||'').toLowerCase()===f.toLowerCase();
      const mq=!q||inv.studentName.toLowerCase().includes(q)||(inv.invoice_number||'').toLowerCase().includes(q)||(inv.section||'').toLowerCase().includes(q);
      return ms&&mq;
    });
    // status summary for the filter row
    const summ=this.F.invoiceStatusSummary();
    const filters=[{k:'all',l:`All (${all.length})`},...summ.map(s=>({k:s.status.toLowerCase(),l:`${s.status} (${s.count})`}))];
    return `
      <div class="input-affix mb-3">
        <span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('search')}</span>
        <input class="input" style="padding-left:42px" placeholder="Search student, invoice no, section…"
          value="${this._invSearch||''}" oninput="App._invSearch=this.value;document.getElementById('screen').innerHTML=App._invoicesMarkup();" id="inv-search">
      </div>
      <div class="filter-row mb-3">
        ${filters.map(({k,l})=>`<button class="filter-chip ${(this._invFilter||'all')===k?'active':''}" onclick="App._invFilter='${k}';document.getElementById('screen').innerHTML=App._invoicesMarkup()">${l}</button>`).join('')}
      </div>
      ${list.length===0
        ? `<div class="state" style="min-height:36vh"><div class="state-ill">${icon('search')}</div><div class="state-title">No invoices match</div><div class="state-msg">Try clearing the filter or search.</div><button class="btn btn-secondary mt-2" onclick="App._invFilter='all';App._invSearch='';document.getElementById('screen').innerHTML=App._invoicesMarkup()">Clear</button></div>`
        : `<div class="card card-pad-0"><div class="list">${list.map(inv=>this._invoiceRow(inv)).join('')}</div></div>
           <p class="t-caption text-center mt-3">${list.length} of ${all.length} invoices</p>`
      }`;
  },
  _invoiceRow(inv){
    const chip=inv.status==='Paid'?'chip-success':inv.status==='Partial'?'chip-warning':'chip-danger';
    const bal=inv.total-(inv.paid||0);
    return `<div class="row" onclick="App.go('invoice',{sub:true,id:'${inv.public_id}'})">
      <div class="avatar" style="background:${avatarColor(inv.studentName)}">${initials(inv.studentName)}</div>
      <div class="row-main">
        <div class="row-title">${inv.studentName}</div>
        <div class="row-sub">${inv.section} · ${inv.invoice_number||inv.id}</div>
      </div>
      <div class="row-trail">
        <span class="chip ${chip}">${inv.status}</span>
        ${bal>0?`<div class="t-caption" style="text-align:right;margin-top:2px;color:var(--viz-negative)">${fmt.moneyShort(bal)} due</div>`:''}
      </div>
      <span class="row-chev">${icon('chevronR')}</span></div>`;
  },

  /* GENERATE INVOICES  (mirrors POST /fees/invoices/generate)
     GenerateInvoicesRequest: structure_public_id, target, installments[] */
  GenerateInvoices(el){
    this._backTo='fees'; this.ctx.sub=true; this.ctx.title='Generate invoices'; this.ctx.subtitle='Batch create from a structure';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const structs=this.F.feeStructures().filter(s=>s.is_active);
    if(structs.length===0){
      el.innerHTML=`<div class="state"><div class="state-ill">${icon('chart')}</div>
        <div class="state-title">No active fee structures</div>
        <div class="state-msg">Create and activate a fee structure first, then generate invoices from it.</div>
        <button class="btn btn-primary mt-2" onclick="App.go('feeStructures')">${icon('plus')} Manage structures</button></div>`;
      return;
    }
    // init draft
    this._genDraft=this._genDraft||{structId:structs[0].public_id,target:'all',installmentCount:1};
    const d=this._genDraft;
    const struct=this.F.feeStructureById(d.structId);
    const yr=new Date().getFullYear();
    el.innerHTML=`
      <p class="text-secondary mb-4">Invoices are created immediately for the selected target students. Duplicates are skipped.</p>

      <div class="field"><label class="field-label">Fee structure <span class="req">*</span></label>
        <select class="select" id="gen-struct" onchange="App._genDraft.structId=this.value;App._refreshGenPreview()">
          ${structs.map(s=>`<option value="${s.public_id}" ${d.structId===s.public_id?'selected':''}>${s.structure_name} — ${fmt.money(parseFloat(s.total_amount))}</option>`).join('')}
        </select></div>

      <div id="gen-preview" class="card mb-4" style="background:var(--brand-subtle);border-color:transparent">
        ${this._genPreviewMarkup(struct)}
      </div>

      <div class="field"><label class="field-label">Target <span class="req">*</span></label>
        <select class="select" id="gen-target" onchange="App._genDraft.target=this.value">
          <option value="all" ${d.target==='all'?'selected':''}>All students (${this.F.students().length} students)</option>
          ${(this.S.academic().classLevels||[]).map(c=>`<option value="cl-${c.id}" ${d.target==='cl-'+c.id?'selected':''}>${c.name}</option>`).join('')}
        </select>
        <div class="field-hint">Select all students or filter to a specific class level.</div></div>

      <div class="field"><label class="field-label">Installment plan</label>
        <select class="select" id="gen-inst" onchange="App._genDraft.installmentCount=parseInt(this.value)">
          <option value="1" ${d.installmentCount===1?'selected':''}>Single payment — due ${yr}-07-01</option>
          <option value="2" ${d.installmentCount===2?'selected':''}>2 instalments — Q1 &amp; Q3</option>
          <option value="4" ${d.installmentCount===4?'selected':''}>4 instalments — quarterly</option>
        </select>
        <div class="field-hint">Each instalment splits the total by equal fractions.</div></div>

      <div id="gen-err"></div>
      <button class="btn btn-primary btn-full btn-lg" onclick="App._submitGenerateInvoices()">${icon('check')} Generate invoices</button>
    `;
  },
  _genPreviewMarkup(struct){
    if(!struct) return `<div class="t-caption">Select a structure above</div>`;
    return `<div class="t-label" style="font-weight:700;color:var(--brand)">${struct.structure_name}</div>
      <div class="t-caption">${struct.head_lines.length} fee heads · Total ${fmt.money(parseFloat(struct.total_amount))}</div>
      <div class="flex gap-2 mt-2" style="flex-wrap:wrap">${struct.head_lines.map(l=>`<span class="chip chip-neutral" style="font-size:10px">${l.fee_head_name} ${fmt.moneyShort(parseFloat(l.amount))}</span>`).join('')}</div>`;
  },
  _refreshGenPreview(){
    const struct=this.F.feeStructureById(this._genDraft.structId);
    const el=document.getElementById('gen-preview'); if(el) el.innerHTML=this._genPreviewMarkup(struct);
  },
  _submitGenerateInvoices(){
    const d=this._genDraft;
    const err=document.getElementById('gen-err');
    if(!d.structId){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Select a fee structure.</div>`; return; }
    // build InstallmentPlanEntry[] from the selected plan
    const yr=new Date().getFullYear();
    const plans={
      1:[{number:1,due_date:`${yr}-07-01`,fraction:1}],
      2:[{number:1,due_date:`${yr}-07-01`,fraction:0.5},{number:2,due_date:`${yr}-10-01`,fraction:0.5}],
      4:[{number:1,due_date:`${yr}-07-01`,fraction:0.25},{number:2,due_date:`${yr}-09-01`,fraction:0.25},{number:3,due_date:`${yr}-11-01`,fraction:0.25},{number:4,due_date:`${yr+1}-01-01`,fraction:0.25}],
    };
    const installments=plans[d.installmentCount]||plans[1];
    // build InvoiceGenerationTarget
    let target={};
    if(d.target!=='all' && d.target.startsWith('cl-')) target={class_level_public_id:d.target.replace('cl-','')};
    const result=this.F.generateInvoices({structure_public_id:d.structId,target,installments});
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._genDraft=null;
    UI.toast(`${result.created} invoice(s) generated · ${result.total_targeted-result.created} already existed`);
    this.go('invoices');
  },

  /* ---- STAFF DIRECTORY — real RBAC data, shared with the Staff app (StaffDB) ---- */
  Staff(el){

    this.ctx.action=`<button class="appbar-btn" onclick="App.go('addStaff')" aria-label="Add staff">${icon('userPlus')}</button>`;

  _staffListMarkup(){

      ${list.length===0?`<div class="state" style="min-height:30vh"><div class="state-ill">${icon('search')}</div><div class="state-title">No staff found</div></div>`
      : Object.keys(byDept).sort().map(dept=>`<div class="sec-head"><div class="sec-title">${dept}</div><span class="t-caption">${byDept[dept].length}</span></div>
        <div class="card card-pad-0 mb-3"><div class="list">${byDept[dept].map(u=>this.staffRow(u)).join('')}</div></div>`).join('')}

  searchStaff(v){ this._staffSearch=v; const el=document.getElementById('screen'); const sc=el.scrollTop; el.innerHTML=this._staffListMarkup(); el.scrollTop=sc; const i=el.querySelector('input'); if(i){i.focus();i.setSelectionRange(v.length,v.length);} },
  staffRow(u){

    return `<div class="row" onclick="App.go('staffDetail',{sub:true,id:'${u.id}'})">
      <div class="avatar" style="background:${avatarColor(u.name)}">${u.avatar}</div>
      <div class="row-main"><div class="row-title">${u.name}</div><div class="row-sub">${u.designation}${r?' · '+r.name:''}</div></div>
      <span class="row-chev">${icon('chevronR')}</span></div>`;
  },
  StaffDetail(el){
    const u=this.S.staffUserById(this.ctx.id); if(!u){ el.innerHTML='<div class="state"><div class="state-title">Not found</div></div>'; return; }
    this._backTo='staff';
    const r=this.S.roleById(u.roleId); const mgr=u.reportsToId?this.S.staffUserById(u.reportsToId):null;
    this.ctx.title=u.name; this.ctx.subtitle=u.designation;
    this.ctx.action=`<button class="appbar-btn" onclick="App.go('editStaff',{sub:true,id:'${u.id}',edit:true})" aria-label="Edit">${icon('edit')}</button>`;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    el.innerHTML=`
      <div class="card card-raised mb-4 flex gap-3 items-center">
        <div class="avatar" style="width:56px;height:56px;font-size:18px;background:${avatarColor(u.name)}">${u.avatar}</div>
        <div class="flex-1"><div class="t-h3">${u.name}</div><div class="row-sub">${u.designation} · ${u.department||'—'}</div></div>
      </div>
      <div class="card mb-4"><div class="dl">
        <div class="dl-row"><span class="dl-key">Login email</span><span class="dl-val">${u.email}</span></div>
        <div class="dl-row"><span class="dl-key">Login status</span><span class="dl-val">${u.passwordSet?`<span class="chip chip-success">Active</span>`:`<span class="chip chip-warning">Password not set</span>`}</span></div>
        <div class="dl-row"><span class="dl-key">Department</span><span class="dl-val">${u.department||'—'}</span></div>
        <div class="dl-row"><span class="dl-key">Reports to</span><span class="dl-val">${mgr?mgr.name:'—'}</span></div>
        ${u.section?`<div class="dl-row"><span class="dl-key">Class section</span><span class="dl-val">${u.section}</span></div>`:''}
      </div></div>
      <div class="sec-head"><div class="sec-title">Role & access</div><button class="sec-link" onclick="App.openRole('${r?r.id:''}')">View role</button></div>
      <div class="card mb-4">
        <div class="flex between items-center mb-3"><div class="row-title">${r?r.name:'—'}</div><span class="chip chip-brand">${r?r.perms.length:0} permissions</span></div>
        <div class="flex gap-2" style="flex-wrap:wrap">${r?this._permChips(r.perms):''}</div>
      </div>
      <button class="btn btn-secondary btn-full" onclick="App.go('editStaff',{sub:true,id:'${u.id}',edit:true})">${icon('edit')} Edit staff</button>`;

  _permChips(perms){
    const byMod={}; perms.forEach(p=>{ const m=this.S.moduleOf(p); byMod[m]=(byMod[m]||0)+1; });
    return Object.entries(byMod).map(([m,n])=>`<span class="chip chip-neutral">${m} ${n}</span>`).join('');
  },

  /* ---- ADD / EDIT STAFF — mirrors staff/index.html for parity, adapted to Founder's shell.
     Founder is the account owner: always authorized, no permission gate needed. ---- */
  AddStaff(el){
    const editing=!!this.ctx.edit; const existing=editing?this.S.staffUserById(this.ctx.id):null;
    this._backTo=editing?'staffDetail':'staff';
    this._staffDraft = existing ? {
      name:existing.name,email:existing.email,password:existing.passwordSet?'••••••••':'',
      designation:existing.designation,department:existing.department||'',
      reportsToId:existing.reportsToId||'',roleId:existing.roleId,section:existing.section||''
    } : { name:'',email:'',password:'',designation:'',department:'',reportsToId:'',roleId:this.S.roleByCode('TEACHER').id,section:'' };
    const role=this.S.roleById(this._staffDraft.roleId);
    this._permDraft = new Set(role?role.perms:[]);
    this._permCustomised=false;
    this.ctx.sub=true; this.ctx.title=editing?'Edit staff':'Add staff';
    this.ctx.subtitle=editing?'Update details & access':'Creates a real login — only you can do this';
    this.ctx.action='';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    el.innerHTML=this._addStaffMarkup(editing);
  },
  _addStaffMarkup(editing){
    const d=this._staffDraft;
    const depts=this.F.departmentNames().length>0 ? this.F.departmentNames() : ['Academics','Administration','Finance','Science Lab','Sports'];
    const managers=this.S.staffUsers().filter(u=>!editing||u.id!==this.ctx.id);
    const roles=this.S.roles();
    return `
      <div class="field"><label class="field-label">Full name <span class="req">*</span></label>
        <input class="input" id="st-name" placeholder="e.g. Priya Sharma" value="${d.name}" oninput="App._staffField('name',this.value)"></div>
      <div class="field"><label class="field-label">Login email <span class="req">*</span></label>
        <div class="input-affix"><span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('mail')}</span>
        <input class="input" style="padding-left:42px" id="st-email" type="email" inputmode="email" placeholder="name@school.edu" value="${d.email}" oninput="App._staffField('email',this.value)"></div></div>
      <div class="field"><label class="field-label">${editing?'Reset login password':'Set login password'} ${editing?'':'<span class="req">*</span>'}</label>
        <div class="input-affix"><span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('lock')}</span>
        <input class="input" style="padding-left:42px" id="st-pass" type="text" placeholder="${editing?'Leave blank to keep current':'Temporary password'}" value="${editing?'':d.password}" oninput="App._staffField('password',this.value)"></div>
        <div class="field-hint">They'll be asked to change it on first login.</div></div>
      <div class="field"><label class="field-label">Designation <span class="req">*</span></label>
        <input class="input" id="st-desig" placeholder="e.g. Class Teacher, Librarian" value="${d.designation}" oninput="App._staffField('designation',this.value)"></div>
      <div class="field"><label class="field-label">Department</label>
        <select class="select" id="st-dept" onchange="App._staffField('department',this.value)">
          <option value="">Select department</option>
          ${depts.map(x=>`<option ${d.department===x?'selected':''}>${x}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">Reports to</label>
        <select class="select" id="st-mgr" onchange="App._staffField('reportsToId',this.value)">
          <option value="">— None (top level) —</option>
          ${managers.map(u=>`<option value="${u.id}" ${d.reportsToId===u.id?'selected':''}>${u.name} · ${u.designation}</option>`).join('')}</select></div>

      <div class="sec-head"><div class="sec-title">Role &amp; permissions</div></div>
      <p class="t-caption mb-3">Pick a role to pre-fill its permissions, then fine-tune below if this person needs something different.</p>
      <div class="field"><label class="field-label">Role <span class="req">*</span></label>
        <select class="select" id="st-role" onchange="App.pickStaffRole(this.value)">
          ${roles.map(r=>`<option value="${r.id}" ${d.roleId===r.id?'selected':''}>${r.name}${r.system?'':' (custom)'}</option>`).join('')}</select>
        <div class="field-hint" id="role-hint">${this._roleHint()}</div></div>

      <div id="perm-picker">${this._permPickerMarkup()}</div>

      <div id="st-err"></div>
      <div class="wiz-footer"><button class="btn btn-primary btn-full btn-lg" onclick="App.saveStaff(${editing})">${icon('check')} ${editing?'Save changes':'Create staff & login'}</button></div>`;
  },
  _roleHint(){ const r=this.S.roleById(this._staffDraft.roleId); return r?`${r.name}: ${r.desc}`:''; },
  _staffField(k,v){ this._staffDraft[k]=v; },
  pickStaffRole(roleId){
    this._staffDraft.roleId=roleId;
    const r=this.S.roleById(roleId);
    this._permDraft = new Set(r?r.perms:[]);
    this._permCustomised=false;
    document.getElementById('role-hint').textContent=this._roleHint();
    document.getElementById('perm-picker').innerHTML=this._permPickerMarkup();
  },
  _permPickerMarkup(){
    const total=this.S.allPerms().length; const on=this._permDraft.size;
    this._permOpenModules=this._permOpenModules||new Set();
    return `
      <div class="card mb-2 flex between items-center" style="background:var(--brand-subtle);border-color:transparent">
        <div><div class="t-label" style="font-weight:700;color:var(--brand)">${on} of ${total} permissions</div>
          <div class="t-caption">${this._permCustomised?'Customised for this person':'Matches the '+(this.S.roleById(this._staffDraft.roleId)||{}).name+' role'}</div></div>
        ${this._permCustomised?`<button class="btn btn-secondary btn-sm" onclick="App.resetPerms()">Reset to role</button>`:''}
      </div>
      ${this.S.CATALOG.map(m=>{
        const open=this._permOpenModules.has(m.module);
        const modOn=m.perms.filter(p=>this._permDraft.has(p[0])).length;
        return `<div class="card card-pad-0 mb-2">
          <div class="row" onclick="App.togglePermModule('${m.module}')" style="cursor:pointer">
            <div class="avatar avatar-sq" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon(m.icon)}</div>
            <div class="row-main"><div class="row-title" style="font-weight:600">${m.label}</div><div class="row-sub">${modOn} of ${m.perms.length} selected</div></div>
            <span style="transform:rotate(${open?180:0}deg);transition:transform .2s;color:var(--text-tertiary)">${icon('chevronD')}</span>
          </div>
          ${open?`<div style="padding:4px 12px 12px">${m.perms.map(p=>{
            const checked=this._permDraft.has(p[0]);
            return `<div class="perm-check ${checked?'on':''}" onclick="App.togglePerm('${p[0]}')">
              <div class="perm-box">${checked?icon('check'):''}</div>
              <div class="flex-1"><div class="t-label" style="font-weight:500">${p[1]}</div><div class="t-code" style="font-size:11px;color:var(--text-tertiary)">${p[0]}</div></div>
            </div>`; }).join('')}</div>`:''}
        </div>`; }).join('')}`;
  },
  togglePermModule(mod){ if(this._permOpenModules.has(mod))this._permOpenModules.delete(mod); else this._permOpenModules.add(mod); document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  togglePerm(code){ if(this._permDraft.has(code))this._permDraft.delete(code); else this._permDraft.add(code); this._permCustomised=true; document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  resetPerms(){ const r=this.S.roleById(this._staffDraft.roleId); this._permDraft=new Set(r?r.perms:[]); this._permCustomised=false; document.getElementById('perm-picker').innerHTML=this._permPickerMarkup(); },
  saveStaff(editing){
    const d=this._staffDraft; const err=document.getElementById('st-err');
    const emailOk=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email);
    if(!d.name.trim()||!d.email.trim()||!d.designation.trim()){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name, login email and designation are required.</div>`; return; }
    if(!emailOk){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Enter a valid login email.</div>`; return; }
    if(!editing && !d.password.trim()){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Set a login password for the new staff member.</div>`; return; }
    let roleId=d.roleId;
    if(this._permCustomised){
      const base=this.S.roleById(d.roleId);
      const custom=this.S.addRole({name:d.name.split(' ')[0]+' — custom',desc:'Custom access based on '+(base?base.name:'a role'),perms:[...this._permDraft]});
      roleId=custom.id;
    }
    if(editing){
      const patch={name:d.name,email:d.email,designation:d.designation,department:d.department,reportsToId:d.reportsToId||null,roleId};
      if(d.password && d.password!=='••••••••'){ patch.password=d.password; patch.passwordSet=true; }
      this.S.updateStaff(this.ctx.id,patch);
      UI.toast('Staff updated');
      this.go('staffDetail',{sub:true,id:this.ctx.id});
    }else{
      const u=this.S.addStaff({name:d.name,email:d.email,password:d.password,designation:d.designation,department:d.department,reportsToId:d.reportsToId||null,roleId,section:d.section||null});
      UI.toast(`${u.name} added — login created for ${u.email}`);
      this.go('staff');
    }
  },

          <div class="row-main"><div class="row-title" style="font-weight:600">${m.label}</div><div class="row-sub">${granted.map(p=>p[1]).join(' · ')}</div></div>

  },
  setupRow(ic,label,val){ return `<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon(ic)}</div><div class="row-main"><div class="row-title" style="font-weight:500">${label}</div><div class="row-sub">${val}</div></div></div>`; },
  feeTypeRow(name,detail){ return `<div class="row" style="cursor:default"><div class="avatar avatar-sq" style="background:var(--success-subtle);color:var(--success)">${icon('wallet')}</div><div class="row-main"><div class="row-title" style="font-weight:500">${name}</div><div class="row-sub">${detail}</div></div></div>`; },

  /* DEPARTMENTS  (mirrors GET/POST/PATCH/DELETE /departments)
     DepartmentOut fields: public_id, branch_public_id, department_name,
       department_code, parent_department_public_id,
       head_user_public_id, is_active */
  Departments(el){
    this._backTo='setup'; this.ctx.sub=true; this.ctx.title='Departments'; this.ctx.subtitle='Organisation structure';
    this.ctx.action=`<button class="appbar-btn" onclick="App.addDeptSheet()" aria-label="Add">${icon('plus')}</button>`;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    el.innerHTML=this._deptsMarkup();
  },
  _deptsMarkup(){
    const depts=this.F.departments();
    const active=depts.filter(d=>d.is_active);
    const inactive=depts.filter(d=>!d.is_active);
    const staff=typeof StaffDB!=='undefined'?StaffDB.staffUsers():[];
    const headName=pid=>{ if(!pid) return null; const u=staff.find(s=>s.id===pid); return u?u.name:null; };
    const parentName=pid=>{ if(!pid) return null; const d=this.F.departmentById(pid); return d?d.department_name:null; };
    const renderList=list=>`<div class="card card-pad-0 mb-4"><div class="list">${list.map(d=>{
      const head=headName(d.head_user_public_id);
      const parent=parentName(d.parent_department_public_id);
      return `<div class="row" style="cursor:default">
        <div class="avatar avatar-sq" style="background:${d.is_active?'var(--info-subtle)':'var(--surface-sunken)'};color:${d.is_active?'var(--info)':'var(--text-tertiary)'}">${icon('briefcase')}</div>
        <div class="row-main">
          <div class="row-title" style="font-weight:500${d.is_active?'':';color:var(--text-tertiary)'}">${d.department_name} <span class="t-code" style="font-size:11px;font-weight:400">${d.department_code}</span></div>
          <div class="row-sub">${[head?'Head: '+head:null,parent?'Under: '+parent:null].filter(Boolean).join(' · ')||'No head assigned'}</div>
        </div>
        <div class="flex gap-2 items-center">
          <button class="appbar-btn" onclick="App.editDeptSheet('${d.public_id}')" aria-label="Edit">${icon('edit')}</button>
          ${d.is_active
            ? `<button class="appbar-btn" style="color:var(--danger)" onclick="App._deleteDept('${d.public_id}')" aria-label="Delete">${icon('trash')}</button>`
            : `<button class="btn btn-sm btn-secondary" onclick="App._updateDept('${d.public_id}',{is_active:true})">Activate</button>`}
        </div>
      </div>`;
    }).join('')}</div></div>`;
    if(depts.length===0) return `
      <div class="state" style="min-height:35vh">
        <div class="state-ill">${icon('briefcase')}</div>
        <div class="state-title">No departments yet</div>
        <div class="state-msg">Add your first department to organise staff by function — Academics, Finance, Administration, etc.</div>
      </div>
      <button class="btn btn-primary btn-full" onclick="App.addDeptSheet()">${icon('plus')} Add department</button>`;
    return `
      ${active.length>0?`<div class="sec-head"><div class="sec-title">Active (${active.length})</div></div>${renderList(active)}`:''}
      ${inactive.length>0?`<div class="sec-head"><div class="sec-title">Inactive (${inactive.length})</div></div>${renderList(inactive)}`:''}
      <button class="btn btn-primary btn-full" onclick="App.addDeptSheet()">${icon('plus')} Add department</button>
    `;
  },
  addDeptSheet(){
    const branches=this.F.branches().filter(b=>b.is_active);
    const parentOptions=this.F.activeDepartments();
    const staff=typeof StaffDB!=='undefined'?StaffDB.staffUsers():[];
    const {close}=UI.sheet(`
      <div class="sheet-title">Add department</div>
      <div class="field"><label class="field-label">Department name <span class="req">*</span></label>
        <input class="input" id="dept-name" placeholder="e.g. Academics, Finance, Library"></div>
      <div class="field"><label class="field-label">Department code <span class="req">*</span></label>
        <input class="input t-code" id="dept-code" placeholder="e.g. ACAD, FIN" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
        <div class="field-hint">Short unique code used in reports.</div></div>
      <div class="field"><label class="field-label">Branch <span class="req">*</span></label>
        <select class="select" id="dept-branch">
          ${branches.map(b=>`<option value="${b.public_id||b.id}">${b.branch_name||b.name}</option>`).join('')}
        </select></div>
      ${parentOptions.length>0?`<div class="field"><label class="field-label">Parent department</label>
        <select class="select" id="dept-parent">
          <option value="">— None (top level) —</option>
          ${parentOptions.map(d=>`<option value="${d.public_id}">${d.department_name}</option>`).join('')}
        </select></div>`:''}
      ${staff.length>0?`<div class="field"><label class="field-label">Department head</label>
        <select class="select" id="dept-head">
          <option value="">— Not assigned —</option>
          ${staff.map(s=>`<option value="${s.id}">${s.name} · ${s.designation}</option>`).join('')}
        </select></div>`:''}
      <div id="dept-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveDept()">Add department</button>
    `);
    this._deptClose=close;
  },
  _saveDept(){
    const name=document.getElementById('dept-name').value.trim();
    const code=document.getElementById('dept-code').value.trim().toUpperCase();
    const branch=document.getElementById('dept-branch')?.value||'BR-01';
    const parent=document.getElementById('dept-parent')?.value||null;
    const head=document.getElementById('dept-head')?.value||null;
    const err=document.getElementById('dept-err');
    if(!name||!code){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Name and code are required.</div>`; return; }
    const result=this.F.addDepartment({
      department_name:name, department_code:code,
      branch_public_id:branch,
      parent_department_public_id:parent||null,
      head_user_public_id:head||null,
    });
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._deptClose&&this._deptClose();
    this.Departments(document.getElementById('screen'));
    UI.toast(`"${result.department_name}" added`);
  },
  editDeptSheet(pid){
    const d=this.F.departmentById(pid); if(!d) return;
    const staff=typeof StaffDB!=='undefined'?StaffDB.staffUsers():[];
    const {close}=UI.sheet(`
      <div class="sheet-title">Edit department</div>
      <div class="field"><label class="field-label">Department name</label>
        <input class="input" id="deptE-name" value="${d.department_name}"></div>
      ${staff.length>0?`<div class="field"><label class="field-label">Department head</label>
        <select class="select" id="deptE-head">
          <option value="">— Not assigned —</option>
          ${staff.map(s=>`<option value="${s.id}" ${d.head_user_public_id===s.id?'selected':''}>${s.name} · ${s.designation}</option>`).join('')}
        </select></div>`:''}
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._updateDeptFromSheet('${pid}')">Save changes</button>
    `);
    this._deptEditClose=close;
  },
  _updateDeptFromSheet(pid){
    const name=document.getElementById('deptE-name').value.trim();
    const head=document.getElementById('deptE-head')?.value||null;
    if(!name){ UI.toast('Name cannot be empty','error'); return; }
    this.F.updateDepartment(pid,{department_name:name,head_user_public_id:head||null});
    this._deptEditClose&&this._deptEditClose();
    this.Departments(document.getElementById('screen'));
    UI.toast('Department updated');
  },
  _updateDept(pid,patch){
    this.F.updateDepartment(pid,patch);
    this.Departments(document.getElementById('screen'));
  },
  _deleteDept(pid){
    const d=this.F.departmentById(pid); if(!d) return;
    UI.confirm({title:`Delete "${d.department_name}"?`,
      message:'This removes the department permanently. Staff currently in this department will show no department.',
      confirmText:'Delete',danger:true
    }).then(ok=>{
      if(!ok) return;
      const result=this.F.deleteDepartment(pid);
      if(result&&result.error){ UI.toast(result.error,'error'); return; }
      this.Departments(document.getElementById('screen'));
      UI.toast(`"${d.department_name}" deleted`);
    });
  },

  /* BRANCHES  (mirrors GET/POST /branches + PATCH /branches/{id})
     BranchOut: public_id, branch_name, branch_code, address fields,
                country_code, geo_lat, geo_lng, is_active
     No DELETE endpoint exists in the API — branches are deactivated only. */
  Branches(el){
    this._backTo='setup'; this.ctx.sub=true; this.ctx.title='Branches'; this.ctx.subtitle='Campuses & locations';
    this.ctx.action=`<button class="appbar-btn" onclick="App.addBranchSheet()" aria-label="Add">${icon('plus')}</button>`;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    el.innerHTML=this._branchesMarkup();
  },
  _branchesMarkup(){
    const branches=this.F.branches();
    if(branches.length===0) return `
      <div class="state" style="min-height:35vh">
        <div class="state-ill">${icon('building2')}</div>
        <div class="state-title">No branches</div>
        <div class="state-msg">Add a new campus or location. Every school starts with one main branch.</div>
      </div>
      <button class="btn btn-primary btn-full" onclick="App.addBranchSheet()">${icon('plus')} Add branch</button>`;
    return `
      <p class="t-caption mb-3">Branches are physical campuses. Each branch has its own departments, staff, and students. The branch switcher at the top of your dashboard filters all reports.</p>
      <div class="card card-pad-0 mb-4"><div class="list">${branches.map(b=>{
        const addr=[b.address_line1,b.city,b.state].filter(Boolean).join(', ');
        return `<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:${b.is_active?'var(--brand-subtle)':'var(--surface-sunken)'};color:${b.is_active?'var(--brand)':'var(--text-tertiary)'}">${icon('building2')}</div>
          <div class="row-main">
            <div class="row-title" style="font-weight:500">${b.branch_name||b.name} <span class="t-code" style="font-size:11px;font-weight:400">${b.branch_code||b.code}</span></div>
            <div class="row-sub">${addr||'No address set'}</div>
          </div>
          <div class="flex gap-2 items-center">
            <button class="appbar-btn" onclick="App.editBranchSheet('${b.public_id||b.id}')" aria-label="Edit">${icon('edit')}</button>
            <span class="chip ${b.is_active?'chip-success':'chip-neutral'}">${b.is_active?'Active':'Inactive'}</span>
          </div>
        </div>`;
      }).join('')}</div></div>
      <button class="btn btn-primary btn-full" onclick="App.addBranchSheet()">${icon('plus')} Add branch</button>
      <div class="dashed-card mt-3">${icon('shield')} <span class="t-caption">Branches cannot be deleted — only deactivated. All historical data is preserved.</span></div>
    `;
  },
  addBranchSheet(){
    const {close}=UI.sheet(`
      <div class="sheet-title">Add branch</div>
      <div class="field"><label class="field-label">Branch name <span class="req">*</span></label>
        <input class="input" id="br-name" placeholder="e.g. North Campus, Velachery Branch"></div>
      <div class="field"><label class="field-label">Branch code <span class="req">*</span></label>
        <input class="input t-code" id="br-code" placeholder="e.g. NORTH, VCY" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
        <div class="field-hint">Short code used in reports and data exports.</div></div>
      <div class="field"><label class="field-label">Address</label>
        <input class="input" id="br-addr" placeholder="Street address"></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">City</label>
          <input class="input" id="br-city" placeholder="Chennai"></div>
        <div class="field"><label class="field-label">State</label>
          <input class="input" id="br-state" placeholder="Tamil Nadu"></div>
      </div>
      <div class="field"><label class="field-label">Postal code</label>
        <input class="input" id="br-pin" placeholder="600001" inputmode="numeric"></div>
      <div id="br-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveBranch()">Add branch</button>
    `);
    this._brClose=close;
  },
  _saveBranch(){
    const name=document.getElementById('br-name').value.trim();
    const code=document.getElementById('br-code').value.trim().toUpperCase();
    const err=document.getElementById('br-err');
    if(!name||!code){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Branch name and code are required.</div>`; return; }
    const result=this.F.addBranch({
      branch_name:name, branch_code:code,
      address_line1:document.getElementById('br-addr').value.trim()||null,
      city:document.getElementById('br-city').value.trim()||null,
      state:document.getElementById('br-state').value.trim()||null,
      postal_code:document.getElementById('br-pin').value.trim()||null,
      country_code:'IN',
    });
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._brClose&&this._brClose();
    this.Branches(document.getElementById('screen'));
    UI.toast(`"${result.branch_name}" added`);
  },
  editBranchSheet(pid){
    const b=this.F.branchById(pid); if(!b) return;
    const {close}=UI.sheet(`
      <div class="sheet-title">Edit branch</div>
      <div class="field"><label class="field-label">Branch name</label>
        <input class="input" id="brE-name" value="${b.branch_name||b.name||''}"></div>
      <div class="field"><label class="field-label">Address</label>
        <input class="input" id="brE-addr" value="${b.address_line1||''}"></div>
      <div class="grid-2">
        <div class="field"><label class="field-label">City</label>
          <input class="input" id="brE-city" value="${b.city||''}"></div>
        <div class="field"><label class="field-label">State</label>
          <input class="input" id="brE-state" value="${b.state||''}"></div>
      </div>
      <div class="field"><label class="field-label">Postal code</label>
        <input class="input" id="brE-pin" value="${b.postal_code||''}" inputmode="numeric"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="brE-active" ${b.is_active?'checked':''} style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="brE-active" class="field-label" style="margin:0">Branch is active</label>
      </div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveBranchEdit('${pid}')">Save changes</button>
    `);
    this._brEditClose=close;
  },
  _saveBranchEdit(pid){
    const name=document.getElementById('brE-name').value.trim();
    if(!name){ UI.toast('Branch name cannot be empty','error'); return; }
    this.F.updateBranch(pid,{
      branch_name:name,
      address_line1:document.getElementById('brE-addr').value.trim()||null,
      city:document.getElementById('brE-city').value.trim()||null,
      state:document.getElementById('brE-state').value.trim()||null,
      postal_code:document.getElementById('brE-pin').value.trim()||null,
      is_active:document.getElementById('brE-active').checked,
    });
    this._brEditClose&&this._brEditClose();
    this.Branches(document.getElementById('screen'));
    UI.toast('Branch updated');
  },

  /* FEE HEADS — mirrors GET /fees/heads + POST /fees/heads
     FeeHeadOut: head_name, is_refundable, is_active */
  FeeHeads(el){
    this._backTo='setup'; this.ctx.sub=true; this.ctx.title='Fee heads'; this.ctx.subtitle='Chargeable item types';
    this.ctx.action=`<button class="appbar-btn" onclick="App.addFeeHeadSheet()" aria-label="Add">${icon('plus')}</button>`;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    el.innerHTML=this._feeHeadsMarkup();
  },
  _feeHeadsMarkup(){
    const heads=this.F.feeHeads(); // show all, toggle active/inactive
    const active=heads.filter(h=>h.is_active); const inactive=heads.filter(h=>!h.is_active);
    return `
      <p class="t-caption mb-3">Fee heads are the named types of charges you bill students — Tuition, Transport, Activity fee, etc. Each structure bundles heads with amounts.</p>
      ${active.length===0?`<div class="state" style="min-height:20vh"><div class="state-ill">${icon('wallet')}</div><div class="state-title">No fee heads yet</div><div class="state-msg">Add your first fee head to start building fee structures.</div></div>`
        :`<div class="sec-head"><div class="sec-title">Active (${active.length})</div></div>
        <div class="card card-pad-0 mb-4"><div class="list">${active.map(h=>this._feeHeadRow(h)).join('')}</div></div>`}
      ${inactive.length>0?`<div class="sec-head"><div class="sec-title">Inactive (${inactive.length})</div></div>
        <div class="card card-pad-0 mb-4"><div class="list">${inactive.map(h=>this._feeHeadRow(h)).join('')}</div></div>`:''}
      <button class="btn btn-primary btn-full mt-2" onclick="App.addFeeHeadSheet()">${icon('plus')} Add fee head</button>
    `;
  },
  _feeHeadRow(h){
    return `<div class="row" style="cursor:default">
      <div class="avatar avatar-sq" style="background:${h.is_active?'var(--brand-subtle)':'var(--surface-sunken)'};color:${h.is_active?'var(--brand)':'var(--text-tertiary)'}">${icon('wallet')}</div>
      <div class="row-main">
        <div class="row-title" style="font-weight:500${h.is_active?'':';color:var(--text-tertiary)'}">${h.head_name}</div>
        <div class="row-sub">${h.is_refundable?'Refundable':'Non-refundable'}</div>
      </div>
      <button class="btn btn-sm btn-secondary" style="flex-shrink:0" onclick="App._toggleFeeHead('${h.public_id}')">
        ${h.is_active?'Deactivate':'Activate'}
      </button>
    </div>`;
  },
  addFeeHeadSheet(){
    const {close}=UI.sheet(`
      <div class="sheet-title">Add fee head</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">A fee head is one chargeable item type. You'll set amounts when building a structure.</p>
      <div class="field"><label class="field-label">Head name <span class="req">*</span></label>
        <input class="input" id="fh-name" placeholder="e.g. Library Fee, Lab Fee, Sports"></div>
      <div class="field" style="display:flex;gap:12px;align-items:center;padding:8px 0">
        <input type="checkbox" id="fh-refund" style="width:18px;height:18px;accent-color:var(--brand)">
        <label for="fh-refund" class="field-label" style="margin:0">Refundable (e.g. security deposit)</label>
      </div>
      <div id="fh-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._saveFeeHead()">Add fee head</button>
    `);
    this._fhClose=close;
  },
  _saveFeeHead(){
    const name=document.getElementById('fh-name').value.trim();
    const err=document.getElementById('fh-err');
    if(!name){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Fee head name is required.</div>`; return; }
    const result=this.F.addFeeHead({head_name:name,is_refundable:document.getElementById('fh-refund').checked});
    if(result.error){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} ${result.error}</div>`; return; }
    this._fhClose&&this._fhClose();
    this.FeeHeads(document.getElementById('screen'));
    UI.toast(`"${name}" added`);
  },
  _toggleFeeHead(id){
    const h=this.F.toggleFeeHead(id);
    document.getElementById('screen').innerHTML=this._feeHeadsMarkup();
    UI.toast(h.is_active?`"${h.head_name}" activated`:`"${h.head_name}" deactivated`);
  },

  /* FEE STRUCTURES  (mirrors GET/POST /fees/structures)
     FeeStructureOut: structure_name, head_lines[], total_amount */
  FeeStructures(el){
    this._backTo='setup'; this.ctx.sub=true; this.ctx.title='Fee structures'; this.ctx.subtitle='Head bundles with amounts';
    this.ctx.action=`<button class="appbar-btn" onclick="App.go('feeStructure',{sub:true,id:'new'})" aria-label="Create">${icon('plus')}</button>`;
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const structs=this.F.feeStructures();
    if(structs.length===0){
      el.innerHTML=`<div class="state"><div class="state-ill">${icon('chart')}</div>
        <div class="state-title">No fee structures yet</div>
        <div class="state-msg">A structure bundles fee heads with specific amounts for a class or branch. Create one to start billing students.</div>
        <button class="btn btn-primary btn-lg mt-2" onclick="App.go('feeStructure',{sub:true,id:'new'})">${icon('plus')} Create structure</button></div>`;
      return;
    }
    const active=structs.filter(s=>s.is_active); const inactive=structs.filter(s=>!s.is_active);
    const render=list=>`<div class="card card-pad-0"><div class="list">${list.map(s=>`
      <div class="row" onclick="App.go('feeStructure',{sub:true,id:'${s.public_id}'})">
        <div class="avatar avatar-sq" style="background:${s.is_active?'var(--success-subtle)':'var(--surface-sunken)'};color:${s.is_active?'var(--success)':'var(--text-tertiary)'}">${icon('chart')}</div>
        <div class="row-main">
          <div class="row-title">${s.structure_name}</div>
          <div class="row-sub">${s.head_lines.length} heads · Total ${fmt.money(parseFloat(s.total_amount))}</div>
        </div>
        <span class="row-chev">${icon('chevronR')}</span>
      </div>`).join('')}</div></div>`;
    el.innerHTML=`
      ${active.length>0?`<div class="sec-head"><div class="sec-title">Active (${active.length})</div></div>${render(active)}<p class="t-caption text-center mt-2 mb-4">Tap a structure to view or deactivate</p>`:''}
      ${inactive.length>0?`<div class="sec-head"><div class="sec-title">Inactive (${inactive.length})</div></div>${render(inactive)}<br>`:''}
      <button class="btn btn-primary btn-full" onclick="App.go('feeStructure',{sub:true,id:'new'})">${icon('plus')} Create structure</button>
    `;
  },

  /* FEE STRUCTURE DETAIL / CREATE  (mirrors FeeStructureCreate)
     head_lines[]: fee_head_name, amount, gst_percentage */
  FeeStructureDetail(el){
    const isNew=this.ctx.id==='new';
    this._backTo='feeStructures'; this.ctx.sub=true;
    this.ctx.title=isNew?'Create structure':'Structure detail'; this.ctx.subtitle='';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());

    if(!isNew){
      // VIEW existing structure
      const s=this.F.feeStructureById(this.ctx.id);
      if(!s){ el.innerHTML=`<div class="state"><div class="state-title">Not found</div></div>`; return; }
      el.innerHTML=`
        <div class="card card-raised mb-4">
          <div class="flex between items-center mb-3">
            <div class="t-h2">${s.structure_name}</div>

          </div>
