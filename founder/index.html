        </div>

        <div class="sec-head"><div class="sec-title">Head lines</div><span class="t-caption">${s.head_lines.length} items</span></div>
        <div class="card card-pad-0 mb-4"><div class="list">
          ${s.head_lines.map(l=>`<div class="row" style="cursor:default">
            <div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon('wallet')}</div>
            <div class="row-main"><div class="row-title">${l.fee_head_name}</div>
              ${parseFloat(l.gst_percentage)>0?`<div class="row-sub">GST ${l.gst_percentage}%</div>`:''}
            </div>
            <div class="t-data" style="font-weight:700">${fmt.money(parseFloat(l.line_total))}</div>
          </div>`).join('')}
          <div class="row" style="cursor:default;background:var(--surface-sunken)">
            <div class="flex-1 row-title" style="font-weight:700">Total</div>
            <div class="t-data" style="font-weight:800;color:var(--brand)">${fmt.money(parseFloat(s.total_amount))}</div>
          </div>
        </div></div>

        <button class="btn ${s.is_active?'btn-danger-soft':'btn-primary'} btn-full"
          onclick="App._toggleFeeStructure('${s.public_id}')">
          ${s.is_active?icon('ban')+' Deactivate structure':icon('check')+' Activate structure'}
        </button>
      `;
      return;
    }

    // CREATE new structure
    if(!this._fsLines) this._fsLines=[]; // draft lines
    const heads=this.F.activeFeeHeads();
    if(heads.length===0){
      el.innerHTML=`<div class="state"><div class="state-ill">${icon('wallet')}</div>
        <div class="state-title">No fee heads yet</div>
        <div class="state-msg">You need at least one fee head before creating a structure.</div>
        <button class="btn btn-primary mt-2" onclick="App.go('feeHeads')">${icon('plus')} Add fee heads first</button></div>`;
      return;
    }
    el.innerHTML=`
      <div class="field"><label class="field-label">Structure name <span class="req">*</span></label>
        <input class="input" id="fs-name" placeholder="e.g. Primary 2026-27, Class 6–8 Annual"></div>
      <div class="field"><label class="field-label">Class level</label>
        <select class="select" id="fs-class">
          <option value="">All class levels (applies school-wide)</option>
          ${(this.S.academic().classLevels||[]).map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}
        </select></div>

      <div class="sec-head mt-2"><div class="sec-title">Fee lines</div>
        <span class="t-caption" id="fs-total">${this._fsTotalStr()}</span></div>
      <div id="fs-lines" class="card card-pad-0 mb-3"><div class="list">
        ${this._fsLinesMarkup(heads)}
      </div></div>
      <button class="btn btn-secondary btn-full mb-4" onclick="App.addFeeLinePicker()">${icon('plus')} Add line</button>

      <div id="fs-err"></div>
      <button class="btn btn-primary btn-full btn-lg" onclick="App._saveFeeStructure()">
        ${icon('check')} Create structure
      </button>
    `;
  },
  _fsLinesMarkup(heads){
    if(!this._fsLines||!this._fsLines.length) return `<div class="row" style="cursor:default;color:var(--text-tertiary)"><div class="row-main"><div class="row-title" style="font-weight:400">No lines yet — tap "Add line"</div></div></div>`;
    const headMap=Object.fromEntries((heads||this.F.activeFeeHeads()).map(h=>[h.head_name,h]));
    return this._fsLines.map((l,i)=>`<div class="row" style="cursor:default">
      <div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon('wallet')}</div>
      <div class="row-main"><div class="row-title">${l.fee_head_name}</div>
        ${parseFloat(l.gst_percentage)>0?`<div class="row-sub">GST ${l.gst_percentage}%</div>`:''}
      </div>
      <div class="flex items-center gap-2">
        <span class="t-data" style="font-weight:700">${fmt.money(parseFloat(l.amount))}</span>
        <button class="appbar-btn" style="width:32px;height:32px" onclick="App._removeFsLine(${i})">${icon('trash')}</button>
      </div>
    </div>`).join('');
  },
  _fsTotalStr(){
    if(!this._fsLines||!this._fsLines.length) return 'No items';
    const total=this._fsLines.reduce((s,l)=>s+parseFloat(l.amount||0)*(1+(parseFloat(l.gst_percentage||0)/100)),0);
    return `Total ${fmt.money(Math.round(total))}`;
  },
  addFeeLinePicker(){
    const heads=this.F.activeFeeHeads();
    const used=new Set((this._fsLines||[]).map(l=>l.fee_head_name));
    const avail=heads.filter(h=>!used.has(h.head_name));
    if(!avail.length){ UI.toast('All active fee heads are already added'); return; }
    const {close}=UI.sheet(`
      <div class="sheet-title">Add fee line</div>
      <div class="field"><label class="field-label">Fee head <span class="req">*</span></label>
        <select class="select" id="fl-head">
          <option value="">— Select —</option>
          ${avail.map(h=>`<option value="${h.head_name}">${h.head_name}${h.is_refundable?' (refundable)':''}</option>`).join('')}
        </select></div>
      <div class="field"><label class="field-label">Amount (₹) <span class="req">*</span></label>
        <input class="input" id="fl-amount" type="number" min="0" step="100" placeholder="e.g. 18000"></div>
      <div class="field"><label class="field-label">GST %</label>
        <input class="input" id="fl-gst" type="number" min="0" max="28" step="0.5" placeholder="0" value="0"></div>
      <div id="fl-err"></div>
      <button class="btn btn-primary btn-full btn-lg mt-3" onclick="App._addFsLine()">Add line</button>
    `);
    this._flClose=close;
  },
  _addFsLine(){
    const head=document.getElementById('fl-head').value;
    const amount=document.getElementById('fl-amount').value;
    const gst=document.getElementById('fl-gst').value||'0';
    const err=document.getElementById('fl-err');
    if(!head||!amount){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Fee head and amount are required.</div>`; return; }
    if(parseFloat(amount)<=0){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Amount must be greater than zero.</div>`; return; }
    this._fsLines=this._fsLines||[];
    this._fsLines.push({fee_head_name:head,amount:String(parseFloat(amount)),gst_percentage:String(parseFloat(gst)||0)});
    this._flClose&&this._flClose();
    // refresh lines and total
    const heads=this.F.activeFeeHeads();
    document.getElementById('fs-lines').innerHTML=`<div class="list">${this._fsLinesMarkup(heads)}</div>`;
    const tot=document.getElementById('fs-total'); if(tot) tot.textContent=this._fsTotalStr();
  },
  _removeFsLine(idx){
    this._fsLines.splice(idx,1);
    const heads=this.F.activeFeeHeads();
    document.getElementById('fs-lines').innerHTML=`<div class="list">${this._fsLinesMarkup(heads)}</div>`;
    const tot=document.getElementById('fs-total'); if(tot) tot.textContent=this._fsTotalStr();
  },
  _saveFeeStructure(){
    const name=document.getElementById('fs-name').value.trim();
    const cls=document.getElementById('fs-class').value||null;
    const err=document.getElementById('fs-err');
    if(!name){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Structure name is required.</div>`; return; }
    if(!this._fsLines||!this._fsLines.length){ err.innerHTML=`<div class="field-error mb-2">${icon('alert')} Add at least one fee line.</div>`; return; }
    const struct=this.F.addFeeStructure({structure_name:name,class_level_public_id:cls,head_lines:this._fsLines});
    this._fsLines=[];
    UI.toast(`"${struct.structure_name}" created — ${fmt.money(parseFloat(struct.total_amount))} total`);
    this.go('feeStructure',{sub:true,id:struct.public_id});
  },
  _toggleFeeStructure(id){
    const s=this.F.toggleFeeStructure(id);
    this.FeeStructureDetail(document.getElementById('screen'));
    UI.toast(s.is_active?`"${s.structure_name}" activated`:`"${s.structure_name}" deactivated`);
  },

  /* ---- NOTIFICATIONS (GET /notifications/templates + PUT /notifications/preferences) ---- */
  Notifications(el){
    this._backTo='settings'; this.ctx.sub=true; this.ctx.title='Notifications'; this.ctx.subtitle='Templates & preferences';
    document.querySelector('.appbar')?.remove(); document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    this._notifTab=this._notifTab||'preferences';
    el.innerHTML=`
      <div class="tabs mb-4">

        <button class="${this._notifTab==='templates'?'active':''}" onclick="App._notifTab='templates';App.Notifications(document.getElementById('screen'))">Templates</button>
      </div>
      <div id="notif-body">${this._notifTab==='preferences'?this._notifPrefsMarkup():this._notifTemplatesMarkup()}</div>
    `;
  },
  _notifPrefsMarkup(){
    /* Renders a per-event × per-channel toggle grid.
       Each toggle calls PUT /notifications/preferences {event_category, channel, is_enabled}  */
    const prefs=this.F.notifPrefs();
    const byEvent={};
    prefs.forEach(p=>{ (byEvent[p.event_category]=byEvent[p.event_category]||[]).push(p); });
    const CHANNELS=['email','sms','whatsapp','push'];
    const eventLabels={'FEE_REMINDER':'Fee reminder','ATTENDANCE_ALERT':'Attendance alert',
      'LEAVE_DECISION':'Leave decision','EXAM_SCHEDULE':'Exam schedule','PAYMENT_RECEIPT':'Payment receipt'};
    return `
      <p class="t-caption mb-4">Control which channels receive each type of notification. A toggle ON means the platform will send that notification via that channel.</p>
      <div class="card card-pad-0 mb-4">
        <!-- header row -->
        <div class="row" style="cursor:default;background:var(--surface-sunken)">
          <div class="row-main"></div>
          ${CHANNELS.map(c=>`<div style="width:44px;text-align:center;font-size:11px;font-weight:600;color:var(--text-secondary)">${c[0].toUpperCase()+c.slice(1,3)}</div>`).join('')}
        </div>
        ${Object.keys(byEvent).map(ev=>{
          const label=eventLabels[ev]||ev;
          return `<div class="row" style="cursor:default">
            <div class="row-main"><div class="row-title" style="font-weight:500;font-size:14px">${label}</div></div>
            ${CHANNELS.map(ch=>{
              const pref=prefs.find(p=>p.event_category===ev&&p.channel===ch);
              const on=pref?pref.is_enabled:false;
              return `<div style="width:44px;display:flex;justify-content:center">
                <button onclick="App._togglePref('${ev}','${ch}')"
                  style="width:28px;height:16px;border-radius:99px;border:none;cursor:pointer;transition:all .2s;
                  background:${on?'var(--brand)':'var(--border-strong)'}">
                  <span style="display:block;width:12px;height:12px;border-radius:50%;background:#fff;transition:all .2s;
                    transform:translateX(${on?'14':'2'}px)"></span>
                </button>
              </div>`;
            }).join('')}
          </div>`;
        }).join('')}
      </div>
      <div class="dashed-card">${icon('sparkle')} <span class="t-caption">Enabling a channel here requires that channel to be configured in your platform plan. SMS, WhatsApp, and Push need Pro or above.</span></div>
    `;
  },
  _togglePref(event_category,channel){
    const prefs=this.F.notifPrefs();
    const pref=prefs.find(p=>p.event_category===event_category&&p.channel===channel);
    const newVal=pref?!pref.is_enabled:true;
    this.F.updatePref(event_category,channel,newVal);
    document.getElementById('notif-body').innerHTML=this._notifPrefsMarkup();
    UI.toast(`${event_category} via ${channel} ${newVal?'enabled':'disabled'}`);
  },
  _notifTemplatesMarkup(){
    /* Shows templates grouped by event, per channel.
       Each toggle calls PATCH /notifications/templates/{code}/{channel}  */
    const byEvent=this.F.templatesByEvent();
    const eventLabels={'FEE_REMINDER':'Fee reminder','ATTENDANCE_ALERT':'Attendance alert',
      'LEAVE_DECISION':'Leave decision','EXAM_SCHEDULE':'Exam schedule','PAYMENT_RECEIPT':'Payment receipt'};
    const channelIcon={email:'mail',sms:'phone',whatsapp:'phone',push:'bell',internal:'shield'};
    return `
      <p class="t-caption mb-4">Templates define the content sent for each event and channel. Toggle a template off to suppress that channel for the event without affecting preferences.</p>
      ${Object.keys(byEvent).map(ev=>{
        const label=eventLabels[ev]||ev;
        const tmpls=byEvent[ev];
        return `<div class="sec-head"><div class="sec-title">${label}</div></div>
          <div class="card card-pad-0 mb-4"><div class="list">
          ${tmpls.map(t=>`<div class="row" style="cursor:default">
            <div class="avatar avatar-sq" style="background:${t.is_active?'var(--brand-subtle)':'var(--surface-sunken)'};color:${t.is_active?'var(--brand)':'var(--text-tertiary)'}">${icon(channelIcon[t.channel]||'bell')}</div>
            <div class="row-main">
              <div class="row-title" style="font-weight:500">${t.channel[0].toUpperCase()+t.channel.slice(1)}</div>
              <div class="row-sub" style="white-space:normal;line-height:1.3">${(t.body_template||'').slice(0,60)}…</div>
            </div>
            <button onclick="App._toggleTemplate('${t.template_code}','${t.channel}')"
              style="flex-shrink:0;width:44px;height:24px;border-radius:99px;border:none;cursor:pointer;
              background:${t.is_active?'var(--brand)':'var(--border-strong)'}">
              <span style="display:block;width:18px;height:18px;border-radius:50%;background:#fff;margin:3px;transition:all .2s;
                transform:translateX(${t.is_active?'18':'0'}px)"></span>
            </button>
          </div>`).join('')}
          </div></div>`;
      }).join('')}
    `;
  },
  _toggleTemplate(template_code,channel){
    const t=this.F.notifTemplates().find(x=>x.template_code===template_code&&x.channel===channel);
    if(!t) return;
    this.F.updateTemplate(template_code,channel,{is_active:!t.is_active});
    document.getElementById('notif-body').innerHTML=this._notifTemplatesMarkup();
    UI.toast(`${template_code} via ${channel} ${!t.is_active?'enabled':'disabled'}`);
  },

  /* ---- theme sheet (shared pattern) ---- */
  themes:[['violet','Violet','#7C5CFF','Default'],['indigo','Indigo','#4F46E5',''],['emerald','Emerald','#059669',''],['slate','Slate','#475569',''],['amber','Warm Amber','#D97706',''],['contrast','High Contrast','#1D4ED8','Accessibility']],
  themeName(k){ return (this.themes.find(t=>t[0]===k)||[])[1]||k; },
  openThemeSheet(){
    const st=this.F.settings();
    const {el,close}=UI.sheet(`<div class="sheet-title">Appearance</div>
      <div class="segmented mb-4" id="modeSeg">${[['light','Light'],['dark','Dark'],['system','Auto']].map(([k,l])=>`<button class="${st.mode===k?'active':''}" onclick="App.setMode('${k}')">${l}</button>`).join('')}</div>
      <div class="field-label mb-2">Theme</div><div id="themeList"></div>
      <button class="btn btn-secondary btn-full mt-4" onclick="App._themeClose()">Done</button>`);
    this._themeSheetEl=el; this._themeClose=close; this._renderThemeList();
  },
  _renderThemeList(){
    const st=this.F.settings();
    this._themeSheetEl.querySelector('#themeList').innerHTML=this.themes.map(([k,name,col,tag])=>`
      <div class="row" style="border:none;padding:10px 4px" onclick="App.setTheme('${k}')">
        <div style="width:36px;height:36px;border-radius:50%;background:${col};border:2px solid var(--border-subtle);flex-shrink:0"></div>
        <div class="row-main"><div class="row-title" style="font-weight:600">${name}</div>${tag?`<div class="row-sub">${tag}</div>`:''}</div>
        ${st.theme===k?`<span style="color:var(--brand)">${icon('check')}</span>`:''}</div>`).join('');
  },
  setTheme(k){ this.F.updateSettings({theme:k}); this.applyTheme(k,this.F.settings().mode); this._renderThemeList(); },
  setMode(k){ this.F.updateSettings({mode:k}); this.applyTheme(this.F.settings().theme,k); this._themeSheetEl.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().startsWith(k==='system'?'auto':k))); },

  /* ---- misc ---- */
  notImplemented(w){ UI.toast((w||'This')+' — demonstrated in a later stage','error'); },
  confirmLogout(){ UI.confirm({title:'Sign out?',message:'You will need to sign in again.',confirmText:'Sign out',danger:true}).then(ok=>{ if(ok){ Auth.logout(); location.reload(); } }); },
  resetPrompt(){ UI.confirm({title:'Reset demo data?',message:'The demo school data will be regenerated.',confirmText:'Reset',danger:true}).then(ok=>{ if(ok){ this.F.reset(); this.route='dashboard'; this.ctx={}; this.render(); UI.toast('Demo data reset'); } }); },
};
App.init();
</script>
</body>
</html>
