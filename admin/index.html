<!DOCTYPE html>
<html lang="en" data-theme="violet" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>EduERP · ERP Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div class="viewport">
  <div class="proto-banner" onclick="App.resetPrompt()">◆ ERP ADMIN PROTOTYPE · tap to reset demo data</div>
  <div id="app"></div>
</div>

<script src="../shared/data.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/auth-screens.js"></script>
<script>
/* ============================================================================
   ERP ADMIN — Single Page Application
   Screens: Login · Dashboard · Organizations (list/detail) · Onboard wizard ·
   Reports · Profile.  Every screen has real logic and real states.
   ============================================================================ */
const App = {
  route:'dashboard',
  ctx:{},
  systemDark:window.matchMedia('(prefers-color-scheme:dark)').matches,
  // simulate a network fetch so Loading states are real (prototype realism)
  loadingMs:600,

  init(){
    const s=DB.getSettings();
    this.applyTheme(s.theme||'violet', s.mode||'system');
    window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',e=>{this.systemDark=e.matches;const st=DB.getSettings();if((st.mode||'system')==='system')this.applyTheme(st.theme,'system');});
    if(Auth.isAdmin()) this.render(); else this.renderLogin();
  },

  applyTheme(theme,mode){
    document.documentElement.dataset.theme=theme;
    const m = mode==='system' ? (this.systemDark?'dark':'light') : mode;
    document.documentElement.dataset.mode=m;
  },

  /* ========================================================================
     LOGIN
     ======================================================================== */
  renderLogin(){
    AuthScreens.Login(document.getElementById('app'),{
      app:'admin', title:'ERP Admin', subtitle:'Sign in to onboard schools and manage the platform.',
      badge:'Platform Console', badgeIcon:'shield', orgCodeVisible:false,
      demoIdentifier:'admin@nextgeneduerp.com', demoPassword:'demo1234',
      onSuccess:(user)=>{ this.route='dashboard'; this.render(); UI.toast('Welcome back, '+user.name.split(' ')[0]); }
    });
  },
  logout(){ Auth.logout(); this.renderLogin(); },

  /* ========================================================================
     SHELL (brand header + content + bottom tabs)
     ======================================================================== */
  render(){
    document.getElementById('app').innerHTML=this.Shell();
    this.mountScreen();
  },
  Shell(){
    const tabs=[
      {k:'dashboard',ic:'home',label:'Home'},
      {k:'organizations',ic:'building',label:'Schools'},
      {k:'reports',ic:'chart',label:'Reports'},
      {k:'settings',ic:'settings',label:'Settings'},
    ];
    const s=Auth.getSession();
    const isWizard = this.route==='onboard';
    return `
      ${this.AppBar()}
      <div class="content fade-in" id="screen"></div>
      ${['dashboard','organizations'].includes(this.route)?`<button class="fab" onclick="App.go('onboard')" aria-label="Onboard school">${icon('plus')}</button>`:''}
      ${isWizard?'':`<div class="tabbar">
        ${tabs.map(t=>`<button class="tab ${this.route===t.k?'active':''}" onclick="App.go('${t.k}')">${icon(t.ic)}<span>${t.label}</span></button>`).join('')}
      </div>`}`;
  },
  AppBar(){
    // sub-pages (detail, onboard) show a back button + contextual title
    const sub={organization:'Organization',onboard:'Onboard school'};
    if(this.ctx.sub){
      return `<div class="appbar sub">
        <button class="appbar-btn" onclick="App.back()" aria-label="Back">${icon('chevronL')}</button>
        <div class="appbar-id"><div class="appbar-title">${this.ctx.title||''}</div>${this.ctx.subtitle?`<div class="appbar-sub">${this.ctx.subtitle}</div>`:''}</div>
      </div>`;
    }
    const s=Auth.getSession();
    const titles={dashboard:'ERP Admin',organizations:'Organizations',reports:'Reports',settings:'Settings'};
    return `<div class="appbar">
      <div class="appbar-logo">${icon('logo')}</div>
      <div class="appbar-id">
        <div class="appbar-title">${titles[this.route]||'ERP Admin'}</div>
        <div class="appbar-sub">${icon('shield')} Platform Console</div>
      </div>
      <button class="appbar-btn" onclick="App.notImplemented('Notifications')" aria-label="Alerts">${icon('bell')}<span class="appbar-dot"></span></button>
      <div class="appbar-avatar" style="background:${avatarColor(s&&s.name?s.name:'Admin')}" onclick="App.go('settings')">${s&&s.avatar?s.avatar:initials(s&&s.name?s.name:'A')}</div>
    </div>`;
  },

  /* navigation */
  go(route,ctx={}){ this.route=route; this.ctx=ctx; this.render(); },
  back(){ this.ctx={}; this.route=this._backTo||'dashboard'; this.render(); },
  mountScreen(){
    const el=document.getElementById('screen');
    switch(this.route){
      case 'dashboard': return this.Dashboard(el);
      case 'organizations': return this.Organizations(el);
      case 'organization': return this.OrgDetail(el);
      case 'onboard': return this.Onboard(el);
      case 'reports': return this.Reports(el);
      case 'settings': return this.Settings(el);
    }
  },

  /* fake async load to exercise real Loading states */
  withLoading(el,skeleton,build){
    el.innerHTML=skeleton;
    setTimeout(()=>{ el.innerHTML=build(); },this.loadingMs);
  },

  /* ========================================================================
     DASHBOARD  (Loading → Empty | Content)
     ======================================================================== */
  Dashboard(el){
    const sk=`
      <div class="grid-2 mb-3">${'<div class="kpi"><div class="sk sk-line" style="width:50%"></div><div class="sk" style="height:26px;width:40%;margin:8px 0"></div></div>'.repeat(4)}</div>
      <div class="card"><div class="sk" style="height:128px"></div></div>`;
    this.withLoading(el,sk,()=>{
      const sum=DB.organizationsSummary();
      if(sum.total_organizations===0){
        return `<div class="state">
          <div class="state-ill">${icon('building2')}</div>
          <div class="state-title">No schools yet</div>
          <div class="state-msg">Onboard your first school to bring the platform to life. Metrics, trends, and reports appear here as schools join.</div>
          <button class="btn btn-primary btn-lg mt-2" onclick="App.go('onboard')">${icon('plus')} Onboard a school</button>
        </div>`;
      }
      const p=sum.active_subscriptions_by_plan;
      const activeTotal=p.BASIC+p.PRO+p.ENTERPRISE;
      const trend=sum.onboarding_trend; const max=Math.max(1,...trend.map(t=>t.count));
      const recent=DB.orgs().slice(-4).reverse();
      return `
        <div class="grid-2 mb-3">
          ${this.kpiCard('building2','Total schools',sum.total_organizations,'brand',activeTotal+' with active subscription')}
          ${this.kpiCard('shield','Basic',p.BASIC,'neutral','')}
        </div>
        <div class="grid-2 mb-4">
          ${this.kpiCard('sparkle','Pro',p.PRO,'success','')}
          ${this.kpiCard('star','Enterprise',p.ENTERPRISE,'info','')}
        </div>

        <div class="card card-raised mb-4">
          <div class="flex between items-center mb-4"><div class="sec-title">Onboarding trend</div><span class="t-caption">Last 6 months</span></div>
          ${trend.every(t=>t.count===0)
            ? `<div class="text-center" style="padding:24px;color:var(--text-tertiary)"><div class="mb-2">${icon('chart')}</div><div class="t-caption">Schools onboarded this month will appear here</div></div>`
            : `<div class="chart-bars">${trend.map(t=>`<div class="bar-col"><div class="bar-val">${t.count||''}</div><div class="bar" style="height:${(t.count/max)*100}%"></div><div class="bar-label">${t.label}</div></div>`).join('')}</div>`}
        </div>

        <div class="sec-head"><div class="sec-title">Recent schools</div><button class="sec-link" onclick="App.go('organizations')">View all</button></div>
        <div class="card card-pad-0 mb-4"><div class="list">${recent.map(o=>this.orgRow(o)).join('')}</div></div>

        <div class="dashed-card">${icon('sparkle')} <span class="t-label" style="color:var(--text-tertiary)">AI platform insights arrive with Enterprise tier</span></div>
      `;
    });
  },
  kpiCard(ic,label,value,tone,sub){
    const toneMap={brand:'var(--brand-subtle);color:var(--brand)',info:'var(--info-subtle);color:var(--info)',success:'var(--success-subtle);color:var(--success)',neutral:'var(--surface-sunken);color:var(--text-secondary)'};
    return `<div class="kpi">
      <div class="kpi-icon" style="background:${toneMap[tone]}">${icon(ic)}</div>
      <div class="kpi-label">${label}</div>
      <div class="kpi-value">${value}</div>
      ${sub?`<div class="kpi-sub">${sub}</div>`:''}
    </div>`;
  },
  planChip(plan){
    const p=(plan||'').toUpperCase();
    return p==='ENTERPRISE'?'chip-info':p==='PRO'?'chip-success':'chip-neutral';
  },
  planLabel(plan){ const p=(plan||'').toUpperCase(); return p==='ENTERPRISE'?'Enterprise':p==='PRO'?'Pro':'Basic'; },
  orgRow(o){
    return `<div class="row" onclick="App.openOrg('${o.id}')">
      <div class="avatar avatar-sq" style="background:${avatarColor(o.name)}">${initials(o.name)}</div>
      <div class="row-main">
        <div class="row-title">${o.name}</div>
        <div class="row-sub">${o.city} · <span class="t-code">${o.code}</span></div>
      </div>
      <div class="row-trail">
        <span class="chip ${this.planChip(o.plan)}">${this.planLabel(o.plan)}</span>
        ${o.status!=='active'?'<span class="chip chip-danger" style="margin-top:2px">Inactive</span>':''}
      </div>
      <span class="row-chev">${icon('chevronR')}</span>
    </div>`;
  },
  /* reusable error state — call when a network/data error occurs on any screen */
  errorState(msg,retryFn){
    return `<div class="state">
      <div class="state-ill err">${icon('alert')}</div>
      <div class="state-title">Something went wrong</div>
      <div class="state-msg">${msg||'We couldn\u2019t load this data. Check your connection and try again.'}</div>
      <button class="btn btn-secondary btn-lg mt-2" onclick="${retryFn||'location.reload()'}">Try again</button>
    </div>`;
  },

  /* ========================================================================
     ORGANIZATIONS  (Loading → Empty | Content, search + filter)
     ======================================================================== */
  Organizations(el){
    this._backTo='dashboard';
    this._orgFilter=this._orgFilter||'all';
    this._orgSearch=this._orgSearch||'';
    const sk=`<div class="sk" style="height:48px;margin-bottom:16px"></div><div class="filter-row">${'<div class="sk sk-line" style="width:64px;height:32px;border-radius:99px"></div>'.repeat(4)}</div>${'<div class="sk-row"><div class="sk sk-circle"></div><div style="flex:1"><div class="sk sk-line" style="width:60%"></div><div class="sk sk-line" style="width:40%"></div></div></div>'.repeat(5)}`;
    this.withLoading(el,sk,()=>this.orgsMarkup());
  },
  orgsMarkup(){
    const all=DB.orgs();
    if(all.length===0){
      return `<div class="state">
        <div class="state-ill">${icon('building2')}</div>
        <div class="state-title">No schools onboarded</div>
        <div class="state-msg">Tap the + button to onboard your first school. It becomes active immediately and its founder can log in.</div>
        <button class="btn btn-primary btn-lg mt-2" onclick="App.go('onboard')">${icon('plus')} Onboard a school</button>
      </div>`;
    }
    // Matches GET /platform/organizations?search=&plan=&status= params exactly
    const f=this._orgFilter||'all'; const q=(this._orgSearch||'').toLowerCase();
    let list=all.filter(o=>{
      const mf = f==='all'
        || (f==='active' && o.status==='active')
        || (f==='inactive' && o.status==='inactive')
        || (o.plan.toUpperCase()===f.toUpperCase());
      const mq = !q || o.name.toLowerCase().includes(q)
        || (o.city||'').toLowerCase().includes(q)
        || (o.code||'').toLowerCase().includes(q);
      return mf&&mq;
    });
    // Mirrors PlatformOrganizationListMeta fields: total, active_subscriptions
    const meta={total:all.length, active_subscriptions:all.filter(x=>x.status==='active').length};
    const filters=[['all','All '+all.length],['active','Active'],['BASIC','Basic'],['PRO','Pro'],['ENTERPRISE','Enterprise'],['inactive','Inactive']];
    const hasFilter=f!=='all'||q;
    return `
      <div class="input-affix mb-3">
        <span style="position:absolute;left:14px;color:var(--text-tertiary);display:grid">${icon('search')}</span>
        <input class="input" style="padding-left:42px" placeholder="Search schools, city, code…"
          value="${this._orgSearch||''}"
          oninput="App._searchOrgsDebounced(this.value)"
          id="org-search">
      </div>
      <div class="filter-row mb-1">
        ${filters.map(([k,l])=>`<button class="filter-chip ${f===k?'active':''}" onclick="App.filterOrgs('${k}')">${l}</button>`).join('')}
      </div>
      <div class="flex between items-center mb-3">
        <span class="t-caption">${list.length} of ${meta.total} schools · ${meta.active_subscriptions} active</span>
        ${hasFilter?`<button class="sec-link" style="background:none;border:none;cursor:pointer" onclick="App.clearOrgFilters()">Clear filters</button>`:''}
      </div>
      ${list.length===0
        ? `<div class="state" style="min-height:40vh">
            <div class="state-ill">${icon('search')}</div>
            <div class="state-title">No matches</div>
            <div class="state-msg">No schools match "${this._orgSearch||f}". Try a different search term or clear the filter.</div>
            <button class="btn btn-secondary mt-2" onclick="App.clearOrgFilters()">Clear filters</button>
          </div>`
        : `<div class="card card-pad-0""><div class="list">${list.map(o=>this.orgRow(o)).join('')}</div></div>`}
    `;
  },
  _searchOrgsDebounced(v){
    clearTimeout(this._orgSearchTimer);
    this._orgSearchTimer=setTimeout(()=>{
      this._orgSearch=v;
      const el=document.getElementById('screen'); const scroll=el.scrollTop;
      el.innerHTML=this.orgsMarkup(); el.scrollTop=scroll;
      const inp=document.getElementById('org-search');
      if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);}
    },250);
  },
  searchOrgs(v){ this._orgSearch=v; const el=document.getElementById('screen'); const scroll=el.scrollTop; el.innerHTML=this.orgsMarkup(); el.scrollTop=scroll; const inp=el.querySelector('input'); if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);} },
  filterOrgs(k){ this._orgFilter=k; document.getElementById('screen').innerHTML=this.orgsMarkup(); },
  clearOrgFilters(){ this._orgFilter='all'; this._orgSearch=''; document.getElementById('screen').innerHTML=this.orgsMarkup(); },

  /* ========================================================================
     ORG DETAIL  (Overview + Subscription, plan change)
     ======================================================================== */
  openOrg(id){ this.go('organization',{sub:true,id,title:'',tab:'overview'}); this._backFrom=this.route; },
  OrgDetail(el){
    const o=DB.getById(DB.COLS.ORGS,this.ctx.id);
    if(!o){ el.innerHTML=`<div class="state"><div class="state-ill err">${icon('alert')}</div><div class="state-title">Not found</div><div class="state-msg">This school no longer exists.</div><button class="btn btn-secondary mt-2" onclick="App.go('organizations')">Back to schools</button></div>`; return; }
    // set header title dynamically
    this.ctx.title=o.name; this.ctx.subtitle=`<span class="t-code">${o.code}</span> · ${o.city}`;
    document.querySelector('.appbar')?.remove();
    document.getElementById('app').insertAdjacentHTML('afterbegin',this.AppBar());
    const tab=this.ctx.tab||'overview';
    const chipCls=o.plan==='Enterprise'?'chip-info':o.plan==='Pro'?'chip-success':'chip-neutral';
    el.innerHTML=`
      <div class="card card-raised mb-4">
        <div class="flex gap-3 items-center">
          <div class="avatar avatar-sq" style="width:56px;height:56px;font-size:16px;background:${avatarColor(o.name)}">${initials(o.name)}</div>
          <div class="flex-1">
            <div class="t-h2" style="line-height:1.2">${o.name}</div>
            <div class="row-sub mt-1">${icon('mapPin')} ${o.city}</div>
          </div>
        </div>
        <div class="flex gap-2 mt-4">
          <span class="chip ${chipCls}">${o.plan}</span>
          <span class="chip ${o.status==='active'?'chip-success':'chip-danger'}"><span class="chip-dot"></span>${o.status==='active'?'Active':'Inactive'}</span>
        </div>
      </div>
      <div class="tabs mb-4">
        <button class="${tab==='overview'?'active':''}" onclick="App.orgTab('overview')">Overview</button>
        <button class="${tab==='subscription'?'active':''}" onclick="App.orgTab('subscription')">Subscription</button>
      </div>
      <div id="orgTab"></div>`;
    this.renderOrgTab(o,tab);
  },
  orgTab(t){ this.ctx.tab=t; const o=DB.getById(DB.COLS.ORGS,this.ctx.id);
    document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='overview')||(i===1&&t==='subscription')));
    this.renderOrgTab(o,t);
  },
  renderOrgTab(o,t){
    const box=document.getElementById('orgTab');
    if(t==='overview'){
      // Mirrors PlatformOrganizationDetailOut: display_name, legal_name, org_code,
      // is_active, onboarded_at, student_count, staff_count, branch_count, branches[]
      const branches=o.branches||[{branch_code:o.code||'BR-01',branch_name:o.branch||'Main Campus',is_active:true}];
      box.innerHTML=`
        <div class="card mb-4"><div class="dl">
          <div class="dl-row"><span class="dl-key">Display name</span><span class="dl-val">${o.name}</span></div>
          <div class="dl-row"><span class="dl-key">Legal name</span><span class="dl-val">${o.legal_name||o.name}</span></div>
          <div class="dl-row"><span class="dl-key">Org code</span><span class="dl-val t-code">${o.code}</span></div>
          <div class="dl-row"><span class="dl-key">City</span><span class="dl-val">${o.city||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Academic year</span><span class="dl-val">${o.academicYear||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Onboarded</span><span class="dl-val">${fmt.date(o.onboardedAt)}</span></div>
        </div></div>

        <div class="sec-head"><div class="sec-title">Scale</div></div>
        <div class="grid-2 mb-4">
          <div class="kpi">${icon('users')}<div class="kpi-label">Students</div><div class="kpi-value">${fmt.num(o.students||0)}</div></div>
          <div class="kpi">${icon('briefcase')}<div class="kpi-label">Staff</div><div class="kpi-value">${o.staff_count||0}</div></div>
        </div>
        <div class="grid-2 mb-4">
          <div class="kpi">${icon('building2')}<div class="kpi-label">Branches</div><div class="kpi-value">${o.branch_count||branches.length}</div></div>
          <div class="kpi">${icon('shield')}<div class="kpi-label">Plan</div><div class="kpi-value" style="font-size:16px">${this.planLabel(o.plan)}</div></div>
        </div>

        <div class="sec-head"><div class="sec-title">Branches</div></div>
        <div class="card card-pad-0 mb-4"><div class="list">
          ${branches.map(b=>`<div class="row" style="cursor:default">
            <div class="avatar avatar-sq" style="background:var(--brand-subtle);color:var(--brand)">${icon('building2')}</div>
            <div class="row-main"><div class="row-title">${b.branch_name||b.name||'Branch'}</div><div class="row-sub t-code">${b.branch_code||b.code||'—'}</div></div>
            <span class="chip ${b.is_active!==false?'chip-success':'chip-neutral'}">${b.is_active!==false?'Active':'Inactive'}</span>
          </div>`).join('')}
        </div></div>

        <button class="btn ${o.status==='active'?'btn-danger-soft':'btn-primary'} btn-full" onclick="App.toggleOrgStatus('${o.id}')">
          ${icon(o.status==='active'?'ban':'power')} ${o.status==='active'?'Deactivate school':'Reactivate school'}
        </button>`;
    } else {
      const founder=DB.getBy(DB.COLS.FOUNDERS,'orgId',o.id)[0];
      const changes=DB.getBy(DB.COLS.PLANS,'orgId',o.id).reverse();
      box.innerHTML=`
        <div class="card mb-4">
          <div class="flex between items-center mb-3"><div class="t-h3">Current plan</div><span class="chip ${this.planChip(o.plan)}">${this.planLabel(o.plan)}</span></div>
          <p class="t-caption mb-4">${this.planBlurb(o.plan)}</p>
          <button class="btn btn-primary btn-full" onclick="App.openPlanSheet('${o.id}')">${icon('trend')} Change plan</button>
        </div>
        ${founder?`<div class="sec-head"><div class="sec-title">Founder login</div></div>
        <div class="card card-pad-0 mb-4"><div class="row" style="border:none">
          <div class="avatar" style="background:${avatarColor(founder.name)}">${initials(founder.name)}</div>
          <div class="row-main"><div class="row-title">${founder.name}</div><div class="row-sub">${founder.email}</div></div>
          <span class="chip chip-success"><span class="chip-dot"></span>Active</span>
        </div></div>`:''}
        ${changes.length?`<div class="sec-head"><div class="sec-title">Plan history</div></div>
        <div class="card card-pad-0"><div class="list">${changes.map(c=>`<div class="row" style="cursor:default">
          <div class="avatar avatar-sq" style="background:var(--surface-sunken);color:var(--text-secondary)">${icon('trend')}</div>
          <div class="row-main"><div class="row-title">${this.planLabel(c.from)} → ${this.planLabel(c.to)}</div><div class="row-sub">${c.reason||'No note'} · ${fmt.ago(c.createdAt)}</div></div>
        </div>`).join('')}</div></div>`:''}
      `;
    }
  },
  planBlurb(p){ const pu=(p||'').toUpperCase(); return pu==='ENTERPRISE'?'Everything in Pro + true white-label branding.':pu==='PRO'?'Everything in Basic + the Parent app.':'3 apps: ERP Admin, Founder, Staff. Core operations.'; },
  toggleOrgStatus(id){
    const o=DB.getById(DB.COLS.ORGS,id);
    const isActive=o.status==='active';
    if(isActive){
      // deactivate: collect a reason (important operational context)
      const {close}=UI.sheet(`
        <div class="sheet-title">Deactivate school?</div>
        <p class="text-secondary mb-4" style="margin-top:-8px"><b>${o.name}</b> will immediately lose access to all apps. Their data is preserved and the school can be reactivated at any time.</p>
        <div class="field"><label class="field-label">Reason <span class="req">*</span></label>
          <select class="select" id="deact-reason">
            <option value="">Select a reason</option>
            <option>Non-payment — subscription lapsed</option>
            <option>School requested suspension</option>
            <option>Policy violation</option>
            <option>Duplicate account</option>
            <option>Other</option>
          </select>
        </div>
        <div id="deact-err"></div>
        <button class="btn btn-danger-soft btn-full btn-lg mt-2" onclick="App._confirmDeactivate('${id}')">
          ${icon('ban')} Deactivate
        </button>
        <button class="btn btn-secondary btn-full mt-3" onclick="App._deactClose()">Cancel</button>
      `);
      this._deactClose=close;
    }else{
      UI.confirm({
        title:'Reactivate school?',
        message:`${o.name} will immediately regain access to all apps under their current plan.`,
        confirmText:'Reactivate'
      }).then(ok=>{
        if(!ok)return;

    DB.update(DB.COLS.ORGS,id,{status:'inactive',deactivatedAt:new Date().toISOString(),deactivationReason:reason});
    this._deactClose&&this._deactClose();
    const o=DB.getById(DB.COLS.ORGS,id);
    UI.toast(o.name+' deactivated · '+reason);

  openPlanSheet(id){
    const o=DB.getById(DB.COLS.ORGS,id);
    // plan codes match ChangeSubscriptionRequest{plan_code: string}
    const plans=[
      ['BASIC','Basic','3 apps · ERP Admin, Founder, Staff. Core operations.','chip-neutral'],
      ['PRO','Pro','Everything in Basic, plus the Parent app.','chip-success'],
      ['ENTERPRISE','Enterprise','Everything in Pro, plus true white-label branding.','chip-info'],
    ];
    const cur=o.plan.toUpperCase();
    const {close}=UI.sheet(`
      <div class="sheet-title">Change plan</div>
      <p class="text-secondary mb-4" style="margin-top:-8px">Changing the plan is immediate. The school's access tier updates as soon as you confirm.</p>
      ${plans.map(([code,label,desc,chip])=>`

  _confirmPlanChange(id,planCode,planLabel){
    const o=DB.getById(DB.COLS.ORGS,id);

    if(o.plan.toUpperCase()===planCode){ this._planSheetClose&&this._planSheetClose(); return; }

    UI.confirm({
      title:`Switch to ${planLabel}?`,
      message:`${o.name} will move from ${curLabel} to ${planLabel} immediately. Downgrading may remove access to features currently in use.`,
      confirmText:`Confirm — switch to ${planLabel}`,
      danger:planCode==='BASIC'&&o.plan.toUpperCase()!=='BASIC' // downgrade is destructive
    }).then(ok=>{
      if(!ok)return;

    } else if(s===2){

        <p class="text-secondary mb-4">This creates the school owner's login — they can sign in to the Founder app immediately.</p>
        <div class="field"><label class="field-label">Founder's full name <span class="req">*</span></label>
          <input class="input" id="w-fname" value="${d.founderName||''}" placeholder="Rajesh Kumar"></div>
        <div class="field"><label class="field-label">Founder's login email <span class="req">*</span></label>
          <input class="input" id="w-femail" type="email" value="${d.founderEmail||''}" placeholder="rajesh@sunrise.edu"></div>
        <div class="field"><label class="field-label">Temporary password <span class="req">*</span></label>

         session_label, session_start_date, session_end_date, plan_code        */
      const d=this.wiz.data;
      body=`
        <div class="sec-head"><div class="sec-title">First branch</div></div>
        <div class="field"><label class="field-label">Branch name <span class="req">*</span></label>
          <input class="input" id="w-branch" value="${d.branchName||'Main Campus'}" placeholder="Main Campus"></div>
        <div class="field"><label class="field-label">Branch code <span class="req">*</span></label>
          <input class="input t-code" id="w-bcode" value="${d.branchCode||'MAIN'}" placeholder="MAIN" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
          <div class="field-hint">Short code used in reports and data exports.</div></div>

        <div class="sec-head"><div class="sec-title">Academic session</div></div>
        <div class="field"><label class="field-label">Session label <span class="req">*</span></label>
          <input class="input" id="w-session" value="${d.sessionLabel||''}" placeholder="2026-27"></div>
        <div class="grid-2">
          <div class="field"><label class="field-label">Start date <span class="req">*</span></label>
            <input class="input" id="w-sdate" type="date" value="${d.sessionStartDate||''}"></div>
          <div class="field"><label class="field-label">End date <span class="req">*</span></label>
            <input class="input" id="w-edate" type="date" value="${d.sessionEndDate||''}"></div>
        </div>

        <div class="sec-head"><div class="sec-title">Subscription plan</div></div>
        <div class="field">
          <div class="segmented" id="w-plan">
            ${['Basic','Pro','Enterprise'].map(p=>`<button class="${(d.plan||'Basic')===p?'active':''}" onclick="App.wizPlan('${p}')">${p}</button>`).join('')}
          </div>
          <div class="field-hint" id="w-plan-hint">${this.planBlurb(d.plan||'Basic')}</div>
        </div>
      `;
    } else {
      /* Review — mirrors OnboardOrganizationOut fields for what will be created */
      const d=this.wiz.data;
      body=`
        <p class="text-secondary mb-4">Review everything before creating. This operation creates the school, founder login, branch, and academic session atomically — it cannot be undone.</p>
        <div class="sec-head"><div class="sec-title">School</div></div>
        <div class="card mb-4"><div class="dl">

          <div class="dl-row"><span class="dl-key">Contact email</span><span class="dl-val">${d.primaryContactEmail||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">City</span><span class="dl-val">${d.city||'—'}</span></div>

        <div class="card mb-4"><div class="dl">
          <div class="dl-row"><span class="dl-key">Name</span><span class="dl-val">${d.founderName||'—'}</span></div>
          <div class="dl-row"><span class="dl-key">Email</span><span class="dl-val">${d.founderEmail||'—'}</span></div>
        </div></div>

          <div class="dl-row"><span class="dl-key">Branch</span><span class="dl-val">${d.branchName||'—'} <span class="t-code">${d.branchCode||''}</span></span></div>

          <div class="dl-row"><span class="dl-key">Session dates</span><span class="dl-val">${d.sessionStartDate||'—'} → ${d.sessionEndDate||'—'}</span></div>

    </div>`;
    el.innerHTML=`<div class="wiz-flow"><div class="wiz-body">${stepper}<div class="fade-in">${body}</div></div>${footer}</div>`;

  wizPlan(p){
    this.wiz.data.plan=p;
    document.querySelectorAll('#w-plan button').forEach(b=>b.classList.toggle('active',b.textContent===p));
    const hint=document.getElementById('w-plan-hint');
    if(hint) hint.textContent=this.planBlurb(p);
  },
  _saveStep(){
    const s=this.wiz.step, d=this.wiz.data, g=id=>{ const el=document.getElementById(id); return el?el.value.trim():''; };
    if(s===1){
      d.schoolName=g('w-name'); d.legalName=g('w-legal');
      d.orgCode=g('w-code').toUpperCase(); d.primaryContactEmail=g('w-email');
      d.city=g('w-city'); d.address=g('w-addr');
    }
    if(s===2){ d.founderName=g('w-fname'); d.founderEmail=g('w-femail'); d.founderPassword=g('w-fpass'); }
    if(s===3){
      d.branchName=g('w-branch'); d.branchCode=g('w-bcode').toUpperCase();
      d.sessionLabel=g('w-session'); d.sessionStartDate=g('w-sdate'); d.sessionEndDate=g('w-edate');
    }
  },
  _validateStep(){
    const s=this.wiz.step, d=this.wiz.data, errs=[];
    const emailRe=/^\S+@\S+\.\S+$/;
    if(s===1){
      if(!d.schoolName) errs.push('w-name');
      if(!d.legalName) errs.push('w-legal');
      if(!d.orgCode){ errs.push('w-code'); }
      else if(DB.orgs().some(o=>o.code===d.orgCode)){ this._wizErr='That organization code is already taken.'; errs.push('w-code'); }
      if(!d.primaryContactEmail || !emailRe.test(d.primaryContactEmail)){ errs.push('w-email'); if(d.primaryContactEmail) this._wizErr='Enter a valid contact email.'; }
      if(!d.city) errs.push('w-city');
    }
    if(s===2){
      if(!d.founderName) errs.push('w-fname');
      if(!d.founderEmail || !emailRe.test(d.founderEmail)){ errs.push('w-femail'); if(d.founderEmail) this._wizErr='Enter a valid founder email.'; }
      else if(DB.getAll(DB.COLS.FOUNDERS).some(f=>f.email.toLowerCase()===d.founderEmail.toLowerCase())){ this._wizErr='A founder with that email already exists.'; errs.push('w-femail'); }
      if(!d.founderPassword || d.founderPassword.length<6){ errs.push('w-fpass'); if(d.founderPassword) this._wizErr='Password must be at least 6 characters.'; }
    }
    if(s===3){
      if(!d.branchName) errs.push('w-branch');
      if(!d.branchCode) errs.push('w-bcode');
      if(!d.sessionLabel) errs.push('w-session');
      if(!d.sessionStartDate) errs.push('w-sdate');
      if(!d.sessionEndDate) errs.push('w-edate');
      if(d.sessionStartDate && d.sessionEndDate && d.sessionEndDate<=d.sessionStartDate){ this._wizErr='End date must be after start date.'; errs.push('w-edate'); }
    }
    return errs;
  },
  wizNext(){
    this._saveStep(); this._wizErr='';
    const errs=this._validateStep();
    if(errs.length){
      errs.forEach(id=>document.getElementById(id)?.classList.add('error'));
      UI.toast(this._wizErr||'Please complete the required fields.','error'); this._wizErr='';
      return;
    }
    if(this.wiz.step<4){ this.wiz.step++; this.renderWizard(); }
    else this.wizSubmit();
  },
  wizBack(){ this._saveStep(); if(this.wiz.step>1){ this.wiz.step--; this.renderWizard(); } },
  wizSubmit(){
    const btn=document.querySelector('#screen .btn-primary:last-child');
    if(btn){ btn.textContent='Creating…'; btn.disabled=true; }
    setTimeout(()=>{
      const d=this.wiz.data;
      const {org,founder}=DB.onboardSchool({
        schoolName:d.schoolName, legalName:d.legalName,
        orgCode:d.orgCode, primaryContactEmail:d.primaryContactEmail,
        city:d.city, address:d.address,
        founderName:d.founderName, founderEmail:d.founderEmail, founderPassword:d.founderPassword,
        branchName:d.branchName, branchCode:d.branchCode,
        sessionLabel:d.sessionLabel, sessionStartDate:d.sessionStartDate, sessionEndDate:d.sessionEndDate,
        academicYear:d.sessionLabel, plan:d.plan||'Basic'
      });
      document.getElementById('screen').innerHTML=`<div class="state fade-in">
        <div class="state-ill pos">${icon('checkCircle')}</div>
        <div class="state-title">${org.name} is live</div>
        <div class="state-msg">
          <b>${founder.name}</b> can now sign in to the Founder app with
          <span class="t-code">${founder.email}</span>.
          Branch <b>${d.branchName}</b> and session <b>${d.sessionLabel}</b> are ready.
        </div>
        <div class="flex gap-3 mt-4" style="width:100%">
          <button class="btn btn-secondary btn-full" onclick="App.go('dashboard')">Done</button>
          <button class="btn btn-primary btn-full" onclick="App.openOrg('${org.id}')">View school</button>
        </div>
      </div>`;
      UI.toast('School onboarded successfully');
    },700);
  },

  Reports(el){
    this._backTo='dashboard';
    const sk=`${'<div class="card mb-3"><div class="sk sk-line" style="width:50%"></div><div class="sk" style="height:80px;margin-top:12px"></div></div>'.repeat(3)}`;
    this.withLoading(el,sk,()=>{
      const c=DB.planCounts();
      if(c.total===0){
        return `<div class="state">
          <div class="state-ill">${icon('chart')}</div>
          <div class="state-title">No data to report yet</div>

        </div>`;
      }
      // Report 1: plan distribution (donut) — composition → donut
      const seg=[['Basic',c.basic,'var(--viz-1)'],['Pro',c.pro,'var(--viz-2)'],['Enterprise',c.enterprise,'var(--viz-3)']].filter(x=>x[1]>0);

      const trend=DB.onboardingTrend(); const max=Math.max(1,...trend.map(t=>t.count));
      // Report 3: active vs inactive (comparison)

      return `
        <p class="t-caption mb-4">${icon('shield')} Platform reports · export-ready · real data only</p>

        <div class="card mb-4">
          <div class="flex between items-center mb-4"><div class="t-h3">Plan distribution</div><button class="btn btn-sm btn-secondary" onclick="App.notImplemented('Export')">Export</button></div>
          <div class="flex gap-4 items-center">
            <div class="donut" style="background:conic-gradient(${stops})"><div class="donut-center"><div><div class="t-data-lg">${c.total}</div><div class="t-caption">schools</div></div></div></div>
            <div class="donut-legend">${seg.map(([l,v,col])=>`<div class="legend-item"><span class="legend-dot" style="background:${col}"></span><span class="flex-1">${l}</span><span class="t-data" style="font-weight:700">${v}</span></div>`).join('')}</div>
          </div>
        </div>

        <div class="card mb-4">
          <div class="flex between items-center mb-4"><div class="t-h3">Onboarding trend</div><button class="btn btn-sm btn-secondary" onclick="App.notImplemented('Export')">Export</button></div>
          <div class="chart-bars">${trend.map(t=>`<div class="bar-col"><div class="bar-val">${t.count||''}</div><div class="bar" style="height:${(t.count/max)*100}%"></div><div class="bar-label">${t.label}</div></div>`).join('')}</div>
        </div>

        <div class="card">
          <div class="flex between items-center mb-4"><div class="t-h3">Active vs inactive</div><button class="btn btn-sm btn-secondary" onclick="App.notImplemented('Export')">Export</button></div>
          <div class="flex gap-3">
            <div class="flex-1 text-center" style="padding:16px;background:var(--success-subtle);border-radius:var(--r-md)"><div class="t-data-lg" style="color:var(--success)">${c.active}</div><div class="t-caption">Active</div></div>
            <div class="flex-1 text-center" style="padding:16px;background:${inactive?'var(--danger-subtle)':'var(--surface-sunken)'};border-radius:var(--r-md)"><div class="t-data-lg" style="color:${inactive?'var(--danger)':'var(--text-tertiary)'}">${inactive}</div><div class="t-caption">Inactive</div></div>
          </div>
        </div>
      `;
    });

  themes:[['violet','Violet','#7C5CFF','Default'],['indigo','Indigo','#4F46E5',''],['emerald','Emerald','#059669',''],['slate','Slate','#475569',''],['amber','Warm Amber','#D97706',''],['contrast','High Contrast','#1D4ED8','Accessibility']],
  themeName(k){ return (this.themes.find(t=>t[0]===k)||[])[1]||k; },
  openThemeSheet(){

          <div style="width:36px;height:36px;border-radius:50%;background:${col};border:2px solid var(--border-subtle);flex-shrink:0"></div>
          <div class="row-main"><div class="row-title" style="font-weight:600">${name}</div>${tag?`<div class="row-sub">${tag}</div>`:''}</div>
          ${st.theme===k?`<span style="color:var(--brand)">${icon('check')}</span>`:''}
        </div>`).join('')}</div>
      <button class="btn btn-secondary btn-full mt-4" onclick="App._themeClose()">Done</button>
    `);
    this._themeSheetEl=el; this._themeClose=close;
  },
  setTheme(k){ DB.updateSettings({theme:k}); this.applyTheme(k,DB.getSettings().mode); this._refreshThemeSheet(); },
  setMode(k){ DB.updateSettings({mode:k}); this.applyTheme(DB.getSettings().theme,k); this._refreshThemeSheet(); },
  _refreshThemeSheet(){
    const st=DB.getSettings();
    // update mode segment
    this._themeSheetEl.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.textContent.toLowerCase().startsWith(st.mode==='system'?'auto':st.mode)));
    // update theme checks
    const list=this._themeSheetEl.querySelector('#themeList');
    list.innerHTML=this.themes.map(([k,name,col,tag])=>`
      <div class="row" style="border:none;padding:10px 4px" onclick="App.setTheme('${k}')">
        <div style="width:36px;height:36px;border-radius:50%;background:${col};border:2px solid var(--border-subtle);flex-shrink:0"></div>
        <div class="row-main"><div class="row-title" style="font-weight:600">${name}</div>${tag?`<div class="row-sub">${tag}</div>`:''}</div>
        ${st.theme===k?`<span style="color:var(--brand)">${icon('check')}</span>`:''}
      </div>`).join('');
  },
  confirmLogout(){ UI.confirm({title:'Sign out?',message:'You will need to sign in again to access the console.',confirmText:'Sign out',danger:true}).then(ok=>{ if(ok)this.logout(); }); },

  /* ========================================================================
     MISC
     ======================================================================== */
  notImplemented(what){ UI.toast((what||'This')+' — demonstrated in a later stage','error'); },
  resetPrompt(){ UI.confirm({title:'Reset demo data?',message:'All onboarded schools will be cleared. Only the platform admin remains.',confirmText:'Reset',danger:true}).then(ok=>{ if(ok){ DB.reset(); this.route='dashboard'; this.ctx={}; this.render(); UI.toast('Demo data reset'); } }); },
};
App.init();
</script>
</body>
</html>
